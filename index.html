<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狼人殺上帝專用小幫手 (Vue 3 終極擴充版)</title>
    <!-- 引入 Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- 引入 html2canvas 供戰報匯出圖片使用 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* =========================================
            共用及版面樣式
        ========================================= */
        :root {
            --bg-main: #1e1e1e;
            --text-main: #f0f0f0;
            --panel-bg: #2a2a2a;
            --border-color: #444;
            --color-wolf: #ff4d4d;
            --color-god: #c879ff;
            --color-villager: #ffcc00;
            --color-good: #4da6ff;
            --color-unknown: #888;
            --btn-primary: #2196F3;
            --btn-success: #4CAF50;
            --btn-danger: #ff4d4d;
            --btn-secondary: #555;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            padding: 15px; 
            max-width: 600px; 
            margin: 0 auto; 
            line-height: 1.5; 
            text-align: center; 
        }

        h2, h3, p { text-align: center; margin-top: 10px; margin-bottom: 10px; }
        h2 { border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-top: 5px; }
        
        .action-row { margin: 0 auto 15px auto; background: var(--panel-bg); padding: 18px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-align: center; }
        
        button { 
            padding: 12px 16px; font-size: 16px; border-radius: 6px; border: none; outline: none;
            background-color: var(--btn-success); color: white; cursor: pointer; 
            font-weight: bold; transition: all 0.2s ease; user-select: none;
        }
        button:active { transform: scale(0.95); filter: brightness(0.7); }
        button:disabled { opacity: 0.5; pointer-events: none; filter: grayscale(100%); }
        
        .nav-buttons { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
        .nav-buttons button { flex: 1; }
        .btn-prev { background-color: var(--btn-secondary); }

        .color-wolf { color: var(--color-wolf); font-weight: bold; }
        .color-god { color: var(--color-god); font-weight: bold; }
        .color-villager { color: var(--color-villager); font-weight: bold; }
        .color-good { color: var(--color-good); font-weight: bold; }
        .color-unknown { color: var(--color-unknown); }
        
        /* 存活狀態 Badge */
        .status-badge { background: #333; padding: 6px 10px; border-radius: 6px; border: 1px solid #555; display: inline-block; white-space: nowrap; font-size: 14px; margin: 0 auto; transition: all 0.3s; }
        .dead { text-decoration: line-through; opacity: 0.5; background-color: #1a1a1a !important; color: #666 !important; border-color: #333 !important; }

        /* 設定區塊 */
        .player-count-grid { display: flex; justify-content: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
        .player-count-btn { padding: 12px 18px; border: 2px solid var(--border-color); border-radius: 8px; background: #333; color: #ccc; cursor: pointer; font-weight: bold; }
        .player-count-btn.selected { border-color: var(--color-good); background: rgba(77, 166, 255, 0.15); color: white; }

        .role-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .role-card { flex: 0 0 calc(50% - 5px); box-sizing: border-box; padding: 12px 4px; border: 2px solid var(--border-color); border-radius: 8px; text-align: center; cursor: pointer; background: #333; color: #ccc; white-space: nowrap; font-size: 15px; }
        .role-card.god.selected { border-color: var(--color-god); background: rgba(200, 121, 255, 0.15); color: white; font-weight: bold; }
        .role-card.wolf.selected { border-color: var(--color-wolf); background: rgba(255, 77, 77, 0.15); color: white; font-weight: bold; }
        .role-card.villager.selected { border-color: var(--color-villager); background: rgba(255, 204, 0, 0.15); color: white; font-weight: bold; }

        /* 下拉選單強制置中 */
        select { 
            font-size: 16px; 
            padding: 6px; 
            border-radius: 4px; 
            width: max-content; 
            margin: 0 auto; 
            display: inline-block; 
            text-align: center; 
            text-align-last: center; 
        }
        select option { text-align: center; }

        /* 玩家網格選單 */
        .player-grid-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 10px auto; }
        .player-grid-btn { flex: 0 0 calc(33.33% - 8px); box-sizing: border-box; padding: 12px 6px; border: 2px solid var(--border-color); border-radius: 8px; text-align: center; cursor: pointer; background: #333; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .player-grid-btn.selected { border-color: var(--btn-primary); background: rgba(33, 150, 243, 0.2); color: white; }
        .player-grid-btn.danger-selected { border-color: var(--btn-danger); background: rgba(255, 77, 77, 0.2); color: white; }
        .player-grid-btn.disabled { opacity: 0.3; pointer-events: none; filter: grayscale(100%); }
        .player-grid-btn.zero-btn { flex: 1 1 100%; flex-direction: row; padding: 12px; color: #ccc; font-weight: bold; }
        .player-grid-btn .num { font-size: 20px; font-weight: bold; line-height: 1.2; }

        /* 女巫亮燈專用 UI */
        .witch-action-btn { cursor: pointer; background: #2a2a2a; padding: 12px; border-radius: 8px; width: 90%; border: 2px solid #555; text-align: center; margin: 0 auto; color: #ccc; font-weight: bold; transition: all 0.2s ease; display: block; box-sizing: border-box; }
        .witch-action-btn input[type="radio"] { display: none; }
        .witch-action-btn.active-heal { background: rgba(76, 175, 80, 0.2); border-color: var(--btn-success); color: white; box-shadow: 0 0 12px rgba(76, 175, 80, 0.6); }
        .witch-action-btn.active-poison { background: rgba(255, 77, 77, 0.2); border-color: var(--btn-danger); color: white; box-shadow: 0 0 12px rgba(255, 77, 77, 0.6); }
        .witch-action-btn.active-none { background: #444; border-color: #aaa; color: white; box-shadow: 0 0 10px rgba(170, 170, 170, 0.5); }
        .witch-action-btn.disabled { opacity: 0.4; pointer-events: none; filter: grayscale(100%); }

        .witch-alert-active { background: #442222; padding: 12px 24px; border-radius: 6px; border: 1px solid var(--btn-danger); margin: 0 auto 10px auto; width: fit-content; font-weight: bold;}
        .result-box { background: #333; padding: 12px 24px; margin: 10px auto; border-radius: 4px; text-align: center; width: fit-content; }
        
        .game-over-panel { background: #111; border: 2px solid #333; padding: 30px 20px; border-radius: 12px; margin-top: 20px; }
        .game-over-title { font-size: 28px; color: white; margin-bottom: 15px; font-weight: bold; }
        .log-box { background: #111; padding: 15px; border-radius: 8px; text-align: left; font-size: 15px; line-height: 1.8; color: #ddd; max-height: 350px; overflow-y: auto; border: 1px solid #444; margin-top: 15px;}
    </style>
</head>
<body>
    <div id="app">
        <!-- 組件化架構：三大主畫面切換 -->
        <setup-screen v-if="state.screen === 'setup'"></setup-screen>
        <game-over-screen v-else-if="state.screen === 'gameover'"></game-over-screen>
        <game-screen v-else-if="state.screen === 'game'"></game-screen>
    </div>

    <!-- ================= 模板 1：遊戲設定畫面 ================= -->
    <template id="setup-template">
        <div style="text-align:center; padding: 10px 0;">
            <div style="margin-bottom: 20px;">
                <label style="font-size: 18px; font-weight: bold;">玩家人數</label>
                <div class="player-count-grid">
                    <div v-for="count in [9, 10, 11, 12]" :key="count"
                         :class="['player-count-btn', { selected: state.playerCount === count }]"
                         @click="state.playerCount = count">
                        {{ count }} 人局
                    </div>
                </div>
            </div>
            
            <div style="background: var(--panel-bg); padding: 20px; border-radius: 8px; display: inline-block; width: 100%; box-sizing: border-box; margin: 0 auto;">
                <h3 style="margin-top: 0; margin-bottom: 5px; color: var(--color-god);">😇 配置神陣營</h3>
                <div style="color: white; font-size: 12px; font-weight: 300; border-bottom: 1px solid #555; padding-bottom: 10px; margin-bottom: 15px;">(選5張啟動百變狼王)</div>
                <div class="role-grid">
                    <div v-for="role in godRoles" :key="role.id"
                         :class="['role-card', role.type, { selected: state.activeRoles[role.id] }]" 
                         @click="toggleRole(role.id)">
                        {{ role.emoji }} {{ role.name }}
                    </div>
                </div>

                <h3 style="margin-top: 20px; border-bottom: 1px solid #555; padding-bottom: 10px; color: var(--color-wolf);">🐺 配置特殊狼人</h3>
                <div class="role-grid">
                    <div v-for="role in wolfMenuRoles" :key="role.id"
                         :class="['role-card', role.type, { selected: state.activeRoles[role.id] }]" 
                         @click="toggleRole(role.id)">
                        {{ role.emoji }} {{ role.name }}
                    </div>
                </div>

                <h3 style="margin-top: 20px; border-bottom: 1px solid #555; padding-bottom: 10px; color: var(--color-villager);">🧑‍🌾 配置特殊平民</h3>
                <div class="role-grid">
                    <div v-for="role in specialVillagerRoles" :key="role.id"
                         :class="['role-card', role.type, { selected: state.activeRoles[role.id] }]" 
                         @click="toggleRole(role.id)">
                        {{ role.emoji }} {{ role.name }}
                    </div>
                </div>

                <button @click="startGame" style="background-color: var(--btn-primary); font-size: 18px; padding: 12px 30px; margin: 20px auto 0 auto;">遊戲開始</button>
            </div>
        </div>
    </template>

    <!-- ================= 模板 2：遊戲結束與戰報 ================= -->
    <template id="game-over-template">
        <div class="game-over-panel">
            <div class="game-over-title">遊戲結束</div>
            <h2 style="border: none; margin-bottom: 20px;" 
                :style="{ color: state.gameOverResult.includes('好人') ? 'var(--color-good)' : 'var(--btn-danger)' }">
                {{ state.gameOverResult }}
            </h2>
            
            <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom: 25px;">
                <span v-for="p in state.players" :key="p.id" 
                      :class="['status-badge', getPlayerSetupInfo(p.id).class, { dead: !p.alive }]">
                    [{{ p.id }}號] {{ getPlayerSetupInfo(p.id).role }}
                    <span v-if="state.isDittoWolfKingMode && state.initialRoleSetup[state.dittoWolfKingRole] === p.id" style="color: #ff9800; margin-left: 2px;">(百變)</span>
                </span>
            </div>

            <h3 style="border-bottom: 1px solid #555; padding-bottom: 10px; color: #fff;">📜 完整戰報紀錄</h3>
            <div id="battle-report" class="log-box">
                <div v-for="(log, idx) in state.history" :key="idx" style="margin-bottom: 4px;" v-html="formatLog(log)"></div>
            </div>

            <div style="display: flex; gap: 15px; justify-content: center; margin-top: 30px;">
                <button @click="downloadReportAsImage" style="background-color: #4CAF50;">📸 下載戰報圖片</button>
                <button @click="reloadPage" style="background-color: var(--btn-primary);">重新開始新局</button>
            </div>
        </div>
    </template>

    <!-- ================= 模板 3：遊戲進行中 ================= -->
    <template id="game-template">
        <div>
            <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
                <h2 style="margin: 0; border: none; padding: 0;">第 {{ state.day }} 天 {{ state.isNight ? '夜晚' : '白天' }}</h2>
            </div>

            <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom: 20px;">
                <span v-for="p in state.players" :key="p.id" 
                      :class="['status-badge', getPlayerSetupInfo(p.id).class, { dead: !p.alive }]">
                    [{{ p.id }}號] {{ getPlayerSetupInfo(p.id).role }}
                    <span v-if="state.isDittoWolfKingMode && state.initialRoleSetup[state.dittoWolfKingRole] === p.id" style="color: #ff9800; margin-left: 2px;">(百變)</span>
                </span>
            </div>

            <!-- 🎁 幸運兒行動階段 -->
            <div v-show="state.currentPhase === 'giftedPlayerPhase'" class="action-row">
                <h3 class="color-god">🎁 幸運兒請睜眼</h3>
                <p v-if="state.giftedState.item === 'verify'">請使用 👁️ 放大鏡 (查驗) 技能：</p>
                <p v-if="state.giftedState.item === 'poison'">請使用 🧪 毒藥 (毒殺) 技能：</p>
                
                <div v-if="checkFeared([getPlayerSetupInfo(state.giftedState.id).role])">
                    <div class="witch-alert-active" style="color: white;">⚠️ 被夢魘恐懼無法使用技能</div>
                    <div class="player-grid-container">
                        <div class="player-grid-btn zero-btn selected">被恐懼無法行動</div>
                    </div>
                </div>
                <div v-else>
                    <div class="player-grid-container">
                        <div :class="['player-grid-btn zero-btn', { selected: state.nightRecords.giftedPlayerTarget === 0 }]" @click="state.nightRecords.giftedPlayerTarget = 0">不使用</div>
                        <div v-for="p in alivePlayers" :key="p.id" 
                             :class="['player-grid-btn', getPlayerSetupInfo(p.id).class, { selected: state.nightRecords.giftedPlayerTarget === p.id }]"
                             @click="state.nightRecords.giftedPlayerTarget = p.id">
                            <span class="num">{{ p.id }} <span style="font-size: 14px; font-weight: normal; margin-left: 2px;" v-if="getPlayerSetupInfo(p.id).role !== '未定'">{{ getPlayerSetupInfo(p.id).role }}</span></span>
                        </div>
                    </div>
                    <div v-if="state.giftedState.item === 'verify' && state.nightRecords.giftedPlayerTarget !== 0" class="witch-alert-active" style="margin-top: 15px; background: #222; border-color: #555;">
                        <span style="color:#aaa;">查驗結果：</span>
                        <span v-if="isWolfTarget(getActualTarget(state.nightRecords.giftedPlayerTarget))" class="color-wolf" style="font-size:22px;">🐺 查殺</span>
                        <span v-else class="color-good" style="font-size:22px;">💧 金水</span>
                    </div>
                </div>
                <div class="nav-buttons">
                    <button class="btn-prev" @click="prevPhase" >⬅️ 上一階段</button>
                    <button @click="nextPhase">確認 請閉眼 ➡️</button>
                </div>
            </div>

            <!-- 🎩 魔術師階段 -->
            <div v-show="state.currentPhase === 'magician'" class="action-row">
                <h3 :class="getPhaseHeaderClass('magician', 'color-god')">🎩 魔術師請睜眼</h3>
                <div v-if="state.day === 1" style="background: #333; padding: 10px; border-radius: 8px; margin-bottom: 15px;">
                    <p style="margin: 0 0 5px 0; color: #aaa;">首夜設定：魔術師是幾號？</p>
                    <select v-model="state.initialRoleSetup.magician">
                        <option :value="0">請選擇</option>
                        <template v-for="p in state.players" :key="p.id">
                            <option :value="p.id" v-if="!isPlayerTaken(p.id, 'magician')">{{ p.id }} 號</option>
                        </template>
                    </select>
                </div>
                <div v-if="isRoleDead('magician')" class="witch-alert-active" style="border-color: #555; background: #333;">
                    <h1 style="margin:0; color:white; font-size: 18px;">🪦 魔術師已經死亡</h1>
                </div>
                <div v-else-if="checkFeared(['魔術師'])">
                    <div class="witch-alert-active" style="color: white;">⚠️ 被夢魘恐懼無法使用技能</div>
                    <div class="player-grid-container">
                        <div class="player-grid-btn zero-btn selected">被恐懼無法交換</div>
                    </div>
                </div>
                <div v-else>
                    <p>請選擇兩名玩家進行身分交換 <span style="font-size:12px;color:#aaa;">(每人限換一次)</span>：</p>
                    <div class="player-grid-container">
                        <div :class="['player-grid-btn zero-btn', { selected: state.nightRecords.magicianSwaps.length === 0 }]" @click="state.nightRecords.magicianSwaps = []">不交換</div>
                        <div v-for="p in alivePlayers" :key="p.id" 
                             :class="['player-grid-btn', getPlayerSetupInfo(p.id).class, { 
                                 selected: state.nightRecords.magicianSwaps.includes(p.id),
                                 disabled: state.magicianUsedSwaps.includes(p.id) 
                             }]"
                             @click="!state.magicianUsedSwaps.includes(p.id) && toggleMagicianSwap(p.id)">
                            <span class="num">{{ p.id }} <span style="font-size: 14px; font-weight: normal; margin-left: 2px;" v-if="getPlayerSetupInfo(p.id).role !== '未定'">{{ getPlayerSetupInfo(p.id).role }}</span></span>
                        </div>
                    </div>
                </div>
                <div class="nav-buttons">
                    <button class="btn-prev" @click="prevPhase" >⬅️ 上一階段</button>
                    <button @click="nextPhase" :disabled="state.nightRecords.magicianSwaps.length === 1">確認 請閉眼 ➡️</button>
                </div>
            </div>

            <!-- 🛍️ 黑市商人階段 (第一晚限定) -->
            <div v-show="state.currentPhase === 'blackMerchant'" class="action-row">
                <h3 :class="getPhaseHeaderClass('blackMerchant', 'color-god')">🛍️ 黑市商人請睜眼</h3>
                <div v-if="state.day === 1" style="background: #333; padding: 10px; border-radius: 8px; margin-bottom: 15px;">
                    <p style="margin: 0 0 5px 0; color: #aaa;">首夜設定：黑市商人是幾號？</p>
                    <select v-model="state.initialRoleSetup.blackMerchant">
                        <option :value="0">請選擇</option>
                        <template v-for="p in state.players" :key="p.id">
                            <option :value="p.id" v-if="!isPlayerTaken(p.id, 'blackMerchant')">{{ p.id }} 號</option>
                        </template>
                    </select>
                </div>
                <div v-if="isRoleDead('blackMerchant')" class="witch-alert-active" style="border-color: #555; background: #333;">
                    <h1 style="margin:0; color:white; font-size: 18px;">🪦 黑市商人已經死亡</h1>
                </div>
                <div v-else-if="checkFeared(['黑市商人'])">
                    <div class="witch-alert-active" style="color: white;">⚠️ 被夢魘恐懼無法使用技能</div>
                    <div class="player-grid-container">
                        <div class="player-grid-btn zero-btn selected">被恐懼無法贈送</div>
                    </div>
                </div>
                <div v-else>
                    <p>請選擇一名玩家贈送物品 <span style="font-size:12px;color:#aaa;">(不可送自己)</span>：</p>
                    <div class="player-grid-container">
                        <div :class="['player-grid-btn zero-btn', { selected: state.nightRecords.blackMerchantTarget === 0 }]" @click="state.nightRecords.blackMerchantTarget = 0">不贈送</div>
                        <template v-for="p in alivePlayers" :key="p.id">
                            <div v-show="p.id !== state.initialRoleSetup.blackMerchant"
                                 :class="['player-grid-btn', getPlayerSetupInfo(p.id).class, { selected: state.nightRecords.blackMerchantTarget === p.id }]"
                                 @click="state.nightRecords.blackMerchantTarget = p.id">
                                <span class="num">{{ p.id }} <span style="font-size: 14px; font-weight: normal; margin-left: 2px;" v-if="getPlayerSetupInfo(p.id).role !== '未定'">{{ getPlayerSetupInfo(p.id).role }}</span></span>
                            </div>
                        </template>
                    </div>
                    
                    <div v-if="state.nightRecords.blackMerchantTarget !== 0" style="margin-top: 15px;">
                        <p>請選擇要贈送的物品：</p>
                        <div class="player-grid-container" style="gap: 10px;">
                            <div :class="['player-grid-btn', { 'selected': state.nightRecords.blackMerchantItem === 'verify' }]" @click="state.nightRecords.blackMerchantItem = 'verify'">
                                <span class="num" style="font-size: 16px;">👁️ 放大鏡</span>
                            </div>
                            <div :class="['player-grid-btn', { 'selected': state.nightRecords.blackMerchantItem === 'poison' }]" @click="state.nightRecords.blackMerchantItem = 'poison'">
                                <span class="num" style="font-size: 16px;">🧪 毒藥</span>
                            </div>
                            <div :class="['player-grid-btn', { 'selected': state.nightRecords.blackMerchantItem === 'gun' }]" @click="state.nightRecords.blackMerchantItem = 'gun'">
                                <span class="num" style="font-size: 16px;">🔫 獵槍</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="nav-buttons">
                    <button class="btn-prev" @click="prevPhase" >⬅️ 上一階段</button>
                    <button @click="nextPhase" :disabled="state.nightRecords.blackMerchantTarget !== 0 && !state.nightRecords.blackMerchantItem">確認 請閉眼 ➡️</button>
                </div>
            </div>

            <!-- 🎭 百變狼王確認帶刀狀態 (第二晚起) -->
            <div v-show="state.currentPhase === 'dittoWolfKing'" class="action-row">
                <h3 class="color-wolf">🎭 百變狼王請睜眼</h3>
                <div v-if="isDittoWolfKingDead" class="witch-alert-active" style="border-color: #555; background: #333;">
                    <h1 style="margin:0; color:white; font-size: 18px;">🪦 百變狼王已經死亡</h1>
                </div>
                <div v-else>
                    <p>上帝請對百變狼王給予以下手勢：</p>
                    <div v-if="canDittoWolfKingKill" class="witch-alert-active" style="border-color: var(--btn-success); background: rgba(76, 175, 80, 0.2);">
                        <h1 style="margin:0; color:white;">👍 可以帶刀</h1>
                        <p style="margin:5px 0 0 0; font-size: 14px; color:#ddd;">(其他狼人已全數出局)</p>
                    </div>
                    <div v-else class="witch-alert-active" style="border-color: var(--btn-danger);">

                    <div v-else-if="state.morningStep === 'vote'" class="action-row">

                                <h2 style="margin:0; color:#ccc; font-size: 18px;">等待設定熊的號碼</h2>
                            </div>
                            <div v-else-if="bearGrowl.isDead" class="witch-alert-active" style="background: rgba(76, 175, 80, 0.2); border-color: var(--btn-success); text-align: center; margin-bottom: 0;">
                                <h2 style="margin:0; color:var(--btn-success);">熊沒有叫</h2>
                                <p style="margin:5px 0 0 0; font-size: 14px; color:#ddd;">(熊已經死亡)</p>
                            </div>
                            <div v-else-if="bearGrowl.growl" class="witch-alert-active" style="background: rgba(255, 77, 77, 0.2); border-color: var(--btn-danger); text-align: center; margin-bottom: 0;">
                                <h2 style="margin:0; color:var(--btn-danger);">熊叫了！</h2>
                                <p style="margin:5px 0 0 0; font-size: 14px; color:#ddd;">({{ bearGrowl.reason }})</p>
                            </div>
                            <div v-else class="witch-alert-active" style="background: rgba(76, 175, 80, 0.2); border-color: var(--btn-success); text-align: center; margin-bottom: 0;">
                                <h2 style="margin:0; color:var(--btn-success);">熊沒有叫</h2>
                                <p style="margin:5px 0 0 0; font-size: 14px; color:#ddd;">({{ bearGrowl.reason }})</p>
                            </div>
                        </div>
                        
                        <div style="margin-top: 20px; padding-top: 15px; border-top: 1px dashed #555; text-align: center;">
                            <h3 style="margin-top: 0; color: #fff;">🗳️ 白天投票環節</h3>
                            <p>請選擇被放逐出局的玩家：</p>
                            <div class="player-grid-container">
                                <div :class="['player-grid-btn zero-btn', { selected: state.morningData.voteTarget === 0 }]" @click="state.morningData.voteTarget = 0">
                                    無人出局 (棄票/平票)
                                </div>
                                <div v-for="p in alivePlayers" :key="p.id" 
                                     :class="['player-grid-btn', getPlayerSetupInfo(p.id).class, { selected: state.morningData.voteTarget === p.id }]"
                                     @click="state.morningData.voteTarget = p.id">
                                    <span class="num">{{ p.id }} <span style="font-size: 14px; font-weight: normal; margin-left: 2px;" v-if="getPlayerSetupInfo(p.id).role !== '未定'">{{ getPlayerSetupInfo(p.id).role }}</span></span>
                                </div>
                            </div>
                            <div class="nav-buttons">
                                <button class="btn-prev" @click="prevPhase">⬅️ 上一階段 (回朔)</button>
                                <button @click="confirmVote">確認放逐 ➡️</button>
                            </div>
                        </div>

                        <!-- 狼人自爆面板 -->
                        <div v-if="explodableWolves.length > 0" style="margin-top: 20px; padding-top: 15px; border-top: 1px dashed #555;">
                            <h3 style="color: var(--color-wolf); margin-top: 0;">💣 狼人自爆 (跳過投票)</h3>
                            <p style="font-size: 13px; color: #aaa; margin-top:-5px;">(小狼、黑狼王可自爆，黑狼王自爆無法開槍)</p>
                            <div class="player-grid-container" style="margin-top: 10px;">
                                <div v-for="p in explodableWolves" :key="p.id" 
                                     :class="['player-grid-btn', 'color-wolf', { 'danger-selected': state.morningData.explodeTarget === p.id }]"
                                     @click="state.morningData.explodeTarget = p.id; state.morningData.voteTarget = 0; state.morningData.knightDuelTarget = 0;">
                                    <span class="num">{{ p.id }} <span style="font-size: 14px; font-weight: normal; margin-left: 2px;">{{ getPlayerSetupInfo(p.id).role }}</span></span>
                                </div>
                            </div>
                            <div class="nav-buttons" v-if="state.morningData.explodeTarget !== 0">
                                <button @click="state.morningData.explodeTarget = 0" style="background-color: var(--btn-secondary);">取消自爆</button>
                                <button @click="confirmExplode" style="background-color: var(--btn-danger);">確認自爆並天黑 ➡️</button>
                            </div>
                        </div>

                        <!-- 騎士決鬥面板 -->
                        <div v-if="state.activeRoles.knight && !isRoleDead('knight') && !state.knightUsed" style="margin-top: 20px; padding-top: 15px; border-top: 1px dashed #555;">
                            <h3 style="color: var(--color-god); margin-top: 0;">⚔️ 騎士決鬥</h3>
                            <p style="font-size: 13px; color: #aaa; margin-top:-5px;">(若決鬥狼人，狼人死亡並天黑；若決鬥好人，騎士死亡繼續投票)</p>
                            <div class="player-grid-container" style="margin-top: 10px;">
                                <div v-for="p in alivePlayers" :key="p.id" v-show="p.id !== state.initialRoleSetup.knight"
                                     :class="['player-grid-btn', getPlayerSetupInfo(p.id).class, { 'danger-selected': state.morningData.knightDuelTarget === p.id, 'disabled': isTargetInvalidForSeer(p.id) }]"
                                     @click="!isTargetInvalidForSeer(p.id) && setKnightDuelTarget(p.id)">
                                    <span class="num">{{ p.id }} <span style="font-size: 14px; font-weight: normal; margin-left: 2px;">{{ getPlayerSetupInfo(p.id).role }}</span></span>
                                </div>
                            </div>
                            <div class="nav-buttons" v-if="state.morningData.knightDuelTarget !== 0">
                                <button @click="state.morningData.knightDuelTarget = 0" style="background-color: var(--btn-secondary);">取消決鬥</button>
                                <button @click="confirmDuel" style="background-color: var(--btn-danger);">確認決鬥 ➡️</button>
                            </div>
                        </div>
                    </div>

                    <!-- 殉情提示畫面 -->
                    <div v-else-if="state.morningStep === 'charm_reveal'" class="action-row">
                        <h3 style="color: #ff9800;">💔 殉情 / 替死結果</h3>
                        <div class="witch-alert-active" style="background: rgba(255, 77, 77, 0.1); border-color: var(--btn-danger); text-align: center; margin-bottom: 10px; padding: 15px;">
                            <div v-for="(death, idx) in state.morningData.daytimeCharmDeaths" :key="idx" style="margin-bottom: 10px;">
                                <h2 style="margin:0; color:white;"><span :class="getPlayerSetupInfo(death.id).class">{{ death.id }} 號</span> 殉情死亡</h2>
                                <p style="margin:5px 0 0 0; font-size: 14px; color:#ddd;">(死因：{{ death.cause === 'charm' ? '被魅惑' : '代替覺醒狼美人死亡' }})</p>
                            </div>
                            <p v-if="state.shootQueue.length === 0 && state.isVotingDone" style="margin:15px 0 0 0; font-size: 18px; font-weight: bold; color:white;">
                                天黑請閉眼
                            </p>
                        </div>
                        <div class="nav-buttons">
                            <button @click="confirmCharmReveal" style="margin: 20px auto 0 auto;">確認進入下一步 ➡️</button>
                        </div>
                    </div>

                    <!-- 開槍揭曉畫面 -->
                    <div v-else-if="state.morningStep === 'shoot_reveal'" class="action-row">
                        <h3 style="color: #ff9800;">🔫 開槍結果</h3>
                        <div class="witch-alert-active" style="background: rgba(255, 77, 77, 0.1); border-color: var(--btn-danger); text-align: center; margin-bottom: 10px; padding: 15px;">
                            <h2 style="margin:0; color:white;"><span :class="getPlayerSetupInfo(state.morningData.lastShotTarget).class">{{ state.morningData.lastShotTarget }} 號玩家</span> 被開槍帶走</h2>
                            <p style="margin:5px 0 0 0; font-size: 14px; color:#ddd;">(開槍者：{{ state.morningData.lastShooterRole }})</p>
                            <p v-if="state.shootQueue.length === 0 && state.isVotingDone && state.morningData.daytimeCharmDeaths.length === 0" style="margin:15px 0 0 0; font-size: 18px; font-weight: bold; color:white;">
                                天黑請閉眼
                            </p>
                        </div>
                        <div class="nav-buttons">
                            <button @click="confirmShootReveal" style="margin: 20px auto 0 auto;">確認進入下一步 ➡️</button>
                        </div>
                    </div>

                    <!-- 騎士決鬥提示畫面 -->
                    <div v-else-if="state.morningStep === 'knight_reveal' && state.morningData.knightDuelTargetInfo" class="action-row">
                        <h3 style="color: #c879ff;">⚔️ 騎士決鬥結果</h3>
                        <div class="witch-alert-active" :style="{ borderColor: state.morningData.knightDuelTargetInfo.isWolf ? 'var(--btn-success)' : 'var(--btn-danger)', background: state.morningData.knightDuelTargetInfo.isWolf ? 'rgba(76, 175, 80, 0.2)' : 'rgba(255, 77, 77, 0.2)' }" style="text-align: center; margin-bottom: 10px; padding: 15px;">
                            <h2 style="margin:0; color:white;"><span :class="getRoleClass(state.morningData.knightDuelTargetInfo.id)">{{ state.morningData.knightDuelTargetInfo.id }} 號</span> 是 {{ state.morningData.knightDuelTargetInfo.isWolf ? '狼人陣營！' : '好人陣營！' }}</h2>
                            <p style="margin:5px 0 0 0; font-size: 14px; color:#ddd;">
                                {{ state.morningData.knightDuelTargetInfo.isWolf ? '決鬥成功！狼人死亡。' : '決鬥失敗！騎士以死謝罪。' }}
                            </p>
                            <p style="margin:15px 0 0 0; font-size: 18px; font-weight: bold; color:white;">
                                {{ state.morningData.knightDuelTargetInfo.isWolf ? '天黑請閉眼' : '請繼續投票放逐' }}
                            </p>
                        </div>
                        <div class="nav-buttons">
                            <button @click="confirmKnightReveal" style="margin: 20px auto 0 auto;">確認進入下一步 ➡️</button>
                        </div>
                    </div>

                    <!-- 覺醒獵人 開槍方向選擇 -->
                    <div v-else-if="state.morningStep === 'ah_shoot'" class="action-row">
                        <h3 style="color: #ff9800;">🔫✨ {{ state.currentShooter.role }} ({{ state.currentShooter.id }}號) 出局，請選擇開槍方向：</h3>
                        <div class="player-grid-container" style="gap: 15px; margin-top: 20px;">
                            <div :class="['player-grid-btn zero-btn', { selected: state.morningData.ahDirection === 1 }]" @click="state.morningData.ahDirection = 1" style="padding: 15px; font-size: 18px;">
                                ⬆️ 號碼遞增方向
                            </div>
                            <div :class="['player-grid-btn zero-btn', { selected: state.morningData.ahDirection === -1 }]" @click="state.morningData.ahDirection = -1" style="padding: 15px; font-size: 18px;">
                                ⬇️ 號碼遞減方向
                            </div>
                            <div :class="['player-grid-btn zero-btn', { 'danger-selected': state.morningData.ahDirection === 0 }]" @click="state.morningData.ahDirection = 0" style="padding: 15px; font-size: 18px;">
                                壓槍 (不發動)
                            </div>
                        </div>
                        <div class="nav-buttons">
                            <button class="btn-prev" @click="prevPhase">⬅️ 重新回朔</button>
                            <button @click="confirmAhShoot" :disabled="state.morningData.ahDirection === null">確認開槍 ➡️</button>
                        </div>
                    </div>

                    <!-- 常規開槍階段 (連環開槍系統) -->
                    <div v-else-if="state.morningStep === 'shoot'" class="action-row">
                        <h3 style="color: #ff9800;">🔫 {{ state.currentShooter.role }} ({{ state.currentShooter.id }}號) 出局，請選擇帶走的玩家：</h3>
                        <div class="player-grid-container">
                            <div :class="['player-grid-btn zero-btn', { 'danger-selected': state.morningData.shootTarget === 0 }]" @click="state.morningData.shootTarget = 0">
                                壓槍 (不帶走)
                            </div>
                            <div v-for="p in alivePlayers" :key="p.id" 
                                 :class="['player-grid-btn', getPlayerSetupInfo(p.id).class, { 'danger-selected': state.morningData.shootTarget === p.id }]"
                                 @click="state.morningData.shootTarget = p.id">
                                <span class="num">{{ p.id }} <span style="font-size: 14px; font-weight: normal; margin-left: 2px;" v-if="getPlayerSetupInfo(p.id).role !== '未定'">{{ getPlayerSetupInfo(p.id).role }}</span></span>
                            </div>
                        </div>
                        <div class="nav-buttons">
                            <button class="btn-prev" @click="prevPhase">⬅️ 重新回朔</button>
                            <button @click="confirmShoot">確認開槍 ➡️</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script>
        const { createApp, reactive, computed } = Vue;

        const ROLE_DICT = {
            dittoWolfKing:      { id: 'dittoWolfKing', name: '百變狼王', emoji: '🎭', type: 'wolf', selectable: false, executeOrder: 2 },
            giftedPlayerPhase:  { id: 'giftedPlayerPhase', name: '黑商幸運兒', emoji: '🎁', type: 'god', selectable: false, executeOrder: 3 },
            magician:           { id: 'magician', name: '魔術師', emoji: '🎩', type: 'god', selectable: true, executeOrder: 5 },
            blackMerchant:      { id: 'blackMerchant', name: '黑市商人', emoji: '🛍️', type: 'god', selectable: true, executeOrder: 6 },
            evilKnight:         { id: 'evilKnight', name: '惡靈騎士', emoji: '🏍️', type: 'wolf', selectable: true, executeOrder: -1 },
            nightmare:          { id: 'nightmare', name: '夢魘', emoji: '👻', type: 'wolf', selectable: true, executeOrder: 10 },
            wolfBeauty:         { id: 'wolfBeauty', name: '狼美人', emoji: '💃', type: 'wolf', selectable: true, executeOrder: -1 }, 
            awakenedWolfBeauty: { id: 'awakenedWolfBeauty', name: '覺醒狼美人', emoji: '💃✨', type: 'wolf', selectable: true, executeOrder: -1 },
            blackWolf:          { id: 'blackWolf', name: '黑狼王', emoji: '👑', type: 'wolf', selectable: true, executeOrder: -1 },
            
            wolfBrothers:       { id: 'wolfBrothers', name: '狼兄狼弟', emoji: '🧑‍🤝‍🧑', type: 'wolf', selectable: true, executeOrder: -1 }, 
            wolfBrotherPhase:   { id: 'wolfBrotherPhase', name: '狼兄狼弟', emoji: '🧑‍🤝‍🧑', type: 'wolf', selectable: false, executeOrder: 27 }, 
            wolfYoungerBrotherPhase: { id: 'wolfYoungerBrotherPhase', name: '狼弟', emoji: '🐺👦', type: 'wolf', selectable: false, executeOrder: 28 }, 
            mechWolf:           { id: 'mechWolf', name: '機械狼', emoji: '🤖', type: 'wolf', selectable: true, executeOrder: 29 }, 
            wolf:               { id: 'wolf', name: '狼人', emoji: '🐺', type: 'wolf', selectable: false, executeOrder: 30 },
            
            guard:              { id: 'guard', name: '守衛', emoji: '🛡️', type: 'god', selectable: true, executeOrder: 20 },
            gargoyle:           { id: 'gargoyle', name: '石像鬼', emoji: '🗿', type: 'wolf', selectable: true, executeOrder: 22 },
            dreamer:            { id: 'dreamer', name: '攝夢人', emoji: '💤', type: 'god', selectable: true, executeOrder: 25 },
            witch:              { id: 'witch', name: '女巫', emoji: '🧙‍♀️', type: 'god', selectable: true, executeOrder: 40 },
            demonHunter:        { id: 'demonHunter', name: '獵魔人', emoji: '🏹', type: 'god', selectable: true, executeOrder: 45 },
            hunter:             { id: 'hunter', name: '獵人', emoji: '🔫', type: 'god', selectable: true, executeOrder: 60 },
            awakenedHunter:     { id: 'awakenedHunter', name: '覺醒獵人', emoji: '🔫✨', type: 'god', selectable: true, executeOrder: 70 },
            bear:               { id: 'bear', name: '熊', emoji: '🐻', type: 'god', selectable: true, executeOrder: 80 },
            knight:             { id: 'knight', name: '騎士', emoji: '⚔️', type: 'god', selectable: true, executeOrder: 90 }, 
            
            gravekeeper:        { id: 'gravekeeper', name: '守墓人', emoji: '🪦', type: 'god', selectable: true, executeOrder: 95 },
            seer:               { id: 'seer', name: '預言家', emoji: '👁️', type: 'god', selectable: true, executeOrder: 100 },
            shadow:             { id: 'shadow', name: '燈影', emoji: '🏮', type: 'villager', selectable: true, executeOrder: 101 },
            medium:             { id: 'medium', name: '通靈師', emoji: '🔮', type: 'god', selectable: true, executeOrder: 102 },
            
            gargoyleResult:     { id: 'gargoyleResult', name: '石像鬼確認', emoji: '🗿', type: 'wolf', selectable: false, executeOrder: 996 },
            blackMerchantReceive:{ id: 'blackMerchantReceive', name: '幸運兒請睜眼', emoji: '🎁', type: 'god', selectable: false, executeOrder: 998 },
            mechWolfResult:     { id: 'mechWolfResult', name: '機械狼確認', emoji: '🤖', type: 'wolf', selectable: false, executeOrder: 999 }
        };

        // 全域狀態 (State)
        const state = reactive({
            screen: 'setup', 
            day: 1,
            isNight: true,
            isSeerFirst: true, 
            isCalculatingNight: false,
            daySummaryPrinted: false,
            winReasonPrinted: false,
            currentPhase: 'none',
            currentPhaseIndex: 0,
            phaseQueue: [],
            playerCount: 12,
            players: [],
            activeRoles: { magician: false, blackMerchant: false, witch: true, demonHunter: false, guard: false, bear: false, dreamer: false, knight: false, gravekeeper: false, seer: true, shadow: false, medium: false, hunter: true, awakenedHunter: false, nightmare: false, blackWolf: false, wolfBeauty: false, awakenedWolfBeauty: false, evilKnight: false, gargoyle: false, mechWolf: false, wolfBrothers: false, wolf: true },
            witchPotions: { heal: true, poison: true },
            initialRoleSetup: { magician: 0, blackMerchant: 0, wolves: [], witch: 0, demonHunter: 0, guard: 0, bear: 0, dreamer: 0, knight: 0, gravekeeper: 0, seer: 0, shadow: 0, medium: 0, hunter: 0, awakenedHunter: 0, nightmare: 0, blackWolf: 0, wolfBeauty: 0, awakenedWolfBeauty: 0, evilKnight: 0, gargoyle: 0, mechWolf: 0, wolfBrother: 0, wolfYoungerBrother: 0 },
            nightRecords: { 
                magicianSwaps: [], 
                blackMerchantTarget: 0, 
                blackMerchantItem: '', 
                giftedPlayerTarget: 0,
                nightmareTarget: 0, guardTarget: 0, lastGuardTarget: 0, gargoyleTarget: 0, dreamTarget: 0, lastDreamTarget: 0, charmTarget: 0, awbCharmTarget: 0, lastAwbCharmTarget: 0, bearCharmTarget: 0, lastBearCharmTarget: 0, seerTarget: 0, shadowTarget: 0, mediumTarget: 0, wolfKill: 0,     witchAction: 'none', witchPoison: 0, demonHunterTarget: 0, mechWolfLearnTarget: 0, mechWolfActionTarget: 0, lastMechWolfActionTarget: 0, wolfBrotherRevengeTarget: 0 
            },
            
            isDittoWolfKingMode: false,
            dittoWolfKingRole: null,

            magicianUsedSwaps: [], 
            giftedState: { hasGift: false, id: 0, item: '', isUsed: false }, 

            mechWolfState: { hasLearned: false, learnedRole: null, poisonUsed: false, shieldBroken: false, wolfKillUsed: false },
            wolfBrotherRevengeUsed: false,

            awbUsed: false, 
            knightUsed: false,
            ekUsed: false,
            dueledGoodTarget: 0, 

            morningStep: 'vote', 
            morningData: { voteTarget: 0, shootTarget: 0, ahDirection: null, knightDuelTarget: 0, knightDuelTargetInfo: null, daytimeCharmDeaths: [], daytimeDeaths: [], explodeTarget: 0, lastShotTarget: 0, lastShooterRole: '' },
            currentShooter: null, 
            shootQueue: [], 
            isVotingDone: false, 
            
            lastExiledTarget: 0,
            lastDayExploded: false,

            morningResultHtml: "",
            finalEventHtml: "",
            pendingGameOver: null,
            gameOverResult: "",
            history: [], 

            morningSnapshot: null,
            crossDaySnapshot: null 
        });

        // 全域 Helper 函數
        const getActualTarget = (id) => {
            if (id === 0) return 0;
            const swaps = state.nightRecords.magicianSwaps;
            if (swaps.length === 2) {
                if (swaps[0] === id) return swaps[1];
                if (swaps[1] === id) return swaps[0];
            }
            return id;
        };

        const actualWolfKillForWitch = computed(() => getActualTarget(state.nightRecords.wolfKill));
                
        const isWitchSelfSaveRestricted = computed(() => {
            if (state.isDittoWolfKingMode && state.dittoWolfKingRole === 'witch' && state.day === 1) return false;
            return state.playerCount >= 10 && actualWolfKillForWitch.value !== 0 && actualWolfKillForWitch.value === state.initialRoleSetup.witch;
        });

        const maxWolves = computed(() => state.playerCount <= 10 ? 3 : 4);
        const specialWolfCount = computed(() => {
            let count = 0;
            if (state.activeRoles.nightmare) count++;
            if (state.activeRoles.blackWolf) count++;
            if (state.activeRoles.wolfBeauty) count++;
            if (state.activeRoles.awakenedWolfBeauty) count++;
            if (state.activeRoles.evilKnight) count++;
            if (state.activeRoles.gargoyle) count++;
            if (state.activeRoles.mechWolf) count++;
            if (state.activeRoles.wolfBrothers) count += 2; 
            if (state.isDittoWolfKingMode) count++;
            return count;
        });
        const normalWolfCount = computed(() => Math.max(0, maxWolves.value - specialWolfCount.value));

        // 核心邏輯
        const GameLogic = {
            initPlayers() {
                state.players = Array.from({ length: state.playerCount }, (_, i) => ({
                    id: i + 1, role: '?', class: 'color-unknown', alive: true
                }));
            },

            addHistory(msg) {
                state.history.push(msg);
            },

            isRoleDead(roleKey) {
                const id = state.initialRoleSetup[roleKey];
                if (!id) return false;
                const p = state.players.find(x => x.id === id);
                return p && !p.alive;
            },

            getPlayerSetupInfo(id) {
                let resolvedRole = '未定';
                let resolvedClass = 'color-unknown';
                
                const s = state.initialRoleSetup;
                
                if (s.magician === id) { resolvedRole = '魔術師'; resolvedClass = 'color-god'; }
                else if (s.blackMerchant === id) { resolvedRole = '黑市商人'; resolvedClass = 'color-god'; }
                else if (s.nightmare === id) { resolvedRole = '夢魘'; resolvedClass = 'color-wolf'; }
                else if (s.blackWolf === id) { resolvedRole = '黑狼王'; resolvedClass = 'color-wolf'; }
                else if (s.wolfBeauty === id) { resolvedRole = '狼美人'; resolvedClass = 'color-wolf'; }
                else if (s.awakenedWolfBeauty === id) { resolvedRole = '覺醒狼美人'; resolvedClass = 'color-wolf'; }
                else if (s.evilKnight === id) { resolvedRole = '惡靈騎士'; resolvedClass = 'color-wolf'; }
                else if (s.gargoyle === id) { resolvedRole = '石像鬼'; resolvedClass = 'color-wolf'; }
                else if (s.mechWolf === id) { resolvedRole = '機械狼'; resolvedClass = 'color-wolf'; }
                else if (s.wolfBrother === id) { resolvedRole = '狼兄'; resolvedClass = 'color-wolf'; }
                else if (s.wolfYoungerBrother === id) { resolvedRole = '狼弟'; resolvedClass = 'color-wolf'; }
                else if (s.guard === id) { resolvedRole = '守衛'; resolvedClass = 'color-god'; }
                else if (s.dreamer === id) { resolvedRole = '攝夢人'; resolvedClass = 'color-god'; }
                else if (s.knight === id) { resolvedRole = '騎士'; resolvedClass = 'color-god'; }
                else if (s.bear === id) { resolvedRole = '熊'; resolvedClass = 'color-god'; }
                else if (s.gravekeeper === id) { resolvedRole = '守墓人'; resolvedClass = 'color-god'; }
                else if (s.seer === id) { resolvedRole = '預言家'; resolvedClass = 'color-god'; }
                else if (s.witch === id) { resolvedRole = '女巫'; resolvedClass = 'color-god'; }
                else if (s.demonHunter === id) { resolvedRole = '獵魔人'; resolvedClass = 'color-god'; }
                else if (s.hunter === id) { resolvedRole = '獵人'; resolvedClass = 'color-god'; }
                else if (s.awakenedHunter === id) { resolvedRole = '覺醒獵人'; resolvedClass = 'color-god'; }
                else if (s.shadow === id) { resolvedRole = '燈影'; resolvedClass = 'color-villager'; }
                else if (s.medium === id) { resolvedRole = '通靈師'; resolvedClass = 'color-god'; }
                else {
                    const activeW = s.wolves.slice(0, normalWolfCount.value);
                    if (activeW.includes(id)) {
                        resolvedRole = '狼人'; 
                        resolvedClass = 'color-wolf';
                    } else {
                        const p = state.players.find(x => x.id === id);
                        if (p && p.role !== '?' && p.role !== '未定') {
                            resolvedRole = p.role;
                            resolvedClass = p.class;
                        }
                    }
                }

                if (state.isDittoWolfKingMode && state.dittoWolfKingRole && state.initialRoleSetup[state.dittoWolfKingRole] === id) {
                    resolvedClass = 'color-wolf';
                }

                return { role: resolvedRole, class: resolvedClass };
            },

            getRoleClass(id) {
                return GameLogic.getPlayerSetupInfo(id).class;
            },

            getMediumCheckResult(id) {
                if (state.isDittoWolfKingMode && state.initialRoleSetup[state.dittoWolfKingRole] === id) {
                    return '百變狼王';
                }
                const mechWolfId = state.initialRoleSetup.mechWolf;
                if (id === mechWolfId) {
                    if (state.mechWolfState.hasLearned) {
                        return state.mechWolfState.learnedRole;
                    } else if (state.nightRecords.mechWolfLearnTarget !== 0) {
                        const targetId = getActualTarget(state.nightRecords.mechWolfLearnTarget);
                        if (targetId === mechWolfId) return '機械狼';
                        return GameLogic.getMediumCheckResult(targetId);
                    }
                    return '機械狼';
                }
                return GameLogic.getPlayerSetupInfo(id).role;
            },

            checkFeared(roleArray) {
                if (state.nightRecords.nightmareTarget === 0) return false;
                let targetId = getActualTarget(state.nightRecords.nightmareTarget);
                let targetRole = GameLogic.getPlayerSetupInfo(targetId).role;
                return roleArray.includes(targetRole);
            },
            
            isWolfTarget(id) {
                if (state.isDittoWolfKingMode && id === state.initialRoleSetup[state.dittoWolfKingRole]) return true;
                const info = GameLogic.getPlayerSetupInfo(id);
                if (info.role === '狼弟') {
                    return GameLogic.isRoleDead('wolfBrother');
                }
                return ['狼人', '夢魘', '黑狼王', '狼美人', '覺醒狼美人', '惡靈騎士', '石像鬼', '機械狼', '狼兄'].includes(info.role);
            },
            
            isStrictWolfTeam(id) {
                if (state.isDittoWolfKingMode && id === state.initialRoleSetup[state.dittoWolfKingRole]) return true;
                const info = GameLogic.getPlayerSetupInfo(id);
                return ['狼人', '夢魘', '黑狼王', '狼美人', '覺醒狼美人', '惡靈騎士', '石像鬼', '機械狼', '狼兄', '狼弟'].includes(info.role);
            },

            isSkillSealed(role, cause) {
                if (role === '覺醒獵人') return false; 
                if (role === '狼美人' || (role === '熊' && state.isDittoWolfKingMode && state.dittoWolfKingRole === 'bear')) {
                    return ['ah_shot', 'ah_shot_day', 'awb_sub', 'dream_death', 'dream_link', 'duel_wolf'].includes(cause);
                }
                if (role === '黑狼王' || role === '機械狼') {
                    return ['poison', 'charm', 'awb_sub', 'ah_shot', 'ah_shot_day', 'explode', 'dream_death', 'dream_link', 'duel_wolf'].includes(cause);
                }
                if (role === '獵人') {
                    return ['poison', 'charm', 'awb_sub', 'dream_death', 'dream_link'].includes(cause);
                }
                return false;
            },

            startNight() {
                state.isNight = true;
                state.isCalculatingNight = false;
                state.daySummaryPrinted = false;
                state.morningData.voteTarget = 0;
                state.morningData.shootTarget = 0;
                state.morningData.ahDirection = null;
                state.morningData.explodeTarget = 0;
                state.morningData.knightDuelTarget = 0;
                state.morningData.knightDuelTargetInfo = null;
                state.morningData.daytimeCharmDeaths = [];
                state.morningData.daytimeDeaths = [];
                state.isVotingDone = false;
                state.shootQueue = [];
                
                state.nightRecords.magicianSwaps = [];
                state.nightRecords.blackMerchantTarget = 0;
                state.nightRecords.blackMerchantItem = '';
                state.nightRecords.giftedPlayerTarget = 0;

                state.nightRecords.nightmareTarget = 0;
                state.nightRecords.guardTarget = 0;
                state.nightRecords.gargoyleTarget = 0;
                state.nightRecords.dreamTarget = 0;
                state.nightRecords.charmTarget = 0;
                state.nightRecords.awbCharmTarget = 0;
                state.nightRecords.bearCharmTarget = 0;
                state.nightRecords.seerTarget = 0;
                state.nightRecords.shadowTarget = 0;
                state.nightRecords.mediumTarget = 0;
                state.nightRecords.wolfKill = 0;
                state.nightRecords.witchAction = 'none';
                state.nightRecords.witchPoison = 0;
                state.nightRecords.demonHunterTarget = 0;
                
                if (!state.mechWolfState.hasLearned) state.nightRecords.mechWolfLearnTarget = 0;
                state.nightRecords.mechWolfActionTarget = 0;
                state.nightRecords.wolfBrotherRevengeTarget = 0;

                if (state.day === 1 && state.activeRoles.seer && state.activeRoles.shadow) {
                    state.isSeerFirst = Math.random() < 0.5;
                }
                if (state.activeRoles.seer && state.activeRoles.shadow) {
                    ROLE_DICT.seer.executeOrder = state.isSeerFirst ? 100 : 101;
                    ROLE_DICT.shadow.executeOrder = state.isSeerFirst ? 101 : 100;
                }

                let active = Object.values(ROLE_DICT).filter(r => {
                    if (r.executeOrder <= 0) return false;
                    
                    if (r.id === 'dittoWolfKing') return state.isDittoWolfKingMode && state.day > 1;
                    if (r.id === 'blackMerchant') return state.activeRoles.blackMerchant && state.day === 1;
                    if (r.id === 'blackMerchantReceive') return state.activeRoles.blackMerchant && state.day === 1;
                    if (r.id === 'giftedPlayerPhase') {
                        let p = state.players.find(x => x.id === state.giftedState.id);
                        let isGiftedAlive = p && p.alive;
                        return state.giftedState.hasGift && !state.giftedState.isUsed && state.day > 1 && isGiftedAlive && ['verify', 'poison'].includes(state.giftedState.item);
                    }
                    if (r.id === 'gargoyleResult') return state.activeRoles.gargoyle && state.day === 1;
                    if (r.id === 'mechWolfResult') return state.activeRoles.mechWolf && state.day === 1; 
                    if (r.id === 'wolfBrotherPhase') return state.activeRoles.wolfBrothers && state.day === 1;
                    if (r.id === 'wolfYoungerBrotherPhase') {
                        const isWbDead = GameLogic.isRoleDead('wolfBrother');
                        return state.activeRoles.wolfBrothers && state.day > 1 && isWbDead && !state.wolfBrotherRevengeUsed && !GameLogic.isRoleDead('wolfYoungerBrother');
                    }
                    if (r.id === 'wolf') return true; 

                    if (r.selectable && !state.activeRoles[r.id]) return false;
                    if (r.id === 'bear' && state.day > 1 && !(state.isDittoWolfKingMode && state.dittoWolfKingRole === 'bear')) return false;
                    if (r.id === 'knight' && state.day > 1) return false; 
                    return true;
                });
                active.sort((a, b) => a.executeOrder - b.executeOrder);
                state.phaseQueue = active.map(r => r.id);
                
                state.currentPhaseIndex = 0;
                GameLogic.updatePhase();
            },

            updatePhase() {
                state.currentPhase = state.phaseQueue[state.currentPhaseIndex];
                
                if (state.currentPhase === 'magician' && GameLogic.checkFeared(['魔術師'])) state.nightRecords.magicianSwaps = [];
                if (state.currentPhase === 'blackMerchant' && GameLogic.checkFeared(['黑市商人'])) state.nightRecords.blackMerchantTarget = 0;
                if (state.currentPhase === 'giftedPlayerPhase' && GameLogic.checkFeared([GameLogic.getPlayerSetupInfo(state.giftedState.id).role])) state.nightRecords.giftedPlayerTarget = 0;

                if (state.currentPhase === 'mechWolf' && GameLogic.checkFeared(['機械狼'])) {
                    state.nightRecords.mechWolfLearnTarget = 0;
                    state.nightRecords.mechWolfActionTarget = 0;
                }
                if (state.currentPhase === 'wolfYoungerBrotherPhase' && GameLogic.checkFeared(['狼弟'])) state.nightRecords.wolfBrotherRevengeTarget = 0;
                if (state.currentPhase === 'guard' && GameLogic.checkFeared(['守衛'])) state.nightRecords.guardTarget = 0;
                if (state.currentPhase === 'gargoyle' && GameLogic.checkFeared(['石像鬼'])) state.nightRecords.gargoyleTarget = 0;
                if (state.currentPhase === 'dreamer' && GameLogic.checkFeared(['攝夢人'])) state.nightRecords.dreamTarget = 0;
                if (state.currentPhase === 'seer' && GameLogic.checkFeared(['預言家'])) state.nightRecords.seerTarget = 0;
                if (state.currentPhase === 'shadow' && GameLogic.checkFeared(['燈影'])) state.nightRecords.shadowTarget = 0;
                if (state.currentPhase === 'medium' && GameLogic.checkFeared(['通靈師'])) state.nightRecords.mediumTarget = 0;
                if (state.currentPhase === 'bear' && GameLogic.checkFeared(['熊'])) state.nightRecords.bearCharmTarget = 0;
                if (state.currentPhase === 'wolf' && GameLogic.checkFeared(['狼人', '夢魘', '黑狼王', '狼美人', '覺醒狼美人', '惡靈騎士', '狼兄', '石像鬼'])) {
                    state.nightRecords.wolfKill = 0;
                    state.nightRecords.charmTarget = 0;
                    state.nightRecords.awbCharmTarget = 0;
                }
                if (state.currentPhase === 'witch' && GameLogic.checkFeared(['女巫'])) {
                    state.nightRecords.witchAction = 'none';
                    state.nightRecords.witchPoison = 0;
                }
                if (state.currentPhase === 'demonHunter' && GameLogic.checkFeared(['獵魔人'])) state.nightRecords.demonHunterTarget = 0;
            },

            nextPhase() {
                if (state.day === 1 && state.currentPhase !== 'morning') {
                    const phase = state.currentPhase;
                    
                    if (phase === 'magician' && state.initialRoleSetup.magician === 0) return alert('請設定「魔術師」的號碼！');
                    if (phase === 'blackMerchant' && state.initialRoleSetup.blackMerchant === 0) return alert('請設定「黑市商人」的號碼！');
                    if (phase === 'demonHunter' && state.initialRoleSetup.demonHunter === 0) return alert('請設定「獵魔人」的號碼！');
                    if (phase === 'magician' && state.nightRecords.magicianSwaps.length === 1) return alert('魔術師必須選擇 0 名或 2 名玩家！');
                    if (phase === 'blackMerchant' && state.nightRecords.blackMerchantTarget !== 0 && !state.nightRecords.blackMerchantItem) return alert('請選擇要贈送的物品！');

                    if (phase === 'wolf') {
                        if (state.activeRoles.evilKnight && state.initialRoleSetup.evilKnight === 0) return alert('請設定「惡靈騎士」的號碼！');
                        if (state.activeRoles.mechWolf && state.initialRoleSetup.mechWolf === 0) return alert('請設定「機械狼」的號碼！');
                        if (state.activeRoles.blackWolf && state.initialRoleSetup.blackWolf === 0) return alert('請設定「黑狼王」的號碼！');
                        if (state.activeRoles.wolfBeauty && state.initialRoleSetup.wolfBeauty === 0) return alert('請設定「狼美人」的號碼！');
                        if (state.activeRoles.awakenedWolfBeauty && state.initialRoleSetup.awakenedWolfBeauty === 0) return alert('請設定「覺醒狼美人」的號碼！');
                        
                        const nWolves = normalWolfCount.value;
                        for (let i = 0; i < nWolves; i++) {
                            if (!state.initialRoleSetup.wolves[i]) return alert(`請設定第 ${i+1} 名普通狼人的號碼！`);
                        }
                    } else if (phase === 'wolfBrotherPhase') {
                        if (state.initialRoleSetup.wolfBrother === 0) return alert('請設定「狼兄」的號碼！');
                        if (state.initialRoleSetup.wolfYoungerBrother === 0) return alert('請設定「狼弟」的號碼！');
                    } else if (state.initialRoleSetup[phase] === 0 && phase !== 'blackMerchantReceive' && phase !== 'giftedPlayerPhase' && phase !== 'gargoyleResult' && phase !== 'mechWolfResult' && phase !== 'wolfYoungerBrotherPhase' && phase !== 'wolfBrothers') {
                        return alert(`請設定「${ROLE_DICT[phase].name}」的號碼！`);
                    }
                }

                if (state.currentPhase === 'dreamer') {
                    let isDead = false;
                    let p = state.players.find(x => x.id === state.initialRoleSetup.dreamer);
                    if (p && !p.alive) isDead = true;
                    if (!isDead && !GameLogic.checkFeared(['攝夢人']) && state.nightRecords.dreamTarget === 0) {
                        return alert('攝夢人每晚必須選擇一名玩家夢遊！(不能不攝)');
                    }
                }

                if (state.currentPhaseIndex < state.phaseQueue.length - 1) {
                    state.currentPhaseIndex++;
                    GameLogic.updatePhase();
                } else {
                    GameLogic.calculateMorningResult();
                }
            },

            prevPhase() {
                if (state.currentPhase === 'morning') {
                    state.players = JSON.parse(JSON.stringify(state.morningSnapshot.players));
                    state.witchPotions = JSON.parse(JSON.stringify(state.morningSnapshot.witchPotions));
                    state.nightRecords.lastGuardTarget = state.morningSnapshot.lastGuardTarget;
                    state.nightRecords.lastDreamTarget = state.morningSnapshot.lastDreamTarget;
                    state.nightRecords.lastAwbCharmTarget = state.morningSnapshot.lastAwbCharmTarget;
                    state.nightRecords.lastBearCharmTarget = state.morningSnapshot.lastBearCharmTarget;
                    state.nightRecords.lastMechWolfActionTarget = state.morningSnapshot.lastMechWolfActionTarget;
                    state.awbUsed = state.morningSnapshot.awbUsed;
                    state.ekUsed = state.morningSnapshot.ekUsed;
                    state.wolfBrotherRevengeUsed = state.morningSnapshot.wolfBrotherRevengeUsed;
                    state.mechWolfState = JSON.parse(JSON.stringify(state.morningSnapshot.mechWolfState));
                    state.magicianUsedSwaps = state.morningSnapshot.magicianUsedSwaps ? JSON.parse(JSON.stringify(state.morningSnapshot.magicianUsedSwaps)) : [];
                    state.giftedState = state.morningSnapshot.giftedState ? JSON.parse(JSON.stringify(state.morningSnapshot.giftedState)) : { hasGift: false, id: 0, item: '', isUsed: false };
                    state.winReasonPrinted = state.morningSnapshot.winReasonPrinted;
                    state.history = JSON.parse(JSON.stringify(state.morningSnapshot.history));
                    state.shootQueue = [];
                    
                    state.isNight = true;
                    state.pendingGameOver = null;
                    state.morningResultHtml = "";
                    state.finalEventHtml = "";
                    
                    state.currentPhaseIndex = state.phaseQueue.length - 1;
                    GameLogic.updatePhase();
                } else if (state.currentPhaseIndex > 0) {
                    state.currentPhaseIndex--;
                    GameLogic.updatePhase();
                } else if (state.currentPhaseIndex === 0 && state.day === 1) {
                    state.screen = 'setup';
                } else if (state.currentPhaseIndex === 0 && state.day > 1 && state.crossDaySnapshot) {
                    state.day--;
                    const snap = state.crossDaySnapshot;
                    state.players = JSON.parse(JSON.stringify(snap.players));
                    state.witchPotions = JSON.parse(JSON.stringify(snap.witchPotions));
                    state.nightRecords = JSON.parse(JSON.stringify(snap.nightRecords));
                    state.awbUsed = snap.awbUsed;
                    state.ekUsed = snap.ekUsed;
                    state.knightUsed = snap.knightUsed;
                    state.wolfBrotherRevengeUsed = snap.wolfBrotherRevengeUsed;
                    state.mechWolfState = JSON.parse(JSON.stringify(snap.mechWolfState));
                    state.magicianUsedSwaps = snap.magicianUsedSwaps ? JSON.parse(JSON.stringify(snap.magicianUsedSwaps)) : [];
                    state.giftedState = snap.giftedState ? JSON.parse(JSON.stringify(snap.giftedState)) : { hasGift: false, id: 0, item: '', isUsed: false };
                    state.dueledGoodTarget = snap.dueledGoodTarget;
                    state.winReasonPrinted = snap.winReasonPrinted;
                    state.history = JSON.parse(JSON.stringify(snap.history));
                    state.shootQueue = JSON.parse(JSON.stringify(snap.shootQueue));
                    
                    state.lastExiledTarget = snap.lastExiledTarget;
                    state.lastDayExploded = snap.lastDayExploded;

                    state.morningStep = snap.morningStep;
                    state.morningResultHtml = snap.morningResultHtml;
                    state.finalEventHtml = snap.finalEventHtml || "";
                    state.morningData = JSON.parse(JSON.stringify(snap.morningData));
                    state.currentShooter = snap.currentShooter ? JSON.parse(JSON.stringify(snap.currentShooter)) : null;
                    state.isVotingDone = snap.isVotingDone;
                    
                    state.isNight = false;
                    state.currentPhase = 'morning';
                    state.pendingGameOver = null;
                }
            },

            executeDeath(id, cause) {
                if (id === 0) return;
                let p = state.players.find(x => x.id === id);
                if (!p || !p.alive) return;

                let role = GameLogic.getPlayerSetupInfo(id).role;

                if (role === '覺醒狼美人' && !state.awbUsed && cause !== 'ah_shot' && cause !== 'ah_shot_day' && cause !== 'duel_wolf') {
                    let charmTarget = getActualTarget(state.nightRecords.awbCharmTarget);
                    if (charmTarget !== 0) {
                        let cp = state.players.find(x => x.id === charmTarget);
                        if (cp && cp.alive) {
                            state.awbUsed = true;
                            GameLogic.addHistory(`✨ ${id}號 觸發替死技能！魅惑目標 ${charmTarget}號 替其死亡！`);
                            GameLogic.executeDeath(charmTarget, 'awb_sub');
                            return; 
                        }
                    }
                }

                p.alive = false;
                
                if (!state.isCalculatingNight) {
                    state.morningData.daytimeDeaths.push(id);
                }

                if (cause === 'charm') {
                    GameLogic.addHistory(`💔 ${id}號 因被魅惑而殉情死亡`);
                    if (!state.isCalculatingNight) state.morningData.daytimeCharmDeaths.push({ id, role, cause });
                } else if (cause === 'awb_sub') {
                    GameLogic.addHistory(`💔 ${id}號 代替覺醒狼美人死亡`);
                    if (!state.isCalculatingNight) state.morningData.daytimeCharmDeaths.push({ id, role, cause });
                } else if (cause === 'dream_death') {
                    GameLogic.addHistory(`💔 ${id}號 因連續兩晚被夢遊而死亡`);
                } else if (cause === 'dream_link') {
                    GameLogic.addHistory(`💔 ${id}號 因攝夢人死亡而同生共死`);
                } else if (cause === 'ek_reflect') {
                    GameLogic.addHistory(`💥 ${id}號 因對惡靈騎士使用技能，遭到反傷死亡`);
                } else if (cause === 'merchant_wolf') {
                    } else if (cause === 'demon_hunt_success') {
                    GameLogic.addHistory(`💥 ${id}號 被獵魔人狩獵死亡`);
                } else if (cause === 'demon_hunt_fail') {
                    GameLogic.addHistory(`💥 ${id}號 狩獵好人遭到反噬死亡`);
                }

                let sealed = GameLogic.isSkillSealed(role, cause);

                if (role === '狼美人') {
                    if (sealed) {
                        GameLogic.addHistory(`🚫 ${id}號 技能遭封印，無法帶走魅惑目標`);
                    } else {
                        let charmTarget = getActualTarget(state.nightRecords.charmTarget);
                        if (charmTarget !== 0) {
                            let cp = state.players.find(x => x.id === charmTarget);
                            if (cp && cp.alive) {
                                GameLogic.addHistory(`💔 ${id}號 出局，觸發魅惑連帶帶走 ${charmTarget}號`);
                                GameLogic.executeDeath(charmTarget, 'charm');
                            }
                        }
                    }
                }

                if (role === '熊' && state.isDittoWolfKingMode && state.dittoWolfKingRole === 'bear') {
                    if (sealed) {
                        GameLogic.addHistory(`🚫 ${id}號 技能遭封印，無法帶走魅惑目標`);
                    } else {
                        let charmTarget = getActualTarget(state.nightRecords.bearCharmTarget);
                        if (charmTarget !== 0) {
                            let cp = state.players.find(x => x.id === charmTarget);
                            if (cp && cp.alive) {
                                GameLogic.addHistory(`💔 ${id}號 出局，觸發魅惑連帶帶走 ${charmTarget}號`);
                                GameLogic.executeDeath(charmTarget, 'charm');
                            }
                        }
                    }
                }

                if (role === '機械狼' && state.mechWolfState.hasLearned && ['獵人', '覺醒獵人'].includes(state.mechWolfState.learnedRole)) {
                    if (sealed) {
                        GameLogic.addHistory(`🚫 ${id}號 因${cause === 'ah_shot' ? '覺醒獵人夜槍擊殺' : (cause === 'explode' ? '自爆' : (cause === 'duel_wolf' ? '被決鬥' : '替死'))}，技能遭封印，無法開槍`);
                    } else {
                        let canShoot = true;
                        if (cause === 'poison') canShoot = false;
                        if (cause === 'charm') canShoot = false;
                        if (cause === 'wolf' && GameLogic.checkFeared(['機械狼'])) canShoot = false; 
                        if (canShoot) state.shootQueue.push({ id, role: '機械狼(獵槍)', cause });
                    }
                }

                if (role === '覺醒獵人') {
                    state.shootQueue.push({ id, role, cause });
                } else if (role === '獵人') {
                    let canShoot = true;
                    if (cause === 'poison') canShoot = false;
                    if (cause === 'charm' || cause === 'awb_sub') canShoot = false;
                    if (cause === 'wolf' && GameLogic.checkFeared(['獵人'])) canShoot = false;
                    if (canShoot) state.shootQueue.push({ id, role, cause });
                } else if (role === '黑狼王') {
                    if (cause === 'ah_shot' || cause === 'awb_sub' || cause === 'explode' || cause === 'duel_wolf') {
                        GameLogic.addHistory(`🚫 ${id}號 因${cause === 'ah_shot' ? '覺醒獵人夜槍擊殺' : (cause === 'explode' ? '自爆' : (cause === 'duel_wolf' ? '被決鬥' : '替死'))}，技能遭封印，無法開槍`);
                    } else {
                        let canShoot = true;
                        if (cause === 'poison') canShoot = false;
                        if (cause === 'charm') canShoot = false;
                        if (cause === 'wolf' && GameLogic.checkFeared(['黑狼王'])) canShoot = false; 
                        if (canShoot) state.shootQueue.push({ id, role, cause });
                    }
                }

                if (state.giftedState.hasGift && state.giftedState.id === id && state.giftedState.item === 'gun') {
                    let canShoot = true;
                    if (cause === 'poison') canShoot = false;
                    if (cause === 'charm' || cause === 'awb_sub') canShoot = false;
                    if (cause === 'wolf' && GameLogic.checkFeared([GameLogic.getPlayerSetupInfo(id).role])) canShoot = false;
                    if (canShoot) state.shootQueue.push({ id, role: `${role}(黑商獵槍)`, cause });
                }
            },

            popShooter() {
                const win = GameLogic.checkWinCondition();
                if (win) {
                    if (!state.isCalculatingNight && !state.winReasonPrinted) {
                        state.winReasonPrinted = true;
                        
                        if (state.morningData.daytimeCharmDeaths.length > 0) {
                            let charmHtml = state.morningData.daytimeCharmDeaths.map(d => `<span class="${GameLogic.getRoleClass(d.id)}">${d.role}(${d.id}號)</span> 殉情`).join('，');
                            state.finalEventHtml += `<br><span style="color:#aaa; font-size: 15px;">💔 連帶觸發：${charmHtml}</span>`;
                        }
                    }
                    state.pendingGameOver = win;
                    state.morningStep = 'vote'; 
                    return;
                }

                if (state.morningData.daytimeCharmDeaths.length > 0) {
                    state.morningStep = 'charm_reveal';
                    return;
                }

                if (state.shootQueue.length > 0) {
                    state.currentShooter = state.shootQueue.shift();
                    state.morningData.ahDirection = null;
                    if (state.currentShooter.role === '覺醒獵人') {
                        state.morningStep = 'ah_shoot';
                    } else {
                        state.morningStep = 'shoot';
                    }
                } else {
                    if (!state.isVotingDone) {
                        state.morningStep = 'vote';
                    } else {
                        GameLogic.processNextDay();
                    }
                }
            },

            checkAndPrintDaySummary() {
                if (state.daySummaryPrinted) return;
                
                const uniqueDayDeaths = [...new Set(state.morningData.daytimeDeaths)];
                if (!state.isVotingDone && uniqueDayDeaths.length === 0 && state.morningData.voteTarget === 0 && state.morningData.explodeTarget === 0 && state.morningData.knightDuelTarget === 0) {
                    return; 
                }

                state.daySummaryPrinted = true;
                if (uniqueDayDeaths.length === 0) {
                    GameLogic.addHistory(`🌇 白天結算：平安無事`);
                } else {
                    const diedStr = uniqueDayDeaths.sort((a,b)=>a-b).map(id => id + '號').join('、');
                    GameLogic.addHistory(`🌇 白天結算：${diedStr} 死亡`);
                }
            },

            calculateMorningResult() {
                state.morningSnapshot = JSON.parse(JSON.stringify({
                    players: state.players,
                    witchPotions: state.witchPotions,
                    lastGuardTarget: state.nightRecords.lastGuardTarget,
                    lastDreamTarget: state.nightRecords.lastDreamTarget,
                    lastAwbCharmTarget: state.nightRecords.lastAwbCharmTarget,
                    lastBearCharmTarget: state.nightRecords.lastBearCharmTarget,
                    lastMechWolfActionTarget: state.nightRecords.lastMechWolfActionTarget,
                    awbUsed: state.awbUsed,
                    ekUsed: state.ekUsed,
                    wolfBrotherRevengeUsed: state.wolfBrotherRevengeUsed,
                    mechWolfState: state.mechWolfState,
                    magicianUsedSwaps: state.magicianUsedSwaps,
                    giftedState: state.giftedState,
                    winReasonPrinted: state.winReasonPrinted,
                    history: state.history
                }));

                state.isCalculatingNight = true;
                state.isNight = false;
                state.currentPhase = 'morning';

                if (state.day === 1) {
                    state.players.forEach(p => {
                        p.role = '?';
                        p.class = 'color-unknown';
                    });

                    const assign = (id, roleName, className) => {
                        let p = state.players.find(x => x.id === id);
                        if (p) { p.role = roleName; p.class = className; }
                    };
                    
                    const nWolves = normalWolfCount.value;
                    state.initialRoleSetup.wolves.slice(0, nWolves).forEach(id => { if (id) assign(id, '狼人', 'color-wolf'); });
                    
                    if(state.activeRoles.magician) assign(state.initialRoleSetup.magician, '魔術師', 'color-god');
