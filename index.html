                    if(state.activeRoles.blackMerchant) assign(state.initialRoleSetup.blackMerchant, '黑市商人', 'color-god');
                    if(state.activeRoles.witch) assign(state.initialRoleSetup.witch, '女巫', 'color-god');
                    if(state.activeRoles.guard) assign(state.initialRoleSetup.guard, '守衛', 'color-god');
                    if(state.activeRoles.gargoyle) assign(state.initialRoleSetup.gargoyle, '石像鬼', 'color-wolf');
                    if(state.activeRoles.dreamer) assign(state.initialRoleSetup.dreamer, '攝夢人', 'color-god');
                    if(state.activeRoles.knight) assign(state.initialRoleSetup.knight, '騎士', 'color-god');
                    if(state.activeRoles.bear) assign(state.initialRoleSetup.bear, '熊', 'color-god');
                    if(state.activeRoles.gravekeeper) assign(state.initialRoleSetup.gravekeeper, '守墓人', 'color-god');
                    if(state.activeRoles.seer) assign(state.initialRoleSetup.seer, '預言家', 'color-god');
                    if(state.activeRoles.shadow) assign(state.initialRoleSetup.shadow, '燈影', 'color-villager');
                    if(state.activeRoles.medium) assign(state.initialRoleSetup.medium, '通靈師', 'color-god');
                    if(state.activeRoles.hunter) assign(state.initialRoleSetup.hunter, '獵人', 'color-god');
                    if(state.activeRoles.awakenedHunter) assign(state.initialRoleSetup.awakenedHunter, '覺醒獵人', 'color-god');
                    if(state.activeRoles.nightmare) assign(state.initialRoleSetup.nightmare, '夢魘', 'color-wolf');
                    if(state.activeRoles.mechWolf) assign(state.initialRoleSetup.mechWolf, '機械狼', 'color-wolf');
                    if(state.activeRoles.wolfBrothers) {
                        assign(state.initialRoleSetup.wolfBrother, '狼兄', 'color-wolf');
                        assign(state.initialRoleSetup.wolfYoungerBrother, '狼弟', 'color-wolf');
                    }
                    if(state.activeRoles.blackWolf) assign(state.initialRoleSetup.blackWolf, '黑狼王', 'color-wolf');
                    if(state.activeRoles.wolfBeauty) assign(state.initialRoleSetup.wolfBeauty, '狼美人', 'color-wolf');
                    if(state.activeRoles.awakenedWolfBeauty) assign(state.initialRoleSetup.awakenedWolfBeauty, '覺醒狼美人', 'color-wolf');
                    if(state.activeRoles.evilKnight) assign(state.initialRoleSetup.evilKnight, '惡靈騎士', 'color-wolf');

                    state.players.forEach(p => {
                        if (p.role === '?') { p.role = '平民'; p.class = 'color-villager'; }
                    });
                }

                GameLogic.addHistory(`<br><span style="color:#fff; font-size:16px; font-weight:bold;">=== 第${state.day}天 夜晚 ===</span>`);
                
                const logTarget = (origId) => {
                    if (!origId) return '';
                    let actualId = getActualTarget(origId);
                    if (origId === actualId) return `${origId}號`;
                    return `${origId}號，實際作用於 ${actualId}號`;
                };

                let actualWolfKill = getActualTarget(state.nightRecords.wolfKill);
                let actualWitchPoison = getActualTarget((state.nightRecords.witchAction === 'poison') ? state.nightRecords.witchPoison : 0);
                let actualDreamTarget = getActualTarget(state.nightRecords.dreamTarget);
                let actualGuardTarget = getActualTarget(state.nightRecords.guardTarget);
                let actualGargoyleTarget = getActualTarget(state.nightRecords.gargoyleTarget);
                let actualMechPoison = getActualTarget(state.nightRecords.mechWolfActionTarget); 
                let actualMechShield = getActualTarget(state.nightRecords.mechWolfActionTarget);
                let actualWolfBrotherRevenge = getActualTarget(state.nightRecords.wolfBrotherRevengeTarget);
                let actualSeerTarget = getActualTarget(state.nightRecords.seerTarget);
                let actualShadowTarget = getActualTarget(state.nightRecords.shadowTarget);
                let actualMediumTarget = getActualTarget(state.nightRecords.mediumTarget);
                let actualMechLearn = getActualTarget(state.nightRecords.mechWolfLearnTarget);
                let actualCharmTarget = getActualTarget(state.nightRecords.charmTarget);
                let actualAwbCharmTarget = getActualTarget(state.nightRecords.awbCharmTarget);
                let actualBearCharmTarget = getActualTarget(state.nightRecords.bearCharmTarget);

                if (state.nightRecords.magicianSwaps.length === 2) {
                    state.magicianUsedSwaps.push(...state.nightRecords.magicianSwaps);
                    GameLogic.addHistory(`🎩 ${state.initialRoleSetup.magician}號 交換了 ${state.nightRecords.magicianSwaps[0]}號 與 ${state.nightRecords.magicianSwaps[1]}號`);
                }

                if (state.nightRecords.nightmareTarget) GameLogic.addHistory(`👻 ${state.initialRoleSetup.nightmare}號 恐懼了 ${logTarget(state.nightRecords.nightmareTarget)}`);
                if (state.nightRecords.guardTarget) GameLogic.addHistory(`🛡️ ${state.initialRoleSetup.guard}號 守護了 ${logTarget(state.nightRecords.guardTarget)}`);
                if (state.activeRoles.dreamer && state.nightRecords.dreamTarget) GameLogic.addHistory(`💤 ${state.initialRoleSetup.dreamer}號 夢遊了 ${logTarget(state.nightRecords.dreamTarget)}`);
                
                if (state.day === 1 && state.activeRoles.blackMerchant && state.nightRecords.blackMerchantTarget !== 0) {
                    let bmTargetOrig = state.nightRecords.blackMerchantTarget;
                    let bmTarget = getActualTarget(bmTargetOrig);
                    
                    if (GameLogic.isStrictWolfTeam(bmTarget)) {
                        state.morningData.daytimeDeaths.push(state.initialRoleSetup.blackMerchant); 
                        GameLogic.addHistory(`🛍️ ${state.initialRoleSetup.blackMerchant}號 錯將禮物送給了 ${logTarget(bmTargetOrig)} (狼陣營)，遭到反噬死亡！`);
                    } else {
                        state.giftedState = { hasGift: true, id: bmTarget, item: state.nightRecords.blackMerchantItem, isUsed: false };
                        GameLogic.addHistory(`🛍️ 黑市商人 成功將 ${state.nightRecords.blackMerchantItem === 'verify' ? '放大鏡' : (state.nightRecords.blackMerchantItem === 'poison' ? '毒藥' : '獵槍')} 送給了 ${logTarget(bmTargetOrig)}`);
                    }
                }

                let poisons = [];

                if (state.day > 1 && state.giftedState.hasGift && !state.giftedState.isUsed && state.nightRecords.giftedPlayerTarget !== 0) {
                    let origGiftTarget = state.nightRecords.giftedPlayerTarget;
                    let actualGiftTarget = getActualTarget(origGiftTarget);
                    if (state.giftedState.item === 'poison') {
                        poisons.push({ id: actualGiftTarget, source: 'gift' });
                        state.giftedState.isUsed = true;
                        GameLogic.addHistory(`🎁 ${state.giftedState.id}號 使用黑商毒藥毒殺了 ${logTarget(origGiftTarget)}`);
                    } else if (state.giftedState.item === 'verify') {
                        let isW = GameLogic.isWolfTarget(actualGiftTarget);
                        state.giftedState.isUsed = true;
                        GameLogic.addHistory(`🎁 ${state.giftedState.id}號 使用黑商查驗了 ${logTarget(origGiftTarget)} (${isW ? '查殺' : '金水'})`);
                    }
                }

                if (state.nightRecords.gargoyleTarget) {
                    GameLogic.addHistory(`🗿 ${state.initialRoleSetup.gargoyle}號 查驗了 ${logTarget(state.nightRecords.gargoyleTarget)} (真實身分: ${GameLogic.getMediumCheckResult(actualGargoyleTarget)})`);
                }

                let actualMechWolfKill = 0;
                let isMechWolfAwakenedKill = false;
                
                if (state.activeRoles.mechWolf) {
                    if (!state.mechWolfState.hasLearned && state.nightRecords.mechWolfLearnTarget !== 0) {
                        let origLearn = state.nightRecords.mechWolfLearnTarget;
                        state.mechWolfState.hasLearned = true;
                        state.mechWolfState.learnedRole = GameLogic.getMediumCheckResult(getActualTarget(origLearn));
                        GameLogic.addHistory(`🤖 ${state.initialRoleSetup.mechWolf}號 學習了 ${logTarget(origLearn)}，真實身分為：${state.mechWolfState.learnedRole}`);
                    } else if (state.mechWolfState.hasLearned && state.nightRecords.mechWolfActionTarget !== 0 && !GameLogic.checkFeared(['機械狼'])) {
                        let role = state.mechWolfState.learnedRole;
                        let origTarget = state.nightRecords.mechWolfActionTarget;
                        let target = getActualTarget(origTarget);
                        if (role === '狼人') {
                            actualMechWolfKill = target;
                            state.mechWolfState.wolfKillUsed = true; 
                            if (state.playerCount >= 11) isMechWolfAwakenedKill = true;
                            GameLogic.addHistory(`🐺🤖 ${state.initialRoleSetup.mechWolf}號 使用${isMechWolfAwakenedKill ? '覺醒刀' : '額外一刀'}擊殺了 ${logTarget(origTarget)}`);
                        } else if (role === '女巫' && !state.mechWolfState.poisonUsed) {
                            poisons.push({ id: target, source: 'mech' });
                            state.mechWolfState.poisonUsed = true;
                            GameLogic.addHistory(`🤖🧪 ${state.initialRoleSetup.mechWolf}號 毒殺了 ${logTarget(origTarget)}`);
                        } else if (role === '守衛' && !state.mechWolfState.shieldBroken) {
                            GameLogic.addHistory(`🤖🛡️ ${state.initialRoleSetup.mechWolf}號 放置了防毒盾給 ${logTarget(origTarget)}`);
                        } else if (role === '通靈師') {
                            let res = GameLogic.getMediumCheckResult(target);
                            GameLogic.addHistory(`🤖🔮 ${state.initialRoleSetup.mechWolf}號 查驗了 ${logTarget(origTarget)} (${res})`);
                        } else if (role === '預言家') {
                            let isW = GameLogic.isWolfTarget(target);
                            GameLogic.addHistory(`🤖👁️ ${state.initialRoleSetup.mechWolf}號 查驗了 ${logTarget(origTarget)} (${isW ? '查殺' : '金水'})`);
                        } else if (role === '燈影') {
                            let isW = GameLogic.isWolfTarget(target);
                            GameLogic.addHistory(`🤖🏮 ${state.initialRoleSetup.mechWolf}號 查驗了 ${logTarget(origTarget)} (${!isW ? '查殺' : '金水'})`);
                        }
                    }
                }

                if (state.nightRecords.wolfBrotherRevengeTarget !== 0) {
                    if (!GameLogic.checkFeared(['狼弟'])) {
                        state.wolfBrotherRevengeUsed = true;
                        GameLogic.addHistory(`🐺👦 ${state.initialRoleSetup.wolfYoungerBrother}號 復仇刀擊殺了 ${logTarget(state.nightRecords.wolfBrotherRevengeTarget)}`);
                    }
                }

                if (state.activeRoles.wolfBeauty && state.nightRecords.charmTarget) GameLogic.addHistory(`💃 ${state.initialRoleSetup.wolfBeauty}號 魅惑了 ${logTarget(state.nightRecords.charmTarget)}`);
                if (state.activeRoles.awakenedWolfBeauty && state.nightRecords.awbCharmTarget) GameLogic.addHistory(`💃✨ ${state.initialRoleSetup.awakenedWolfBeauty}號 魅惑了 ${logTarget(state.nightRecords.awbCharmTarget)}`);
                if (state.isDittoWolfKingMode && state.dittoWolfKingRole === 'bear' && state.nightRecords.bearCharmTarget) GameLogic.addHistory(`🎭 ${state.initialRoleSetup[state.dittoWolfKingRole]}號 魅惑了 ${logTarget(state.nightRecords.bearCharmTarget)}`);
                
                if (state.nightRecords.seerTarget) {
                    if (state.isDittoWolfKingMode && state.dittoWolfKingRole === 'seer') {
                        GameLogic.addHistory(`👁️ ${state.initialRoleSetup.seer}號 查驗了 ${logTarget(state.nightRecords.seerTarget)} (真實身分: ${GameLogic.getPlayerSetupInfo(actualSeerTarget).role})`);
                    } else {
                        const isW = GameLogic.isWolfTarget(actualSeerTarget);
                        GameLogic.addHistory(`👁️ ${state.initialRoleSetup.seer}號 查驗了 ${logTarget(state.nightRecords.seerTarget)} (${isW ? '查殺' : '金水'})`);
                    }
                }
                if (state.nightRecords.shadowTarget) {
                    const isW = GameLogic.isWolfTarget(actualShadowTarget);
                    GameLogic.addHistory(`🏮 ${state.initialRoleSetup.shadow}號 查驗了 ${logTarget(state.nightRecords.shadowTarget)} (${!isW ? '查殺' : '金水'})`);
                }
                if (state.nightRecords.mediumTarget) {
                    GameLogic.addHistory(`🔮 ${state.initialRoleSetup.medium}號 查驗了 ${logTarget(state.nightRecords.mediumTarget)} (${GameLogic.getMediumCheckResult(actualMediumTarget)})`);
                }
                if (state.nightRecords.wolfKill) GameLogic.addHistory(`🐺 狼陣營 擊殺了 ${logTarget(state.nightRecords.wolfKill)}`);
                if (state.nightRecords.witchAction !== 'none') {
                    if (state.nightRecords.witchAction === 'heal') GameLogic.addHistory(`🧙‍♀️ ${state.initialRoleSetup.witch}號 使用了解藥`);
                    if (state.nightRecords.witchAction === 'poison') GameLogic.addHistory(`🧪 ${state.initialRoleSetup.witch}號 毒殺了 ${logTarget(state.nightRecords.witchPoison)}`);
                }

                if (state.nightRecords.witchAction === 'heal') state.witchPotions.heal = false;
                if (state.nightRecords.witchAction === 'poison') state.witchPotions.poison = false;

                let aliveBefore = state.players.filter(p => p.alive).map(p => p.id);

                if (GameLogic.checkFeared(['狼人', '夢魘', '黑狼王', '狼美人', '覺醒狼美人', '惡靈騎士', '機械狼', '狼兄', '石像鬼'])) actualWolfKill = 0;
                if (GameLogic.checkFeared(['女巫'])) actualWitchPoison = 0;
                
                let isGuardFeared = GameLogic.checkFeared(['守衛']);
                let isWitchFeared = GameLogic.checkFeared(['女巫']);

                if (actualWolfKill !== 0 && actualWolfKill === actualDreamTarget) actualWolfKill = 0;
                if (actualWitchPoison !== 0 && actualWitchPoison === actualDreamTarget) actualWitchPoison = 0;
                
                poisons = poisons.filter(p => p.id !== actualDreamTarget);

                let deaths = [];

                if (state.day === 1 && state.activeRoles.blackMerchant && state.nightRecords.blackMerchantTarget !== 0) {
                    let bmTarget = getActualTarget(state.nightRecords.blackMerchantTarget);
                    if (GameLogic.isStrictWolfTeam(bmTarget)) {
                        deaths.push({ id: state.initialRoleSetup.blackMerchant, cause: 'merchant_wolf' });
                    }
                }

                if (actualWolfKill !== 0) {
                    let isHealed = (state.nightRecords.witchAction === 'heal') && !isWitchFeared;
                    let isGuarded = (actualGuardTarget === actualWolfKill) && !isGuardFeared;
                    if ((isHealed && isGuarded) || (!isHealed && !isGuarded)) {
                        deaths.push({ id: actualWolfKill, cause: 'wolf' });
                    }
                }
                
                if (actualWolfBrotherRevenge !== 0) {
                    let isGuarded = (actualGuardTarget === actualWolfBrotherRevenge) && !isGuardFeared;
                    if (!isGuarded) {
                        deaths.push({ id: actualWolfBrotherRevenge, cause: 'wolf_brother_revenge' });
                    }
                }

                if (actualMechWolfKill !== 0) {
                    let isHealed = (state.nightRecords.witchAction === 'heal') && !isWitchFeared && (actualWolfKill === actualMechWolfKill);
                    let isGuarded = (actualGuardTarget === actualMechWolfKill) && !isGuardFeared;
                    
                    if (isMechWolfAwakenedKill) {
                        isGuarded = false; 
                    }
                    if ((isHealed && isGuarded) || (!isHealed && !isGuarded)) {
                        deaths.push({ id: actualMechWolfKill, cause: 'mech_wolf_kill' });
                    }
                }
                
                if (actualWitchPoison !== 0) poisons.push({id: actualWitchPoison, source: 'witch'});

                poisons = poisons.filter(p => {
                    if (p.id === actualMechShield && state.mechWolfState.learnedRole === '守衛' && !state.mechWolfState.shieldBroken) {
                        state.mechWolfState.shieldBroken = true;
                        GameLogic.addHistory(`🛡️ ${state.initialRoleSetup.mechWolf}號 的防毒盾成功擋下了毒藥 (${p.id}號)！防毒盾碎裂。`);
                        return false;
                    }
                if (GameLogic.getPlayerSetupInfo(p.id).role === '獵魔人') {
                        if (p.source === 'witch') {
                            GameLogic.addHistory(`🛡️ ${p.id}號 免疫了女巫的毒藥`);
                            return false;
                        }
                        if (p.source === 'gift') {
                            let giftedRole = GameLogic.getPlayerSetupInfo(state.giftedState.id).role;
                            if (!['狼人', '夢魘', '黑狼王', '狼美人', '覺醒狼美人', '惡靈騎士', '石像鬼', '機械狼', '狼兄', '狼弟'].includes(giftedRole)) {
                                GameLogic.addHistory(`🛡️ ${p.id}號 免疫了幸運兒(好人)的毒藥`);
                                return false;
                            }
                        }
                    }

                    return true;
                });

                poisons.forEach(p => {
                    deaths.push({ id: p.id, cause: 'poison' });
                });

                if (actualDreamTarget !== 0 && actualDreamTarget === state.nightRecords.lastDreamTarget) {
                    if (GameLogic.getPlayerSetupInfo(actualDreamTarget).role === '獵魔人') {
                        GameLogic.addHistory(`🛡️ ${actualDreamTarget}號 免疫了攝夢人的雙夢傷害`);
                    } else {
                        deaths.push({ id: actualDreamTarget, cause: 'dream_death' });
                    }
                }

                let dreamerId = state.initialRoleSetup.dreamer;
                let isDreamerDead = deaths.some(d => d.id === dreamerId);
                if (isDreamerDead && actualDreamTarget !== 0) {
                    deaths.push({ id: actualDreamTarget, cause: 'dream_link' });
                }

                let ekId = state.initialRoleSetup.evilKnight;
                if (ekId && state.activeRoles.evilKnight) {
                    deaths = deaths.filter(d => d.id !== ekId);

                    if (!state.ekUsed) {
                        let witchId = state.initialRoleSetup.witch;
                        let seerId = state.initialRoleSetup.seer;
                        let shadowId = state.initialRoleSetup.shadow;
                        let mediumId = state.initialRoleSetup.medium;
                        let mechWolfId = state.initialRoleSetup.mechWolf;
                        let reflected = false;

                        if (actualWitchPoison === ekId) {
                            if (witchId) deaths.push({ id: witchId, cause: 'ek_reflect' });
                            reflected = true;
                        }
                        if (!reflected && poisons.some(p => p.id === ekId && p.source === 'mech')) {
                            if (mechWolfId) deaths.push({ id: mechWolfId, cause: 'ek_reflect' });
                            reflected = true;
                        }
                        if (!reflected && poisons.some(p => p.id === ekId && p.source === 'gift')) {
                            if (state.giftedState.id) deaths.push({ id: state.giftedState.id, cause: 'ek_reflect' });
                            reflected = true;
                        }

                        let isSeerFeared = GameLogic.checkFeared(['預言家']);
                        if (!reflected && !isSeerFeared && actualSeerTarget === ekId) {
                            if (seerId) deaths.push({ id: seerId, cause: 'ek_reflect' });
                            reflected = true;
                        }

                        let isShadowFeared = GameLogic.checkFeared(['燈影']);
                        if (!reflected && !isShadowFeared && actualShadowTarget === ekId) {
                            if (shadowId) deaths.push({ id: shadowId, cause: 'ek_reflect' });
                            reflected = true;
                        }
                        
                        let isMediumFeared = GameLogic.checkFeared(['通靈師']);
                        if (!reflected && !isMediumFeared && actualMediumTarget === ekId) {
                            if (mediumId) deaths.push({ id: mediumId, cause: 'ek_reflect' });
                            reflected = true;
                        }
                        
                        let isGiftedFeared = GameLogic.checkFeared([GameLogic.getPlayerSetupInfo(state.giftedState.id).role]);
                        if (!reflected && state.giftedState.hasGift && state.giftedState.item === 'verify' && !isGiftedFeared && getActualTarget(state.nightRecords.giftedPlayerTarget) === ekId) {
                            if (state.giftedState.id) deaths.push({ id: state.giftedState.id, cause: 'ek_reflect' });
                            reflected = true;
                        }

                        if (!reflected && state.activeRoles.mechWolf && state.mechWolfState.hasLearned && !GameLogic.checkFeared(['機械狼']) && getActualTarget(state.nightRecords.mechWolfActionTarget) === ekId) {
                            if (['預言家', '燈影', '通靈師'].includes(state.mechWolfState.learnedRole)) {
                                if (mechWolfId) deaths.push({ id: mechWolfId, cause: 'ek_reflect' });
                                reflected = true;
                            }
                        }

                        if (reflected) state.ekUsed = true;
                    }
                }

                if (state.day > 1 && state.activeRoles.demonHunter && state.nightRecords.demonHunterTarget !== 0) {
                    let dhId = state.initialRoleSetup.demonHunter;
                    let dhTargetOrig = state.nightRecords.demonHunterTarget;
                    let dhTarget = getActualTarget(dhTargetOrig);

                    if (GameLogic.isWolfTarget(dhTarget)) {
                        deaths.push({ id: dhTarget, cause: 'demon_hunt_success' });
                        GameLogic.addHistory(`🏹 ${dhId}號 成功狩獵了狼人 ${logTarget(dhTargetOrig)}`);
                    } else {
                        deaths.push({ id: dhId, cause: 'demon_hunt_fail' });
                        GameLogic.addHistory(`🏹 ${dhId}號 狩獵失誤，目標 ${logTarget(dhTargetOrig)} 是好人，遭到反噬！`);
                    }
                }
                let uniqueDeaths = {};
                deaths.forEach(d => {
                    if (!uniqueDeaths[d.id]) {
                        uniqueDeaths[d.id] = d.cause;
                    } else {
                        if (['dream_death', 'dream_link', 'ek_reflect'].includes(d.cause)) {
                            uniqueDeaths[d.id] = d.cause;
                        }
                    }
                });

                Object.keys(uniqueDeaths).forEach(idStr => {
                    GameLogic.executeDeath(parseInt(idStr), uniqueDeaths[idStr]);
                });

                const nightWin = GameLogic.checkWinCondition();
                
                let aliveAfter = state.players.filter(p => p.alive).map(p => p.id);
                let died = aliveBefore.filter(id => !aliveAfter.includes(id));

                if (died.length === 0) {
                    GameLogic.addHistory(`🌃 夜晚結算：平安夜`);
                    state.morningResultHtml = "<h3 style='color:var(--btn-success); margin: 0;'>平安夜👏</h3>";
                    state.finalEventHtml = "<span style='color:var(--btn-success); font-weight:bold;'>平安夜</span>";
                } else {
                    const diedStr = died.sort((a,b)=>a-b).map(id => id + '號').join('、');
                    GameLogic.addHistory(`🌃 夜晚結算：${diedStr} 死亡`);
                    const deadIdsHtml = died.sort((a, b) => a - b).map(id => `<span class="${GameLogic.getRoleClass(id)}">${GameLogic.getPlayerSetupInfo(id).role}(${id}號)</span>`).join('，');
                    state.morningResultHtml = `<h3 style='margin: 0;'>昨晚 ${deadIdsHtml} 死亡</h3>`;
                    state.finalEventHtml = `昨晚 ${deadIdsHtml} 死亡`;
                }

                if (nightWin) {
                    state.pendingGameOver = nightWin;
                    GameLogic.addHistory(`🏁 遊戲結束：${nightWin.faction}`);
                    state.winReasonPrinted = true;
                    return; 
                }

                GameLogic.addHistory(`<br><span style="color:#fff; font-size:16px; font-weight:bold;">=== 第${state.day}天 白天 ===</span>`);

                state.isCalculatingNight = false;
                state.daySummaryPrinted = false;
                state.morningData.daytimeDeaths = [];
                state.morningData.daytimeCharmDeaths = [];

                state.nightRecords.lastGuardTarget = state.nightRecords.guardTarget;
                state.nightRecords.lastDreamTarget = state.nightRecords.dreamTarget;
                state.nightRecords.lastAwbCharmTarget = state.nightRecords.awbCharmTarget;
                state.nightRecords.lastBearCharmTarget = state.nightRecords.bearCharmTarget;
                state.nightRecords.lastMechWolfActionTarget = state.nightRecords.mechWolfActionTarget;
                
                state.crossDaySnapshot = JSON.parse(JSON.stringify({
                    players: state.players,
                    witchPotions: state.witchPotions,
                    nightRecords: state.nightRecords,
                    awbUsed: state.awbUsed,
                    ekUsed: state.ekUsed,
                    knightUsed: state.knightUsed,
                    wolfBrotherRevengeUsed: state.wolfBrotherRevengeUsed,
                    mechWolfState: state.mechWolfState,
                    magicianUsedSwaps: state.magicianUsedSwaps,
                    giftedState: state.giftedState,
                    dueledGoodTarget: state.dueledGoodTarget,
                    winReasonPrinted: state.winReasonPrinted,
                    history: state.history,
                    shootQueue: state.shootQueue,
                    
                    lastExiledTarget: state.lastExiledTarget,
                    lastDayExploded: state.lastDayExploded,

                    morningStep: 'morning_reveal', // <-- 變更為在此步驟停留
                    morningResultHtml: state.morningResultHtml,
                    finalEventHtml: state.finalEventHtml,
                    morningData: state.morningData,
                    currentShooter: null,
                    isVotingDone: false
                }));

                state.morningStep = 'morning_reveal'; // <-- 取代原本的 GameLogic.popShooter()
            },

            confirmShoot() {
                const target = state.morningData.shootTarget;
                const shooter = state.currentShooter;
                
                if (target !== 0) {
                    let isNightDeath = !['vote', 'explode', 'duel_wolf', 'duel_knight', 'ah_shot_day'].includes(shooter.cause);
                    let targetInfo = GameLogic.getPlayerSetupInfo(target);

                    if (targetInfo.role === '獵魔人' && isNightDeath && shooter.role !== '黑狼王') {
                        GameLogic.addHistory(`🔫 ${shooter.id}號 開槍帶走 ${target}號，但 ${target}號 免疫了夜槍傷害`);
                        state.morningResultHtml += `<br><span>💥 ${shooter.role} 開槍，但 <span class="color-god">獵魔人(${target}號)</span> 免疫了傷害</span>`;
                        state.finalEventHtml = `💥 ${shooter.role} 開槍，但 <span class="color-god">獵魔人(${target}號)</span> 免疫了傷害`;
                    } else {
                        GameLogic.addHistory(`🔫 ${shooter.id}號 開槍帶走了 ${target}號`);
                        state.morningResultHtml += `<br><span>💥 ${shooter.role} 開槍帶走了 <span class="${GameLogic.getRoleClass(target)}">${targetInfo.role}(${target}號)</span></span>`;
                        state.finalEventHtml = `💥 ${shooter.role} 開槍帶走了 <span class="${GameLogic.getRoleClass(target)}">${targetInfo.role}(${target}號)</span>`;
                        GameLogic.executeDeath(target, 'shot');
                    }
                    
                    state.morningData.lastShotTarget = target;
                    state.morningData.lastShooterRole = shooter.role;
                    state.morningStep = 'shoot_reveal';
                } else {
                    GameLogic.addHistory(`🔫 ${shooter.id}號 選擇壓槍`);
                    state.morningResultHtml += `<br><span style="color:#aaa;">💥 ${shooter.role} 選擇壓槍</span>`;
                    state.finalEventHtml = `💥 ${shooter.role} 選擇壓槍`;
                    GameLogic.popShooter();
                }
                state.morningData.shootTarget = 0;
            },

            findClosestWolf(startId, dir) {
                let n = state.playerCount;
                let curr = startId;
                for (let i = 0; i < n; i++) {
                    curr += dir;
                    if (curr > n) curr = 1;
                    if (curr < 1) curr = n;
                    let p = state.players.find(x => x.id === curr);
                    if (p && p.alive) {
                        let isW = false;
                        if (state.isDittoWolfKingMode && p.id === state.initialRoleSetup[state.dittoWolfKingRole]) isW = true;
                        else {
                            let r = GameLogic.getPlayerSetupInfo(p.id).role;
                            isW = ['狼人', '夢魘', '黑狼王', '狼美人', '覺醒狼美人', '惡靈騎士', '石像鬼', '機械狼', '狼兄', '狼弟'].includes(r);
                        }
                        if (isW) return p.id;
                    }
                }
                return null;
            },

            confirmAhShoot() {
                let dir = state.morningData.ahDirection;
                let shooter = state.currentShooter;
                if (dir === 0) {
                    GameLogic.addHistory(`🔫 ${shooter.id}號 選擇壓槍`);
                    state.morningResultHtml += `<br><span style="color:#aaa;">💥 覺醒獵人 選擇壓槍</span>`;
                    state.finalEventHtml = `💥 覺醒獵人 選擇壓槍`;
                    state.morningData.ahDirection = null;
                    GameLogic.popShooter();
                } else {
                    let target = GameLogic.findClosestWolf(shooter.id, dir);
                    if (target) {
                        let isNightDeath = !['vote', 'explode', 'duel_wolf', 'duel_knight', 'ah_shot_day'].includes(shooter.cause);
                        let targetInfo = GameLogic.getPlayerSetupInfo(target);

                        if (targetInfo.role === '獵魔人' && isNightDeath && shooter.role !== '黑狼王') {
                            GameLogic.addHistory(`🔫 ${shooter.id}號 向${dir>0?'遞增':'遞減'}方向開槍擊中 ${target}號，但 ${target}號 免疫了夜槍傷害`);
                            state.morningResultHtml += `<br><span>💥 覺醒獵人 開槍，但 <span class="color-god">獵魔人(${target}號)</span> 免疫了傷害</span>`;
                            state.finalEventHtml = `💥 覺醒獵人 開槍，但 <span class="color-god">獵魔人(${target}號)</span> 免疫了傷害`;
                        } else {
                            GameLogic.addHistory(`🔫 ${shooter.id}號 向${dir>0?'遞增':'遞減'}方向開槍，擊中了 ${target}號`);
                            state.morningResultHtml += `<br><span>💥 覺醒獵人 開槍擊殺了 <span class="${GameLogic.getRoleClass(target)}">${targetInfo.role}(${target}號)</span></span>`;
                            state.finalEventHtml = `💥 覺醒獵人 開槍擊殺了 <span class="${GameLogic.getRoleClass(target)}">${targetInfo.role}(${target}號)</span>`;
                            let outCause = isNightDeath ? 'ah_shot' : 'ah_shot_day';
                            GameLogic.executeDeath(target, outCause);
                        }

                        state.morningData.ahDirection = null;
                        state.morningData.lastShotTarget = target;
                        state.morningData.lastShooterRole = shooter.role;
                        state.morningStep = 'shoot_reveal';
                    } else {
                        GameLogic.addHistory(`🔫 ${shooter.id}號 開槍，但場上已無狼人`);
                        state.morningResultHtml += `<br><span style="color:#aaa;">💥 覺醒獵人 開槍，但場上已無狼人</span>`;
                        state.finalEventHtml = `💥 覺醒獵人 開槍，但場上已無狼人`;
                        state.morningData.ahDirection = null;
                        GameLogic.popShooter();
                    }
                }
            },

            confirmVote() {
                const voteTargetId = state.morningData.voteTarget;
                state.lastExiledTarget = voteTargetId;
                if (voteTargetId !== 0) {
                    const role = GameLogic.getPlayerSetupInfo(voteTargetId).role;
                    GameLogic.addHistory(`🗳️ 白天投票放逐了 ${voteTargetId}號`);
                    state.finalEventHtml = `🗳️ 白天投票放逐了 <span class="${GameLogic.getRoleClass(voteTargetId)}">${role}(${voteTargetId}號)</span>`;
                    GameLogic.executeDeath(voteTargetId, 'vote');
                } else {
                    GameLogic.addHistory(`🗳️ 白天投票結果為 無人出局 (棄票/平票)`);
                    state.finalEventHtml = `🗳️ 白天投票結果為 無人出局`;
                }
                state.isVotingDone = true;
                GameLogic.popShooter();
            },

            confirmExplode() {
                const targetId = state.morningData.explodeTarget;
                state.lastDayExploded = true;
                if (targetId !== 0) {
                    const role = GameLogic.getPlayerSetupInfo(targetId).role;
                    GameLogic.addHistory(`💣 ${targetId}號 選擇自爆！`);
                    state.morningResultHtml += `<br><span style="color:var(--btn-danger);">💣 <span class="${GameLogic.getRoleClass(targetId)}">${role}(${targetId}號)</span> 選擇自爆！</span>`;
                    state.finalEventHtml = `💣 <span class="${GameLogic.getRoleClass(targetId)}">${role}(${targetId}號)</span> 選擇自爆！`;
                    GameLogic.executeDeath(targetId, 'explode');
                }
                state.morningData.explodeTarget = 0;
                state.isVotingDone = true; 
                GameLogic.popShooter(); 
            },

            confirmDuel() {
                const targetId = state.morningData.knightDuelTarget;
                state.knightUsed = true;
                
                let targetRole = GameLogic.getPlayerSetupInfo(targetId).role;
                let isTargetWolf = ['狼人', '夢魘', '黑狼王', '狼美人', '覺醒狼美人', '惡靈騎士', '石像鬼', '機械狼', '狼兄', '狼弟'].includes(targetRole) || (state.isDittoWolfKingMode && targetId === state.initialRoleSetup[state.dittoWolfKingRole]);

                state.morningData.knightDuelTargetInfo = { id: targetId, role: targetRole, isWolf: isTargetWolf };
                state.morningStep = 'knight_reveal';
            },

            confirmKnightReveal() {
                const targetId = state.morningData.knightDuelTargetInfo.id;
                const targetRole = state.morningData.knightDuelTargetInfo.role;
                const knightId = state.initialRoleSetup.knight;
                
                if (state.morningData.knightDuelTargetInfo.isWolf) {
                    GameLogic.addHistory(`⚔️ ${knightId}號 決鬥了 ${targetId}號，狼人死亡！`);
                    state.morningResultHtml += `<br><span style="color:var(--btn-success);">⚔️ <span class="color-god">騎士</span> 決鬥成功！<span class="${GameLogic.getRoleClass(targetId)}">${targetRole}(${targetId}號)</span> 死亡！</span>`;
                    state.finalEventHtml = `⚔️ <span class="color-god">騎士</span> 決鬥成功！<span class="${GameLogic.getRoleClass(targetId)}">${targetRole}(${targetId}號)</span> 死亡`;
                    GameLogic.executeDeath(targetId, 'duel_wolf');
                    state.isVotingDone = true; 
                } else {
                    GameLogic.addHistory(`⚔️ ${knightId}號 決鬥了 ${targetId}號，好人平安，${knightId}號 以死謝罪！`);
                    state.morningResultHtml += `<br><span style="color:var(--btn-danger);">⚔️ <span class="color-god">騎士</span> 決鬥失敗！<span class="color-god">騎士(${knightId}號)</span> 以死謝罪！</span>`;
                    state.finalEventHtml = `⚔️ <span class="color-god">騎士</span> 決鬥失敗！<span class="color-god">騎士(${knightId}號)</span> 以死謝罪`;
                    state.dueledGoodTarget = targetId; 
                    GameLogic.executeDeath(knightId, 'duel_knight');
                }
                state.morningData.knightDuelTarget = 0;
                state.morningData.knightDuelTargetInfo = null;
                GameLogic.popShooter(); 
            },

            processNextDay() {
                GameLogic.checkAndPrintDaySummary();
                const gameOverCheck = GameLogic.checkWinCondition();
                if (gameOverCheck) {
                    state.pendingGameOver = gameOverCheck;
                    state.morningStep = 'vote'; 
                    return;
                }
                
                state.lastExiledTarget = state.morningData.voteTarget;
                state.lastDayExploded = state.morningData.explodeTarget !== 0;

                state.day++;
                GameLogic.startNight();
            },

            checkWinCondition() {
                const alive = state.players.filter(p => p.alive);
                const dittoId = state.isDittoWolfKingMode ? state.initialRoleSetup[state.dittoWolfKingRole] : null;

                const aliveWolves = alive.filter(p => {
                    if (p.id === dittoId) return true;
                    return ['狼人', '夢魘', '黑狼王', '狼美人', '覺醒狼美人', '惡靈騎士', '石像鬼', '機械狼', '狼兄', '狼弟'].includes(p.role);
                }).length;

                const aliveGods = alive.filter(p => {
                    if (p.id === dittoId) return false;
                    return ['魔術師', '黑市商人', '女巫', '守衛', '獵魔人', '預言家', '獵人', '覺醒獵人', '熊', '攝夢人', '騎士', '守墓人', '通靈師'].includes(p.role);
            }).length;
                
                const aliveVillagers = alive.filter(p => {
                    if (p.id === dittoId) return false;
                    return ['平民', '燈影'].includes(p.role);
                }).length;

                if (aliveGods === 0) return { faction: "🐺 狼人陣營獲勝！", reason: "(神職全數出局 - 屠神)" };
                if (aliveVillagers === 0) return { faction: "🐺 狼人陣營獲勝！", reason: "(平民全數出局 - 屠民)" };
                if (aliveWolves === 0) return { faction: "🎉 好人陣營獲勝！", reason: "(狼人全數出局)" };
                return null;
            }
        };

        const isPlayerTaken = (id, roleKey, wolfIndex = null) => {
            const s = state.initialRoleSetup;
            if (roleKey !== 'magician' && s.magician === id) return true;
            if (roleKey !== 'blackMerchant' && s.blackMerchant === id) return true;
            if (roleKey !== 'nightmare' && s.nightmare === id) return true;
            if (roleKey !== 'blackWolf' && s.blackWolf === id) return true;
            if (roleKey !== 'wolfBeauty' && s.wolfBeauty === id) return true;
            if (roleKey !== 'awakenedWolfBeauty' && s.awakenedWolfBeauty === id) return true;
            if (roleKey !== 'evilKnight' && s.evilKnight === id) return true;
            if (roleKey !== 'gargoyle' && s.gargoyle === id) return true;
            if (roleKey !== 'mechWolf' && s.mechWolf === id) return true;
            if (roleKey !== 'wolfBrother' && s.wolfBrother === id) return true;
            if (roleKey !== 'wolfYoungerBrother' && s.wolfYoungerBrother === id) return true;
            if (roleKey !== 'guard' && s.guard === id) return true;
            if (roleKey !== 'dreamer' && s.dreamer === id) return true;
            if (roleKey !== 'knight' && s.knight === id) return true;
            if (roleKey !== 'bear' && s.bear === id) return true;
            if (roleKey !== 'gravekeeper' && s.gravekeeper === id) return true;
            if (roleKey !== 'seer' && s.seer === id) return true;
            if (roleKey !== 'witch' && s.witch === id) return true;
            if (roleKey !== 'demonHunter' && s.demonHunter === id) return true;
            if (roleKey !== 'hunter' && s.hunter === id) return true;
            if (roleKey !== 'awakenedHunter' && s.awakenedHunter === id) return true;
            if (roleKey !== 'shadow' && s.shadow === id) return true;
            if (roleKey !== 'medium' && s.medium === id) return true;
            
            if (roleKey === 'wolf') {
                const activeW = s.wolves.slice(0, normalWolfCount.value);
                return activeW.some((wId, idx) => wId === id && idx !== wolfIndex);
            } else {
                const activeW = s.wolves.slice(0, normalWolfCount.value);
                return activeW.includes(id);
            }
        };

        const isTargetInvalidForSeer = (id) => {
            if (state.activeRoles.knight && state.knightUsed && id === state.initialRoleSetup.knight) return true;
            if (state.dueledGoodTarget !== 0 && id === state.dueledGoodTarget) return true;
            return false;
        };

        const getPhaseHeaderClass = (roleKey, defaultClass) => {
            if (state.isDittoWolfKingMode && state.dittoWolfKingRole === roleKey) {
                return 'color-wolf';
            }
            return defaultClass;
        };

        const formatLog = (log) => {
            let formatted = log.replace(/(\d+)\s*號/g, (match, idStr) => {
                const id = parseInt(idStr);
                const roleClass = GameLogic.getRoleClass(id);
                const roleName = GameLogic.getPlayerSetupInfo(id).role;
                const dittoTag = (state.isDittoWolfKingMode && id === state.initialRoleSetup[state.dittoWolfKingRole]) ? '<span style="color:#ff9800;">(百變)</span>' : '';
                return `<span class="${roleClass}" style="font-weight: bold;">${roleName}(${id}號)${dittoTag}</span>`;
            });
            
            formatted = formatted.replace(/好人陣營獲勝！/g, '<span style="color: var(--color-good); font-weight: bold;">好人陣營獲勝！</span>');
            formatted = formatted.replace(/狼人陣營獲勝！/g, '<span style="color: var(--color-wolf); font-weight: bold;">狼人陣營獲勝！</span>');
            
            return formatted;
        };

        const toggleMagicianSwap = (id) => {
            const arr = state.nightRecords.magicianSwaps;
            if (arr.includes(id)) {
                state.nightRecords.magicianSwaps = arr.filter(x => x !== id);
            } else if (arr.length < 2) {
                state.nightRecords.magicianSwaps.push(id);
            }
        };

        const setSeerTarget = (id) => {
            state.nightRecords.seerTarget = id;
            if (state.day === 1 && id !== 0) fillUnknownWithVillager();
        };

        const setMediumTarget = (id) => {
            state.nightRecords.mediumTarget = id;
            if (state.day === 1 && id !== 0) fillUnknownWithVillager();
        };

        const fillUnknownWithVillager = () => {
            state.players.forEach(p => {
                p.role = '?';
                p.class = 'color-unknown';
            });
            const assign = (playerId, roleName, className) => {
                let p = state.players.find(x => x.id === playerId);
                if (p) { p.role = roleName; p.class = className; }
            };
            const nWolves = normalWolfCount.value;
            state.initialRoleSetup.wolves.slice(0, nWolves).forEach(wId => { if (wId) assign(wId, '狼人', 'color-wolf'); });
            
            if(state.activeRoles.magician) assign(state.initialRoleSetup.magician, '魔術師', 'color-god');
            if(state.activeRoles.blackMerchant) assign(state.initialRoleSetup.blackMerchant, '黑市商人', 'color-god');
            if(state.activeRoles.witch) assign(state.initialRoleSetup.witch, '女巫', 'color-god');
            if(state.activeRoles.guard) assign(state.initialRoleSetup.guard, '守衛', 'color-god');
            if(state.activeRoles.gargoyle) assign(state.initialRoleSetup.gargoyle, '石像鬼', 'color-wolf');
            if(state.activeRoles.dreamer) assign(state.initialRoleSetup.dreamer, '攝夢人', 'color-god');
            if(state.activeRoles.knight) assign(state.initialRoleSetup.knight, '騎士', 'color-god');
            if(state.activeRoles.bear) assign(state.initialRoleSetup.bear, '熊', 'color-god');
            if(state.activeRoles.gravekeeper) assign(state.initialRoleSetup.gravekeeper, '守墓人', 'color-god');
            if(state.activeRoles.seer) assign(state.initialRoleSetup.seer, '預言家', 'color-god');
            if(state.activeRoles.shadow) assign(state.initialRoleSetup.shadow, '燈影', 'color-villager');
            if(state.activeRoles.medium) assign(state.initialRoleSetup.medium, '通靈師', 'color-god');
            if(state.activeRoles.hunter) assign(state.initialRoleSetup.hunter, '獵人', 'color-god');
            if(state.activeRoles.awakenedHunter) assign(state.initialRoleSetup.awakenedHunter, '覺醒獵人', 'color-god');
            if(state.activeRoles.nightmare) assign(state.initialRoleSetup.nightmare, '夢魘', 'color-wolf');
            if(state.activeRoles.mechWolf) assign(state.initialRoleSetup.mechWolf, '機械狼', 'color-wolf');
            if(state.activeRoles.wolfBrothers) {
                assign(state.initialRoleSetup.wolfBrother, '狼兄', 'color-wolf');
                assign(state.initialRoleSetup.wolfYoungerBrother, '狼弟', 'color-wolf');
            }
            if(state.activeRoles.blackWolf) assign(state.initialRoleSetup.blackWolf, '黑狼王', 'color-wolf');
            if(state.activeRoles.wolfBeauty) assign(state.initialRoleSetup.wolfBeauty, '狼美人', 'color-wolf');
            if(state.activeRoles.awakenedWolfBeauty) assign(state.initialRoleSetup.awakenedWolfBeauty, '覺醒狼美人', 'color-wolf');
            if(state.activeRoles.evilKnight) assign(state.initialRoleSetup.evilKnight, '惡靈騎士', 'color-wolf');

            state.players.forEach(p => {
                if (p.role === '?' || p.role === '未定') { 
                    p.role = '平民'; 
                    p.class = 'color-villager'; 
                }
            });
        };

        const toggleRole = (roleId) => {
            state.activeRoles[roleId] = !state.activeRoles[roleId];
            if (roleId === 'shadow' && state.activeRoles.shadow) {
                state.activeRoles.seer = true;
            } else if (roleId === 'seer' && !state.activeRoles.seer) {
                state.activeRoles.shadow = false;
            }
        };

        const startGame = () => {
            const godRolesList = Object.values(ROLE_DICT).filter(r => r.type === 'god' && r.selectable);
            const activeGods = godRolesList.filter(r => state.activeRoles[r.id]);
            let isDitto = false;
            if (activeGods.length === 5) {
                isDitto = true;
            }

            let spWolfCount = 0;
            if (state.activeRoles.nightmare) spWolfCount++;
            if (state.activeRoles.blackWolf) spWolfCount++;
            if (state.activeRoles.wolfBeauty) spWolfCount++;
            if (state.activeRoles.awakenedWolfBeauty) spWolfCount++;
            if (state.activeRoles.evilKnight) spWolfCount++;
            if (state.activeRoles.gargoyle) spWolfCount++;
            if (state.activeRoles.mechWolf) spWolfCount++;
            if (state.activeRoles.wolfBrothers) spWolfCount += 2; 
            if (isDitto) spWolfCount++;

            const maxW = state.playerCount <= 10 ? 3 : 4;
            
            if (spWolfCount > maxW) {
                alert(`【特殊狼人超過數量】\n${state.playerCount} 人局狼陣營總數不可超過 ${maxW} 名！\n您目前的特殊狼人（含百變狼王）已達 ${spWolfCount} 名，請減少配置。`);
                return;
            }

            if (isDitto) {
                state.isDittoWolfKingMode = true;
                const randomGod = activeGods[Math.floor(Math.random() * activeGods.length)];
                state.dittoWolfKingRole = randomGod.id;
             alert(`【百變狼王模式已啟動】\n系統偵測到 5 張神牌，隨機抽取「${randomGod.name}」成為百變狼王！\n（該角色底牌為狼人，與狼隊不互認，且擁有專屬變異技能）`);
            } else {
                state.isDittoWolfKingMode = false;
                state.dittoWolfKingRole = null;
            }

            GameLogic.initPlayers();
            state.history = [];
            state.screen = 'game';
            state.day = 1;
            state.initialRoleSetup.wolves = [];
            state.awbUsed = false;
            state.knightUsed = false;
            state.ekUsed = false;
            state.mechWolfState = { hasLearned: false, learnedRole: null, poisonUsed: false, shieldBroken: false, wolfKillUsed: false };
            state.wolfBrotherRevengeUsed = false;
            state.dueledGoodTarget = 0;
            state.winReasonPrinted = false;
            
            state.nightRecords.bearCharmTarget = 0;
            state.nightRecords.lastBearCharmTarget = 0;
            state.nightRecords.wolfBrotherRevengeTarget = 0;
            
            state.magicianUsedSwaps = [];
            state.giftedState = { hasGift: false, id: 0, item: '', isUsed: false };

            GameLogic.startNight();
        };

        const setWitchAction = (action) => {
            if (action === 'heal') {
                if (actualWolfKillForWitch.value === 0 || !state.witchPotions.heal || isWitchSelfSaveRestricted.value) return;
                if (state.nightRecords.witchAction === 'heal') {
                    state.nightRecords.witchAction = 'none';
                } else {
                    state.nightRecords.witchAction = 'heal';
                    state.nightRecords.witchPoison = 0;
                }
            } else if (action === 'none') {
                if (state.isDittoWolfKingMode && state.dittoWolfKingRole === 'witch' && state.day === 1 && actualWolfKillForWitch.value !== 0) return;
                state.nightRecords.witchAction = 'none';
                state.nightRecords.witchPoison = 0;
            }
        };

        const setPoisonTarget = (id) => {
            if (!state.witchPotions.poison) return;
            if (state.isDittoWolfKingMode && state.dittoWolfKingRole === 'witch' && state.day === 1) return;
            
            if (state.nightRecords.witchPoison === id) {
                state.nightRecords.witchPoison = 0;
                if (state.nightRecords.witchAction === 'poison') state.nightRecords.witchAction = 'none';
            } else {
                state.nightRecords.witchPoison = id;
                state.nightRecords.witchAction = 'poison';
            }
        };

        const setKnightDuelTarget = (id) => {
            if (!isTargetInvalidForSeer(id)) {
                state.morningData.knightDuelTarget = id;
                state.morningData.voteTarget = 0;
                state.morningData.explodeTarget = 0;
            }
        };

        const triggerGameOver = () => {
            GameLogic.checkAndPrintDaySummary();
            state.gameOverResult = state.pendingGameOver.faction.replace('🎉 ', '').replace('🐺 ', ''); 
            state.history.push(`<br><span style="color:#fff; font-size:16px; font-weight:bold;">=== 遊戲結束 ===</span>`);
            state.history.push(`🏁 ${state.pendingGameOver.faction}`); 
            state.screen = 'gameover'; 
        };

        // ================= 各大組件定義 =================

        // [設定畫面組件]
        const SetupScreen = {
            template: '#setup-template',
            setup() {
                const godRoles = computed(() => Object.values(ROLE_DICT).filter(r => r.type === 'god' && r.selectable));
                const specialWolfRoles = computed(() => Object.values(ROLE_DICT).filter(r => r.type === 'wolf' && r.selectable && r.id !== 'wolfBrothers'));
                const specialVillagerRoles = computed(() => Object.values(ROLE_DICT).filter(r => r.type === 'villager' && r.selectable));
                const wolfMenuRoles = computed(() => {
                    const roles = [...specialWolfRoles.value];
                    roles.push(ROLE_DICT.wolfBrothers);
                    return roles;
                });

                return {
                    state, normalWolfCount, godRoles, specialWolfRoles, wolfMenuRoles, specialVillagerRoles, toggleRole, startGame
                };
            }
        };

        // [遊戲結束畫面組件]
        const GameOverScreen = {
            template: '#game-over-template',
            setup() {
                const downloadReportAsImage = async () => {
                    const reportEl = document.getElementById('battle-report');
                    if (!reportEl) return;
                    
                    const originalMaxHeight = reportEl.style.maxHeight;
                    const originalOverflow = reportEl.style.overflowY;
                    reportEl.style.maxHeight = 'none';
                    reportEl.style.overflowY = 'visible';

                    try {
                        const canvas = await html2canvas(reportEl, {
                            backgroundColor: '#111', 
                            scale: 2 
                        });
                        
                        const imgData = canvas.toDataURL('image/png');
                        const link = document.createElement('a');
                        
                        const date = new Date();
                        const dateString = `${date.getFullYear()}${(date.getMonth() + 1).toString().padStart(2, '0')}${date.getDate().toString().padStart(2, '0')}`;
                        link.download = `狼人殺戰報_${dateString}.png`;
                        
                        link.href = imgData;
                        link.click();
                    } catch (error) {
                        console.error('匯出戰報失敗:', error);
                        alert('匯出戰報失敗，請重試。');
                    } finally {
                        reportEl.style.maxHeight = originalMaxHeight;
                        reportEl.style.overflowY = originalOverflow;
                    }
                };
                const reloadPage = () => window.location.reload();

                return {
                    state, formatLog, getPlayerSetupInfo: GameLogic.getPlayerSetupInfo, downloadReportAsImage, reloadPage
                };
            }
        };

        // [遊戲進行中組件]
        const GameScreen = {
            template: '#game-template',
            setup() {
                const alivePlayers = computed(() => state.players.filter(p => p.alive));
                const explodableWolves = computed(() => alivePlayers.value.filter(p => {
                    const role = GameLogic.getPlayerSetupInfo(p.id).role;
                    return role === '狼人' || role === '黑狼王';
                }));

                const bearGrowl = computed(() => {
                    const bearId = state.initialRoleSetup.bear;
                    if (!bearId || !state.activeRoles.bear) return { isSet: false };
                    
                    const bear = state.players.find(p => p.id === bearId);
                    if (!bear || !bear.alive) return { isSet: true, isDead: true, growl: false };

                    let left = null;
                    for (let i = 1; i < state.playerCount; i++) {
                        let id = bearId - i;
                        if (id <= 0) id += state.playerCount;
                        let p = state.players.find(x => x.id === id);
                        if (p && p.alive) { left = p; break; }
                    }

                    let right = null;
                    for (let i = 1; i < state.playerCount; i++) {
                        let id = bearId + i;
                        if (id > state.playerCount) id -= state.playerCount;
                        let p = state.players.find(x => x.id === id);
                        if (p && p.alive) { right = p; break; }
                    }

                    const isWolf = (p) => {
                        if(!p) return false;
                        return GameLogic.isWolfTarget(p.id);
                    };

                    let growl = false;
                    let reason = "";
                    
                    if (isWolf(left) && isWolf(right)) {
                        growl = true;
                        reason = `相鄰的 ${left.id}號 及 ${right.id}號 皆為狼陣營`;
                    } else if (isWolf(left)) {
                        growl = true;
                        reason = `相鄰的 ${left.id}號 為狼陣營`;
                    } else if (isWolf(right)) {
                        growl = true;
                        reason = `相鄰的 ${right.id}號 為狼陣營`;
                    } else {
                        growl = false;
                        reason = `相鄰玩家皆為好人`;
                    }
                    
                    if (state.isDittoWolfKingMode && state.dittoWolfKingRole === 'bear') {
                        growl = !growl;
                        reason = growl ? `因百變狼王技能反轉 (原本不叫)` : `因百變狼王技能反轉 (原本會叫)`;
                    }

                    return { isSet: true, isDead: false, growl, reason };
                });
                const hunterSignal = computed(() => {
                    const hunterId = state.initialRoleSetup.hunter;
                    if (!hunterId) return { canShoot: false, isDead: false, reason: "", notSet: true };
                    
                    const p = state.players.find(x => x.id === hunterId);
                    if (p && !p.alive && state.day > 1) return { canShoot: false, isDead: true, reason: "已經在前幾日出局" };

                    if (GameLogic.checkFeared(['獵人'])) return { canShoot: false, isDead: false, reason: "今晚被夢魘恐懼" };
                    if (state.nightRecords.witchAction === 'poison' && getActualTarget(state.nightRecords.witchPoison) === hunterId) {
                        return { canShoot: false, isDead: false, reason: "今晚被女巫毒殺" };
                    }
                    if (state.nightRecords.dreamTarget !== 0 && getActualTarget(state.nightRecords.dreamTarget) === state.nightRecords.lastDreamTarget && getActualTarget(state.nightRecords.dreamTarget) === hunterId) {
                        return { canShoot: false, isDead: false, reason: "連續兩晚被夢遊，技能封印" };
                    }
                    
                    let wbId = state.initialRoleSetup.wolfBeauty;
                    if (wbId !== 0 && getActualTarget(state.nightRecords.charmTarget) === hunterId) {
                        let wbDies = false;
                        if (state.nightRecords.witchAction === 'poison' && getActualTarget(state.nightRecords.witchPoison) === wbId) wbDies = true;
                        let wKill = getActualTarget(state.nightRecords.wolfKill);
                        if (wKill === wbId) {
                            let healed = (state.nightRecords.witchAction === 'heal' && !GameLogic.checkFeared(['女巫']));
                            let guarded = (getActualTarget(state.nightRecords.guardTarget) === wbId && !GameLogic.checkFeared(['守衛']));
                            if ((healed && guarded) || (!healed && !guarded)) wbDies = true; 
                        }
                        if (wbDies) return { canShoot: false, isDead: false, reason: "狼美人今晚出局，殉情無法發動技能" };
                    }

                    return { canShoot: true, isDead: false, reason: "若今晚出局，可發動技能" };
                });
                const ahSignal = computed(() => {
                    const ahId = state.initialRoleSetup.awakenedHunter;
                    if (!ahId) return { isDead: false, notSet: true };
                    const p = state.players.find(x => x.id === ahId);
                    if (p && !p.alive && state.day > 1) return { isDead: true, notSet: false };
                    return { isDead: false, notSet: false };
                });
                const canDittoWolfKingKill = computed(() => {
                    if (!state.isDittoWolfKingMode) return false;
                    const dittoId = state.initialRoleSetup[state.dittoWolfKingRole];
                    const otherWolvesAlive = state.players.some(p => {
                        if (!p.alive || p.id === dittoId) return false;
const r = GameLogic.getPlayerSetupInfo(p.id).role;
                        return ['狼人', '夢魘', '黑狼王', '狼美人', '覺醒狼美人', '惡靈騎士', '石像鬼', '狼兄', '狼弟'].includes(r);
                    });
                    return !otherWolvesAlive;
                });

                    const isWolfTeamDeadExcludingGargoyle = computed(() => {
                    const gargoyleId = state.initialRoleSetup.gargoyle;
                    const dittoId = state.isDittoWolfKingMode ? state.initialRoleSetup[state.dittoWolfKingRole] : null;
                    const otherWolvesAlive = state.players.some(p => {
                        if (!p.alive || p.id === gargoyleId) return false;
                        if (p.id === dittoId) return true;
                        const r = GameLogic.getPlayerSetupInfo(p.id).role;
                        return ['狼人', '夢魘', '黑狼王', '狼美人', '覺醒狼美人', '惡靈騎士', '機械狼', '狼兄', '狼弟'].includes(r);
                    });
                    return !otherWolvesAlive;
                });

                // 👇👇 請補上這一段缺失的機械狼帶刀判定 👇👇
                const isWolfTeamDeadExcludingMech = computed(() => {
                    const mechWolfId = state.initialRoleSetup.mechWolf;
                    const dittoId = state.isDittoWolfKingMode ? state.initialRoleSetup[state.dittoWolfKingRole] : null;
                    const otherWolvesAlive = state.players.some(p => {
                        if (!p.alive || p.id === mechWolfId) return false;
                        if (p.id === dittoId) return true;
                        const r = GameLogic.getPlayerSetupInfo(p.id).role;
                        return ['狼人', '夢魘', '黑狼王', '狼美人', '覺醒狼美人', '惡靈騎士', '石像鬼', '狼兄', '狼弟'].includes(r);
                    });
                    return !otherWolvesAlive;
                });

                const isDittoWolfKingDead = computed(() => {
                    if (!state.isDittoWolfKingMode) return true;
                    return GameLogic.isRoleDead(state.dittoWolfKingRole);
                });

                const setGuardTarget = (id) => {
                    if (state.nightRecords.lastGuardTarget === id && state.day > 1) return;
                    state.nightRecords.guardTarget = id;
                };

                const confirmCharmReveal = () => {
                    state.morningData.daytimeCharmDeaths = [];
                    GameLogic.popShooter();
                };

                const confirmShootReveal = () => {
                    state.morningData.lastShotTarget = 0;
                    state.morningData.lastShooterRole = '';
                    GameLogic.popShooter();
                };

                return {
                    state, 
                    normalWolfCount,
                    alivePlayers, 
                    explodableWolves, 
                    isWitchSelfSaveRestricted, 
                    bearGrowl, 
                    hunterSignal, 
                    ahSignal,
                    canDittoWolfKingKill, 
                    isWolfTeamDeadExcludingMech, 
                    isWolfTeamDeadExcludingGargoyle, 
                    isDittoWolfKingDead, 
                    actualWolfKillForWitch,
                    getPlayerSetupInfo: GameLogic.getPlayerSetupInfo, 
                    getRoleClass: GameLogic.getRoleClass,
                    getMediumCheckResult: GameLogic.getMediumCheckResult, 
                    checkFeared: GameLogic.checkFeared,
                    isWolfTarget: GameLogic.isWolfTarget, 
                    isTargetInvalidForSeer, 
                    getPhaseHeaderClass, 
                    getActualTarget,
                    setWitchAction, 
                    setPoisonTarget, 
                    setKnightDuelTarget, 
                    triggerGameOver,
                    prevPhase: GameLogic.prevPhase, 
                    nextPhase: GameLogic.nextPhase,
                    confirmShoot: GameLogic.confirmShoot, 
                    confirmAhShoot: GameLogic.confirmAhShoot,
                    confirmVote: GameLogic.confirmVote, 
                    confirmExplode: GameLogic.confirmExplode,
                    confirmDuel: GameLogic.confirmDuel, 
                    confirmKnightReveal: GameLogic.confirmKnightReveal,
                    toggleMagicianSwap, 
                    setSeerTarget, 
                    setMediumTarget, 
                    setGuardTarget,
                    confirmCharmReveal, 
                    confirmShootReveal, 
                    acknowledgeMorningReveal: () => GameLogic.popShooter(),
                    isRoleDead: GameLogic.isRoleDead, 
                    isPlayerTaken
                };
            }
        };

        // ================= 啟動 Vue 應用 =================
        const app = createApp({
            components: {
                'setup-screen': SetupScreen,
                'game-over-screen': GameOverScreen,
                'game-screen': GameScreen
            },
            setup() {
                return { state };
            }
        });

        app.mount('#app');
    </script>
</body>
</html>
