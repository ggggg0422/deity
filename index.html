                    const win = Helpers.checkWinCondition();
                    if (win) { gameState.pendingGameOver = win; triggerGameOver(); return; }

                    nightState.records.lastGuardTarget = nightState.records.guardTarget; nightState.records.lastDreamTarget = nightState.records.dreamTarget; nightState.records.lastAwbCharmTarget = nightState.records.awbCharmTarget; nightState.records.lastBearCharmTarget = nightState.records.bearCharmTarget; nightState.records.lastNightmareTarget = nightState.records.nightmareTarget;
                    
                    gameState.bloodMoonSealed = false; // 解除血月封印
                    gameState.isNight = false; morningState.step = STEPS.MORNING_REVEAL; morningState.voteTarget = 0; morningState.explodeTarget = 0; morningState.knightDuelTarget = 0; morningState.isVotingDone = false; morningState.daytimeCharmDeaths = [];
                    morningState.shootQueue = resolution.gunQueue;
                    morningState.dayStartAliveIds = gameState.players.filter(p => p.alive).map(p => p.id);
                };

                const undoMorning = () => {
                    if (!nightEndBackup) return;
                    if (confirm('確定要退回到昨晚最後一個階段嗎？\n(這將撤銷今早包含開槍、殉情等所有傷亡結算)')) {
                        gameState.players.splice(0, gameState.players.length, ...JSON.parse(JSON.stringify(nightEndBackup.players)));
                        gameState.history.splice(0, gameState.history.length, ...nightEndBackup.history);
                        gameState.isNight = true; gameState.pendingGameOver = null;
                        gameState.bloodMoonSealed = nightEndBackup.bloodMoonSealed;
                        gameState.bloodMoonLastStand = nightEndBackup.bloodMoonLastStand;
                        gameState.idiotRevealed = nightEndBackup.idiotRevealed;
                        
                        Object.assign(nightState.potions, JSON.parse(JSON.stringify(nightEndBackup.potions))); 
                        Object.assign(nightState.mechWolfState, JSON.parse(JSON.stringify(nightEndBackup.mechWolfState))); 
                        Object.assign(nightState.records, JSON.parse(JSON.stringify(nightEndBackup.records))); 
                        Object.assign(nightState.giftedState, JSON.parse(JSON.stringify(nightEndBackup.giftedState)));

                        nightState.currentPhaseIndex = nightEndBackup.currentPhaseIndex; nightState.awbUsed = nightEndBackup.awbUsed; nightState.ekUsed = nightEndBackup.ekUsed; nightState.scentPhantomUsed = nightEndBackup.scentPhantomUsed;
                        morningState.shootQueue = []; morningState.currentShooter = null; morningState.ahDirection = null; morningState.shootTarget = 0; morningState.resultHtml = ''; morningState.daytimeCharmDeaths = [];
                    }
                };

                const saveVoteBackup = () => { votePhaseBackup = { players: JSON.parse(JSON.stringify(gameState.players)), history: [...gameState.history], awbUsed: nightState.awbUsed, knightUsed: nightState.knightUsed, ekUsed: nightState.ekUsed, scentPhantomUsed: nightState.scentPhantomUsed, records: JSON.parse(JSON.stringify(nightState.records)), potions: JSON.parse(JSON.stringify(nightState.potions)), mechWolfState: JSON.parse(JSON.stringify(nightState.mechWolfState)), giftedState: JSON.parse(JSON.stringify(nightState.giftedState)), lastExiledRole: gameState.lastExiledRole, bloodMoonSealed: gameState.bloodMoonSealed, bloodMoonLastStand: gameState.bloodMoonLastStand, idiotRevealed: gameState.idiotRevealed }; };

                const startNextNight = () => {
                    const dayEndAliveIds = gameState.players.filter(p => p.alive).map(p => p.id);
                    const dayDiedIds = morningState.dayStartAliveIds.filter(id => !dayEndAliveIds.includes(id));
                    if (dayDiedIds.length === 0) Helpers.addHistory(`🌇 白天結算：無人死亡`);
                    else Helpers.addHistory(`🌇 白天結算：${dayDiedIds.sort((a,b)=>a-b).map(id => Helpers.formatPlayerText(id)).join('、')} 死亡`);

                    gameState.day++; gameState.isNight = true; nightState.currentPhaseIndex = 0;
                    
                    const activePhases = Object.values(RoleStrategies).filter(r => {
                        if (r.id === 'dittoWolfKing') return setupState.isDittoWolfKingMode && gameState.day > 1;
                        if (r.id === 'wolf') return true; 
                        if (r.id === 'wolfBrotherPhase') return setupState.activeRoles.wolfBrothers && gameState.day === 1;
                        if (r.id === 'wolfYoungerBrotherPhase') return setupState.activeRoles.wolfBrothers && gameState.day > 1 && Helpers.isDead('wolfBrother') && !nightState.wolfBrotherRevengeUsed && !Helpers.isDead('wolfYoungerBrother');
                        if (r.id === 'giftedPhase') return nightState.giftedState.hasGift && !nightState.giftedState.isUsed && [ITEMS.VERIFY, ITEMS.POISON].includes(nightState.giftedState.item) && Helpers.getPlayer(nightState.giftedState.id)?.alive;
                        
                        // 處理首夜最後確定的三階段
                        if (r.id === 'scentPhantomResult') return setupState.activeRoles.scentPhantom && gameState.day === 1;
                        if (r.id === 'gargoyleResult') return setupState.activeRoles.gargoyle && gameState.day === 1;
                        if (r.id === 'mechWolfResult') return setupState.activeRoles.mechWolf && gameState.day === 1;
                        if (r.id === 'blackMerchantReceive') return setupState.activeRoles.blackMerchant && gameState.day === 1;

                        if (r.executeOrder <= 0) return false; return r.selectable && setupState.activeRoles[r.id];
                    });
                    activePhases.sort((a, b) => a.executeOrder - b.executeOrder);
                    nightState.phaseQueue = activePhases.map(r => r.id);
                    nightState.records = { ...nightState.records, wolfKill: 0, witchAction: ACTIONS.NONE, witchPoison: 0, seerTarget: 0, awakenedSeerTargets: [], guardTarget: 0, nightmareTarget: 0, gargoyleTarget: 0, shadowTarget: 0, charmTarget: 0, awbCharmTarget: 0, bearCharmTarget: 0, magicianSwaps: [], blackMerchantTarget: 0, blackMerchantItem: '', giftedActionTarget: 0, dreamTarget: 0, demonHunterTarget: 0, mediumTarget: 0, wolfBrotherRevengeTarget: 0, mechWolfActionTarget: 0, mechWolfLearnTarget: 0, scentPhantomTargets: [] };
                    Helpers.addHistory(`<br><span style="color:#fff; font-weight:bold;">=== 第${gameState.day}天 夜晚 ===</span>`);
                };

                const triggerGameOver = () => {
                    if (!gameState.isNight) {
                        const dayEndAliveIds = gameState.players.filter(p => p.alive).map(p => p.id);
                        const dayDiedIds = morningState.dayStartAliveIds.filter(id => !dayEndAliveIds.includes(id));
                        if (dayDiedIds.length === 0) Helpers.addHistory(`🌇 白天結算：無人死亡`);
                        else Helpers.addHistory(`🌇 白天結算：${dayDiedIds.sort((a,b)=>a-b).map(id => Helpers.formatPlayerText(id)).join('、')} 死亡`);
                    }
                    Helpers.addHistory(`<br><span style="color:#fff; font-weight:bold;">=== 遊戲結束 ===</span>`);
                    Helpers.addHistory(`🏁 ${gameState.pendingGameOver.faction} <span style="font-size:14px; color:#aaa;">${gameState.pendingGameOver.reason || ''}</span>`);
                    gameState.screen = SCREENS.GAMEOVER;
                };

                return { setupState, gameState, nightState, morningState, currentPhaseComponent, nextPhase, prevPhase, undoMorning, saveVoteBackup, startNextNight, triggerGameOver };
            }
        };

const GameOverScreen = {
            template: `
                <div class="game-over-panel">
                    <div class="game-over-title">遊戲結束</div>
                    <h2 style="border:none;" v-html="gameState.pendingGameOver.faction"></h2>
                    
                    <div class="log-box" id="capture-log-box">
                        <div v-for="(log, idx) in gameState.history" :key="idx" style="margin-bottom: 4px;" v-html="log"></div>
                    </div>
                    
                    <div style="display: flex; gap: 15px; justify-content: center; margin-top: 20px;">
                        <button @click="captureLog" style="background-color: var(--btn-success);" :disabled="isCapturing">
                            {{ isCapturing ? '📸 處理中...' : '📸 截圖戰報' }}
                        </button>
                        <button @click="reload" style="background-color: var(--btn-primary);">重新開始</button>
                    </div>
                </div>
            `,
            setup() {
                const { ref } = Vue;
                const isCapturing = ref(false);

                const fallbackDownload = (blob, fileName) => {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = fileName;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                };

                const captureLog = async () => {
                    if (isCapturing.value) return;
                    
                    const target = document.getElementById('capture-log-box');
                    if (!target) return;
                    
                    isCapturing.value = true;
                    const originalMaxHeight = target.style.maxHeight;
                    const originalOverflow = target.style.overflowY;
                    
                    // 展開容器以顯示完整內容
                    target.style.maxHeight = 'none';
                    target.style.overflowY = 'visible';

                    // 關鍵修正：給予行動版瀏覽器足夠的時間進行 DOM 重繪
                    await new Promise(resolve => setTimeout(resolve, 200));

                    try {
                        // 動態調整縮放，防止 iOS Safari Canvas 記憶體限制導致全黑或崩潰
                        const dpr = window.devicePixelRatio || 1;
                        const scaleValue = dpr >= 2 ? 1.5 : 2;

                        const canvas = await html2canvas(target, {
                            backgroundColor: '#111', 
                            scale: scaleValue,
                            useCORS: true,
                            logging: false,
                            height: target.scrollHeight,
                            windowHeight: target.scrollHeight
                        });
                        
                        const fileName = `狼人殺戰報_第${gameState.day}天.png`;
                        
                        // 使用 Blob 替代 Base64 處理大檔案傳輸
                        canvas.toBlob(async (blob) => {
                            if (!blob) throw new Error("Canvas 轉換 Blob 失敗");

                            const file = new File([blob], fileName, { type: 'image/png' });

                            // 優先呼叫行動端原生分享/儲存介面
                            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                                try {
                                    await navigator.share({
                                        files: [file],
                                        title: '狼人殺戰報',
                                        text: `第 ${gameState.day} 天遊戲戰報`
                                    });
                                } catch (shareErr) {
                                    // 捕捉使用者取消分享或異常，降級為直接下載
                                    if (shareErr.name !== 'AbortError') {
                                        fallbackDownload(blob, fileName);
                                    }
                                }
                            } else {
                                // 桌機端或不支援 Share API 之環境
                                fallbackDownload(blob, fileName);
                            }
                        }, 'image/png');

                    } catch (error) {
                        console.error("截圖發生例外狀況: ", error);
                        alert("戰報截圖失敗，請確保裝置記憶體充足。");
                    } finally {
                        // 復原 DOM 原始狀態
                        target.style.maxHeight = originalMaxHeight;
                        target.style.overflowY = originalOverflow;
                        isCapturing.value = false;
                    }
                };

                return { 
                    gameState, 
                    captureLog,
                    isCapturing,
                    reload: () => window.location.reload() 
                }; 
            }
        };
            const app = createApp({ 
            components: { 'setup-screen': SetupScreen, 'game-screen': GameScreen, 'game-over-screen': GameOverScreen }, 
            setup() { return { gameState, SCREENS }; } 
        });

        // 綁定全域常數
        app.config.globalProperties.ROLES = ROLES;
        app.config.globalProperties.FACTIONS = FACTIONS;
        app.config.globalProperties.CAUSES = CAUSES;
        app.config.globalProperties.ACTIONS = ACTIONS;
        app.config.globalProperties.CLASSES = CLASSES;
        app.config.globalProperties.SCREENS = SCREENS;
        app.config.globalProperties.STEPS = STEPS;
        app.config.globalProperties.ITEMS = ITEMS;
        
        app.mount('#app');
    </script>
</body>
</html>
