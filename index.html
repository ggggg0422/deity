<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狼人殺上帝專用小幫手</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
/* =========================================
            共用及版面樣式
        ========================================= */
        :root {
            --bg-main: #1e1e1e; --text-main: #f0f0f0; --panel-bg: #2a2a2a; --border-color: #444;
            --color-wolf: #ff4d4d; --color-god: #c879ff; --color-villager: #ffcc00; --color-good: #4da6ff; --color-unknown: #888;
            --btn-primary: #2196F3; --btn-success: #4CAF50; --btn-danger: #ff4d4d; --btn-secondary: #555;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-main); color: var(--text-main); padding: 15px; max-width: 600px; margin: 0 auto; line-height: 1.5; text-align: center; }
        h2, h3, p { text-align: center; margin-top: 10px; margin-bottom: 10px; }
        h2 { border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-top: 5px; }
        .action-row { margin: 0 auto 15px auto; background: var(--panel-bg); padding: 18px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-align: center; }
        button { padding: 12px 16px; font-size: 16px; border-radius: 6px; border: none; outline: none; background-color: var(--btn-success); color: white; cursor: pointer; font-weight: bold; transition: all 0.2s ease; user-select: none; }
        button:active { transform: scale(0.95); filter: brightness(0.7); }
        button:disabled { opacity: 0.5; pointer-events: none; filter: grayscale(100%); }
        .nav-buttons { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
        .nav-buttons button { flex: 1; }
        .btn-prev { background-color: var(--btn-secondary); }
        
        .color-wolf { color: var(--color-wolf); font-weight: bold; }
        .color-god { color: var(--color-god); font-weight: bold; }
        .color-villager { color: var(--color-villager); font-weight: bold; }
        .color-good { color: var(--color-good); font-weight: bold; }
        .color-unknown { color: var(--color-unknown); }
        .status-badge { background: #333; padding: 6px 10px; border-radius: 6px; border: 1px solid #555; display: inline-block; white-space: nowrap; font-size: 14px; margin: 0 auto; transition: all 0.3s; }
        .dead { text-decoration: line-through; opacity: 0.5; background-color: #1a1a1a !important; color: #666 !important; border-color: #333 !important; }
        
        .player-count-grid { display: flex; justify-content: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
        .player-count-btn { padding: 12px 18px; border: 2px solid var(--border-color); border-radius: 8px; background: #333; color: #ccc; cursor: pointer; font-weight: bold; }
        .player-count-btn.selected { border-color: var(--color-good); background: rgba(77, 166, 255, 0.15); color: white; }
        .role-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .role-card { flex: 0 0 calc(50% - 5px); box-sizing: border-box; padding: 12px 4px; border: 2px solid var(--border-color); border-radius: 8px; text-align: center; cursor: pointer; background: #333; color: #ccc; white-space: nowrap; font-size: 15px; }
        .role-card.god.selected { border-color: var(--color-god); background: rgba(200, 121, 255, 0.15); color: white; font-weight: bold; }
        .role-card.wolf.selected { border-color: var(--color-wolf); background: rgba(255, 77, 77, 0.15); color: white; font-weight: bold; }
        .role-card.villager.selected { border-color: var(--color-villager); background: rgba(255, 204, 0, 0.15); color: white; font-weight: bold; }
        select { font-size: 16px; padding: 6px; border-radius: 4px; width: max-content; margin: 0 auto; display: inline-block; text-align: center; text-align-last: center; }
        select option { text-align: center; }
        
        .player-grid-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 10px auto; }
        .player-grid-btn { flex: 0 0 calc(33.33% - 8px); box-sizing: border-box; padding: 12px 6px; border: 2px solid var(--border-color); border-radius: 8px; text-align: center; cursor: pointer; background: #333; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .player-grid-btn.selected { border-color: var(--btn-primary); background: rgba(33, 150, 243, 0.2); color: white; }
        .player-grid-btn.danger-selected { border-color: var(--btn-danger); background: rgba(255, 77, 77, 0.2); color: white; }
        .player-grid-btn.disabled { opacity: 0.3; pointer-events: none; filter: grayscale(100%); }
        .player-grid-btn.zero-btn { flex: 1 1 100%; flex-direction: row; padding: 12px; color: #ccc; font-weight: bold; }
        .player-grid-btn .num { font-size: 20px; font-weight: bold; line-height: 1.2; }
        
        .witch-action-btn { cursor: pointer; background: #2a2a2a; padding: 12px; border-radius: 8px; width: 90%; border: 2px solid #555; text-align: center; margin: 0 auto; color: #ccc; font-weight: bold; transition: all 0.2s ease; display: block; box-sizing: border-box; }
        .witch-action-btn.active-heal { background: rgba(76, 175, 80, 0.2); border-color: var(--btn-success); color: white; box-shadow: 0 0 12px rgba(76, 175, 80, 0.6); }
        .witch-action-btn.active-poison { background: rgba(255, 77, 77, 0.2); border-color: var(--btn-danger); color: white; box-shadow: 0 0 12px rgba(255, 77, 77, 0.6); }
        .witch-action-btn.active-none { background: #444; border-color: #aaa; color: white; box-shadow: 0 0 10px rgba(170, 170, 170, 0.5); }
        .witch-action-btn.disabled { opacity: 0.4; pointer-events: none; filter: grayscale(100%); }
        .witch-alert-active { background: #442222; padding: 12px 24px; border-radius: 6px; border: 1px solid var(--btn-danger); margin: 0 auto 10px auto; width: fit-content; font-weight: bold;}
        .result-box { background: #333; padding: 12px 24px; margin: 10px auto; border-radius: 4px; text-align: center; width: fit-content; }
        .game-over-panel { background: #111; border: 2px solid #333; padding: 30px 20px; border-radius: 12px; margin-top: 20px; }
        .game-over-title { font-size: 28px; color: white; margin-bottom: 15px; font-weight: bold; }
        .log-box { background: #111; padding: 15px; border-radius: 8px; text-align: left; font-size: 15px; line-height: 1.8; color: #ddd; max-height: 350px; overflow-y: auto; border: 1px solid #444; margin-top: 15px;}
    </style>
</head>
<body>
    <div id="app">
        <setup-screen v-if="gameState.screen === SCREENS.SETUP"></setup-screen>
        <game-screen v-else-if="gameState.screen === SCREENS.GAME"></game-screen>
        <game-over-screen v-else-if="gameState.screen === SCREENS.GAMEOVER"></game-over-screen>
    </div>

    <template id="game-template">
        <div>
            <div style="margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
                <h2 style="margin: 0; border: none; padding: 0;">第 {{ gameState.day }} 天 {{ gameState.isNight ? '夜晚' : '白天' }}</h2>
            </div>
            
            <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom: 20px;">
                <span v-for="p in gameState.players" :key="p.id" :class="['status-badge', p.class, { dead: !p.alive }]">
                    [{{ p.id }}號] {{ p.role }}
                    <span v-if="p.isDitto" style="color: #ff9800; margin-left: 2px;">(百變)</span>
                </span>
            </div>
            
            <component v-if="gameState.isNight" :is="currentPhaseComponent" @next="nextPhase" @prev="prevPhase"></component>
            <morning-phase v-else @start-night="startNextNight" @game-over="triggerGameOver" @prev-to-night="undoMorning" @save-vote-backup="saveVoteBackup"></morning-phase>
        </div>
    </template>

    <script>
        const { createApp, reactive, computed, defineComponent, watch, onMounted } = Vue;

        // =========================================
        // 核心字典 (Constants)
        // =========================================
        const ROLES = {
            VILLAGER: '平民', WOLF: '狼人', WITCH: '女巫', SEER: '預言家', HUNTER: '獵人',
            AWAKENED_HUNTER: '覺醒獵人', GUARD: '守衛', DREAMER: '攝夢人', KNIGHT: '騎士',
            GRAVEKEEPER: '守墓人', DEMON_HUNTER: '獵魔人', BEAR: '熊', MAGICIAN: '魔術師',
            BLACK_MERCHANT: '黑市商人', MEDIUM: '通靈師', IDIOT: '白癡', NIGHTMARE: '夢魘', BLACK_WOLF: '黑狼王',
            WOLF_BEAUTY: '狼美人', AWAKENED_WOLF_BEAUTY: '覺醒狼美人', EVIL_KNIGHT: '惡靈騎士',
            GARGOYLE: '石像鬼', MECH_WOLF: '機械狼', WOLF_BROTHER: '狼兄', WOLF_YOUNGER: '狼弟',
            SHADOW: '燈影', BLOOD_MOON: '血月使徒', UNKNOWN: '未知', DITTO_WOLF_KING: '百變狼王',
            SCENT_PHANTOM: '尋香魅影', AWAKENED_SEER: '覺醒預言家', DEMON_EMPEROR: '帝尊魔皇', SAGE: '九天聖人'
        };

        const FACTIONS = { WOLF: 'wolf', GOD: 'god', VILLAGER: 'villager' };

        const CAUSES = {
            WOLF: 'wolf', POISON: 'poison', DREAM_DEATH: 'dream_death', WOLF_BROTHER_REVENGE: 'wolf_brother_revenge',
            MECH_WOLF_KILL: 'mech_wolf_kill', MECH_DEMON_HUNT_SUCCESS: 'mech_demon_hunt_success',
            MECH_DEMON_HUNT_FAIL: 'mech_demon_hunt_fail', DEMON_HUNT_SUCCESS: 'demon_hunt_success',
            DEMON_HUNT_FAIL: 'demon_hunt_fail', VOTE: 'vote', EXPLODE: 'explode', DUEL_WOLF: 'duel_wolf',
            DUEL_KNIGHT: 'duel_knight', CHARM: 'charm', AWB_SUB: 'awb_sub', SHOT: 'shot',
            AH_SHOT: 'ah_shot', AH_SHOT_DAY: 'ah_shot_day', DREAM_LINK: 'dream_link', BLACK_MERCHANT_BACKLASH: 'bm_backlash',
            EK_REFLECTION: 'ek_reflection', SCENT_LINK: 'scent_link', YIN_YANG_DEATH: 'yin_yang_death'
        };

        const ACTIONS = { HEAL: 'heal', POISON: 'poison', NONE: 'none' };
        const CLASSES = { WOLF: 'color-wolf', GOD: 'color-god', VILLAGER: 'color-villager', UNKNOWN: 'color-unknown', GOOD: 'color-good' };
        const SCREENS = { SETUP: 'setup', GAME: 'game', GAMEOVER: 'gameover' };
        const STEPS = {
            MORNING_REVEAL: 'morning_reveal', CHARM_REVEAL: 'charm_reveal', AH_SHOOT: 'ah_shoot',
            SHOOT: 'shoot', VOTE: 'vote', SHOOT_REVEAL: 'shoot_reveal', KNIGHT_REVEAL: 'knight_reveal'
        };
        const ITEMS = { VERIFY: 'verify', POISON: 'poison', GUN: 'gun' };

        // =========================================
        // 狀態管理 (State)
        // =========================================
        const setupState = reactive({
            playerCount: 12, isDittoWolfKingMode: false, dittoWolfKingRole: null,
            activeRoles: { 
                magician: false, blackMerchant: false, guard: false, dreamer: false, witch: true, 
                demonHunter: false, hunter: true, awakenedHunter: false, bear: false, knight: false, 
                gravekeeper: false, seer: true, awakenedSeer: false, medium: false, idiot: false,
                nightmare: false, blackWolf: false, wolfBeauty: false, awakenedWolfBeauty: false, 
                evilKnight: false, gargoyle: false, mechWolf: false, wolfBrothers: false, shadow: false, bloodMoon: false, scentPhantom: false,
                demonEmperor: false, sage: false
            },
            initialRoleSetup: { 
                magician: 0, blackMerchant: 0, guard: 0, dreamer: 0, witch: 0, demonHunter: 0, 
                hunter: 0, awakenedHunter: 0, bear: 0, knight: 0, gravekeeper: 0, seer: 0, awakenedSeer: 0, medium: 0, idiot: 0,
                nightmare: 0, blackWolf: 0, wolfBeauty: 0, awakenedWolfBeauty: 0, evilKnight: 0, 
                gargoyle: 0, mechWolf: 0, wolfBrother: 0, wolfYoungerBrother: 0, shadow: 0, bloodMoon: 0, scentPhantom: 0, 
                demonEmperor: 0, sage: 0, wolves: [] 
            }
        });

        const gameState = reactive({ 
            screen: SCREENS.SETUP, day: 1, isNight: true, players: [], history: [], pendingGameOver: null, lastExiledRole: null,
            bloodMoonSealed: false, bloodMoonLastStand: false, idiotRevealed: false, scentPhantomRandomWolf: 0,
            activeYangIds: [], activeYinIds: []
        });

        const nightState = reactive({
            currentPhaseIndex: 0, phaseQueue: [],
            records: { 
                magicianSwaps: [], blackMerchantTarget: 0, blackMerchantItem: '', giftedActionTarget: 0, dreamTarget: 0, lastDreamTarget: 0, demonHunterTarget: 0,
                wolfKill: 0, witchAction: ACTIONS.NONE, witchPoison: 0, seerTarget: 0, awakenedSeerTargets: [], guardTarget: 0, lastGuardTarget: 0, nightmareTarget: 0, lastNightmareTarget: 0, gargoyleTarget: 0, 
                shadowTarget: 0, mediumTarget: 0, charmTarget: 0, awbCharmTarget: 0, lastAwbCharmTarget: 0, bearCharmTarget: 0, wolfBrotherRevengeTarget: 0, mechWolfLearnTarget: 0, mechWolfActionTarget: 0, scentPhantomTargets: [],
                demonEmperorTarget: 0, demonEmperorSkill: '', lastDemonEmperorSkill: '', sageTarget: 0, sageSkill: '', lastSageSkill: ''
            },
            potions: { heal: true, poison: true },
            mechWolfState: { hasLearned: false, learnedRole: null, poisonUsed: false, shieldBroken: false, wolfKillUsed: false },
            awbUsed: false, knightUsed: false, ekUsed: false, wolfBrotherRevengeUsed: false, scentPhantomUsed: false,
            giftedState: { hasGift: false, id: 0, item: '', isUsed: false }
        });

        const morningState = reactive({ 
            step: STEPS.MORNING_REVEAL, daytimeCharmDeaths: [], deaths: [], voteTarget: 0, resultHtml: '', 
            explodeTarget: 0, knightDuelTarget: 0, knightDuelInfo: null, shootQueue: [], 
            currentShooter: null, ahDirection: null, lastShotTarget: 0, lastShooterRole: '', 
            isVotingDone: false, dayStartAliveIds: [] 
        });

        // =========================================
        // 工具函式 (Helpers)
        // =========================================
        const Helpers = {
            addHistory: (msg) => gameState.history.push(msg),
            getPlayer: (id) => gameState.players.find(p => p.id === id),
            isWolf: (id, context = '') => {
                const p = Helpers.getPlayer(id);
                if (!p) return false;
                if (p.isDitto) return true;
                if (context === 'check' && p.role === ROLES.WOLF_YOUNGER && !Helpers.isDead('wolfBrother')) return false;
                return [ROLES.WOLF, ROLES.BLACK_WOLF, ROLES.WOLF_BEAUTY, ROLES.AWAKENED_WOLF_BEAUTY, ROLES.EVIL_KNIGHT, ROLES.NIGHTMARE, ROLES.GARGOYLE, ROLES.MECH_WOLF, ROLES.WOLF_BROTHER, ROLES.WOLF_YOUNGER, ROLES.BLOOD_MOON, ROLES.SCENT_PHANTOM, ROLES.DEMON_EMPEROR].includes(p.role);
            },
            isDead: (roleKey) => {
                const id = setupState.initialRoleSetup[roleKey];
                const p = Helpers.getPlayer(id);
                return p && !p.alive;
            },
            getActualTarget: (id) => {
                if (id === 0) return 0;
                const swaps = nightState.records.magicianSwaps;
                if (swaps.length === 2) {
                    if (swaps[0] === id) return swaps[1];
                    if (swaps[1] === id) return swaps[0];
                }
                return id;
            },
            checkFeared: (roleArray) => {
                if (gameState.bloodMoonSealed) {
                    const godRoles = [ROLES.MAGICIAN, ROLES.BLACK_MERCHANT, ROLES.WITCH, ROLES.SEER, ROLES.AWAKENED_SEER, ROLES.HUNTER, ROLES.AWAKENED_HUNTER, ROLES.GUARD, ROLES.KNIGHT, ROLES.DREAMER, ROLES.DEMON_HUNTER, ROLES.BEAR, ROLES.GRAVEKEEPER, ROLES.MEDIUM, ROLES.IDIOT, ROLES.SAGE];
                    if (roleArray.some(r => godRoles.includes(r))) return true;
                }
                if (nightState.records.nightmareTarget === 0) return false;
                const targetId = Helpers.getActualTarget(nightState.records.nightmareTarget);
                let targetP = Helpers.getPlayer(targetId);
                if (!targetP) return false;
                if (targetP.isDitto && roleArray.includes(ROLES.WOLF)) return true;
                return roleArray.includes(targetP.role);
            },
            isPlayerTaken: (id, currentRoleKey, wolfIndex = null) => {
                const s = setupState.initialRoleSetup;
                for (const key in s) {
                    if (key === 'wolves') {
                        if (currentRoleKey !== 'wolf' && id !== 0 && s.wolves.includes(id)) return true;
                        if (currentRoleKey === 'wolf' && id !== 0 && s.wolves.some((wId, idx) => wId === id && idx !== wolfIndex)) return true;
                    } else {
                        if (currentRoleKey !== key && s[key] === id && id !== 0) return true;
                    }
                }
                return false;
            },
            getRoleColorClass: (roleName) => {
                if ([ROLES.WOLF, ROLES.BLACK_WOLF, ROLES.WOLF_BEAUTY, ROLES.AWAKENED_WOLF_BEAUTY, ROLES.EVIL_KNIGHT, ROLES.NIGHTMARE, ROLES.GARGOYLE, ROLES.MECH_WOLF, ROLES.WOLF_BROTHER, ROLES.WOLF_YOUNGER, ROLES.BLOOD_MOON, ROLES.SCENT_PHANTOM, ROLES.DEMON_EMPEROR].includes(roleName)) return CLASSES.WOLF;
                if ([ROLES.VILLAGER, ROLES.SHADOW].includes(roleName)) return CLASSES.VILLAGER;
                if (roleName === ROLES.UNKNOWN) return CLASSES.UNKNOWN;
                return CLASSES.GOD;
            },
            getMediumCheckResult: (id) => {
                if (!id || id === 0) return ROLES.UNKNOWN;
                if (setupState.isDittoWolfKingMode && setupState.dittoWolfKingRole && id === setupState.initialRoleSetup[setupState.dittoWolfKingRole]) return ROLES.DITTO_WOLF_KING;
                const mechWolfId = setupState.initialRoleSetup.mechWolf;
                if (mechWolfId !== 0 && id === mechWolfId) {
                    if (nightState.mechWolfState.hasLearned) return nightState.mechWolfState.learnedRole;
                    else if (nightState.records.mechWolfLearnTarget !== 0) {
                        const targetId = Helpers.getActualTarget(nightState.records.mechWolfLearnTarget);
                        if (targetId === mechWolfId) return ROLES.MECH_WOLF;
                        return Helpers.getMediumCheckResult(targetId);
                    }
                    return ROLES.MECH_WOLF;
                }
                const p = Helpers.getPlayer(id);
                if (!p) return ROLES.UNKNOWN;
                if (p.role === ROLES.WOLF_YOUNGER && !Helpers.isDead('wolfBrother')) return ROLES.VILLAGER;
                return p.role;
            },
            formatPlayerText: (id) => {
                if (!id || id === 0) return '';
                const p = Helpers.getPlayer(id);
                if (!p) return `${id}號(未知)`;
                const dittoText = p.isDitto ? ` <span style="color:#ff9800;font-size:12px;">(${ROLES.DITTO_WOLF_KING})</span>` : '';
                return `<span class="${p.class}" style="font-weight:bold;">${id}號(${p.role})</span>${dittoText}`;
            },
            syncRoles: () => {
                if (gameState.day !== 1) return;
                gameState.players.forEach(p => { p.role = ROLES.VILLAGER; p.class = CLASSES.VILLAGER; p.isDitto = false; });
                const assign = (id, roleName, className) => {
                    if (!id || id === 0) return;
                    const p = gameState.players.find(x => x.id === id);
                    if (p) { p.role = roleName; p.class = className; }
                };
                const s = setupState.initialRoleSetup;
                assign(s.magician, ROLES.MAGICIAN, CLASSES.GOD); assign(s.blackMerchant, ROLES.BLACK_MERCHANT, CLASSES.GOD); assign(s.guard, ROLES.GUARD, CLASSES.GOD);
                assign(s.dreamer, ROLES.DREAMER, CLASSES.GOD); assign(s.witch, ROLES.WITCH, CLASSES.GOD); assign(s.demonHunter, ROLES.DEMON_HUNTER, CLASSES.GOD);
                assign(s.hunter, ROLES.HUNTER, CLASSES.GOD); assign(s.awakenedHunter, ROLES.AWAKENED_HUNTER, CLASSES.GOD); assign(s.bear, ROLES.BEAR, CLASSES.GOD);
                assign(s.knight, ROLES.KNIGHT, CLASSES.GOD); assign(s.gravekeeper, ROLES.GRAVEKEEPER, CLASSES.GOD); assign(s.seer, ROLES.SEER, CLASSES.GOD);
                assign(s.awakenedSeer, ROLES.AWAKENED_SEER, CLASSES.GOD); assign(s.medium, ROLES.MEDIUM, CLASSES.GOD); assign(s.idiot, ROLES.IDIOT, CLASSES.GOD);
                assign(s.sage, ROLES.SAGE, CLASSES.GOD);
                assign(s.nightmare, ROLES.NIGHTMARE, CLASSES.WOLF); assign(s.gargoyle, ROLES.GARGOYLE, CLASSES.WOLF); assign(s.mechWolf, ROLES.MECH_WOLF, CLASSES.WOLF);
                assign(s.blackWolf, ROLES.BLACK_WOLF, CLASSES.WOLF); assign(s.wolfBeauty, ROLES.WOLF_BEAUTY, CLASSES.WOLF); assign(s.awakenedWolfBeauty, ROLES.AWAKENED_WOLF_BEAUTY, CLASSES.WOLF);
                assign(s.evilKnight, ROLES.EVIL_KNIGHT, CLASSES.WOLF); assign(s.wolfBrother, ROLES.WOLF_BROTHER, CLASSES.WOLF); assign(s.wolfYoungerBrother, ROLES.WOLF_YOUNGER, CLASSES.WOLF);
                assign(s.bloodMoon, ROLES.BLOOD_MOON, CLASSES.WOLF); assign(s.scentPhantom, ROLES.SCENT_PHANTOM, CLASSES.WOLF);
                assign(s.demonEmperor, ROLES.DEMON_EMPEROR, CLASSES.WOLF);
                s.wolves.forEach(id => assign(id, ROLES.WOLF, CLASSES.WOLF));
                assign(s.shadow, ROLES.SHADOW, CLASSES.VILLAGER);

                if (setupState.isDittoWolfKingMode && setupState.dittoWolfKingRole) {
                    const dittoId = s[setupState.dittoWolfKingRole];
                    const p = gameState.players.find(x => x.id === dittoId);
                    if (p) { p.class = CLASSES.WOLF; p.isDitto = true; }
                }
            },
            checkPendingWin: () => {
                if (gameState.day === 1) return null; 
                let intents = SettlementEngine.evaluateNightDeaths();
                let resolution = SettlementEngine.resolveDeaths(intents, 'dryRun_night');
                const alive = gameState.players.filter(p => p.alive && !resolution.pendingDeadIds.has(p.id));
                return Helpers._evaluateWin(alive);
            },
            checkWinCondition: () => {
                const alive = gameState.players.filter(p => p.alive);
                return Helpers._evaluateWin(alive);
            },
            _evaluateWin: (alive) => {
                const wolves = alive.filter(p => Helpers.isWolf(p.id)).length;
                const gods = alive.filter(p => !p.isDitto && [ROLES.MAGICIAN, ROLES.BLACK_MERCHANT, ROLES.WITCH, ROLES.SEER, ROLES.AWAKENED_SEER, ROLES.HUNTER, ROLES.AWAKENED_HUNTER, ROLES.GUARD, ROLES.KNIGHT, ROLES.DREAMER, ROLES.DEMON_HUNTER, ROLES.BEAR, ROLES.GRAVEKEEPER, ROLES.MEDIUM, ROLES.IDIOT, ROLES.SAGE].includes(p.role)).length;
                const villagers = alive.filter(p => !p.isDitto && [ROLES.VILLAGER, ROLES.SHADOW].includes(p.role)).length;
                
                if (gods === 0) return { faction: "<span style='color: var(--color-wolf); font-weight: bold;'>🐺 狼人陣營獲勝！</span>", reason: "(屠神)" };
                if (villagers === 0) return { faction: "<span style='color: var(--color-wolf); font-weight: bold;'>🐺 狼人陣營獲勝！</span>", reason: "(屠民)" };
                if (wolves === 0) return { faction: "<span style='color: var(--color-good); font-weight: bold;'>🎉 好人陣營獲勝！</span>" };
                
                return null;
            }
        };

        // =========================================
        // 🌟 結算引擎 (Settlement Engine Pipeline)
        // =========================================
        const SettlementEngine = {
            evaluateNightDeaths: () => {
                let intents = [];
                const getTarget = Helpers.getActualTarget;
                
                // --- 陰陽死亡判斷 (優先) ---
                let deT = getTarget(nightState.records.demonEmperorTarget);
                let sT = getTarget(nightState.records.sageTarget);
                let deS = nightState.records.demonEmperorSkill;
                let sS = nightState.records.sageSkill;
                
                let yangIds = [], yinIds = [];
                if (deT && deS === 'YANG') yangIds.push(deT);
                if (deT && deS === 'YIN') yinIds.push(deT);
                if (sT && sS === 'YANG') yangIds.push(sT);
                if (sT && sS === 'YIN') yinIds.push(sT);
                
                let allT = [...new Set([deT, sT].filter(id => id !== 0))];
                allT.forEach(t => {
                    let yC = yangIds.filter(id => id === t).length;
                    let iC = yinIds.filter(id => id === t).length;
                    if (yC === 2 || iC === 2) intents.push({ id: t, cause: CAUSES.YIN_YANG_DEATH });
                });
                
                const dreamTarget = getTarget(nightState.records.dreamTarget);
                
                let wKill = getTarget(nightState.records.wolfKill);
                if (wKill !== 0 && wKill !== dreamTarget) {
                    let isGuarded = (getTarget(nightState.records.guardTarget) === wKill) && !Helpers.checkFeared([ROLES.GUARD]);
                    let isHealed = (nightState.records.witchAction === ACTIONS.HEAL) && !Helpers.checkFeared([ROLES.WITCH]);
                    if ((isGuarded && isHealed) || (!isGuarded && !isHealed)) intents.push({ id: wKill, cause: CAUSES.WOLF });
                }
                
                let wPoison = nightState.records.witchAction === ACTIONS.POISON && !Helpers.checkFeared([ROLES.WITCH]) ? getTarget(nightState.records.witchPoison) : 0;
                if (wPoison !== 0 && wPoison !== dreamTarget) intents.push({ id: wPoison, cause: CAUSES.POISON });
                
                if (dreamTarget !== 0 && dreamTarget === getTarget(nightState.records.lastDreamTarget)) intents.push({ id: dreamTarget, cause: CAUSES.DREAM_DEATH });
                
                let wBrotherRev = getTarget(nightState.records.wolfBrotherRevengeTarget);
                if (wBrotherRev !== 0 && !Helpers.checkFeared([ROLES.WOLF_YOUNGER]) && wBrotherRev !== dreamTarget) {
                    let isGuarded = (getTarget(nightState.records.guardTarget) === wBrotherRev) && !Helpers.checkFeared([ROLES.GUARD]);
                    if (!isGuarded) intents.push({ id: wBrotherRev, cause: CAUSES.WOLF_BROTHER_REVENGE });
                }
                
                if (setupState.activeRoles.mechWolf && nightState.mechWolfState.hasLearned && nightState.records.mechWolfActionTarget !== 0 && !Helpers.checkFeared([ROLES.MECH_WOLF])) {
                    let mTarget = getTarget(nightState.records.mechWolfActionTarget);
                    if (nightState.mechWolfState.learnedRole === ROLES.WOLF && mTarget !== dreamTarget) {
                        let isGuarded = (getTarget(nightState.records.guardTarget) === mTarget) && !Helpers.checkFeared([ROLES.GUARD]);
                        let isHealed = (nightState.records.witchAction === ACTIONS.HEAL && wKill === mTarget) && !Helpers.checkFeared([ROLES.WITCH]);
                        if (setupState.playerCount >= 11) isGuarded = false; 
                        if ((isGuarded && isHealed) || (!isGuarded && !isHealed)) intents.push({ id: mTarget, cause: CAUSES.MECH_WOLF_KILL });
                    } else if (nightState.mechWolfState.learnedRole === ROLES.WITCH && !nightState.mechWolfState.poisonUsed && mTarget !== dreamTarget) {
                        intents.push({ id: mTarget, cause: CAUSES.POISON });
                    } else if (nightState.mechWolfState.learnedRole === ROLES.DEMON_HUNTER) {
                        let target = getTarget(nightState.records.mechWolfActionTarget);
                        if (Helpers.isWolf(target)) intents.push({ id: target, cause: CAUSES.MECH_DEMON_HUNT_SUCCESS });
                        else intents.push({ id: setupState.initialRoleSetup.mechWolf, cause: CAUSES.MECH_DEMON_HUNT_FAIL });
                    }
                }
                
                if (gameState.day > 1 && setupState.activeRoles.demonHunter && nightState.records.demonHunterTarget !== 0 && !Helpers.checkFeared([ROLES.DEMON_HUNTER])) {
                    let dhId = setupState.initialRoleSetup.demonHunter;
                    let target = getTarget(nightState.records.demonHunterTarget);
                    if (Helpers.isWolf(target)) intents.push({ id: target, cause: CAUSES.DEMON_HUNT_SUCCESS });
                    else intents.push({ id: dhId, cause: CAUSES.DEMON_HUNT_FAIL });
                }

                let giftTarget = getTarget(nightState.records.giftedActionTarget);
                if (giftTarget !== 0 && nightState.giftedState.item === ITEMS.POISON && giftTarget !== dreamTarget) {
                    intents.push({ id: giftTarget, cause: CAUSES.POISON });
                }

                if (setupState.activeRoles.blackMerchant && nightState.records.blackMerchantTarget !== 0) {
                    let bmTarget = getTarget(nightState.records.blackMerchantTarget);
                    if (Helpers.isWolf(bmTarget)) {
                        intents.push({ id: setupState.initialRoleSetup.blackMerchant, cause: CAUSES.BLACK_MERCHANT_BACKLASH });
                    }
                }

                let ekId = setupState.initialRoleSetup.evilKnight;
                if (ekId !== 0 && !nightState.ekUsed) {
                    let witchPoisonTarget = nightState.records.witchAction === ACTIONS.POISON && !Helpers.checkFeared([ROLES.WITCH]) ? getTarget(nightState.records.witchPoison) : 0;
                    let seerCheckTarget = !Helpers.checkFeared([ROLES.SEER]) ? getTarget(nightState.records.seerTarget) : 0;
                    let awakenedSeerCheckTarget = !Helpers.checkFeared([ROLES.AWAKENED_SEER]) && nightState.records.awakenedSeerTargets.length === 2 && (Helpers.getActualTarget(nightState.records.awakenedSeerTargets[0]) === ekId || Helpers.getActualTarget(nightState.records.awakenedSeerTargets[1]) === ekId) ? ekId : 0;
                    
                    if (witchPoisonTarget === ekId) {
                        let witchId = setupState.initialRoleSetup.witch;
                        if (witchId) intents.push({ id: witchId, cause: CAUSES.EK_REFLECTION });
                    } else if (seerCheckTarget === ekId) {
                        let seerId = setupState.initialRoleSetup.seer;
                        if (seerId) intents.push({ id: seerId, cause: CAUSES.EK_REFLECTION });
                    } else if (awakenedSeerCheckTarget === ekId) {
                        let awakenedSeerId = setupState.initialRoleSetup.awakenedSeer;
                        if (awakenedSeerId) intents.push({ id: awakenedSeerId, cause: CAUSES.EK_REFLECTION });
                    }
                }

                return intents;
            },

            resolveDeaths: (initialDeathIntents, context) => {
                let pendingDeadIds = new Set();
                let finalEvents = [];
                let gunQueue = [];
                let charmLog = [];
                
                const triggerDeath = (id, cause, sourceId = null) => {
                    // 🌟 處理陰陽免疫庇護
                    if (cause !== CAUSES.YIN_YANG_DEATH) {
                        if (context.includes('night') && gameState.activeYinIds.includes(id)) return;
                        if (context.includes('day') && gameState.activeYangIds.includes(id)) return;
                    }

                    if (pendingDeadIds.has(id)) return;
                    const p = Helpers.getPlayer(id);
                    if (!p || !p.alive) return;

                    if (p.role === ROLES.EVIL_KNIGHT && context.includes('night')) {
                        return;
                    }

                    if (cause === CAUSES.EK_REFLECTION && !context.startsWith('dryRun')) {
                        nightState.ekUsed = true;
                    }

                    if (p.role === ROLES.AWAKENED_WOLF_BEAUTY && !nightState.awbUsed && nightState.records.awbCharmTarget !== 0 && ![CAUSES.DUEL_WOLF, CAUSES.AH_SHOT].includes(cause)) {
                        const charmId = nightState.records.awbCharmTarget;
                        const charmP = Helpers.getPlayer(charmId);
                        if (charmP && charmP.alive && !pendingDeadIds.has(charmId)) {
                            if (!context.startsWith('dryRun')) nightState.awbUsed = true;
                            if (context === 'day') charmLog.push({ sourceRole: ROLES.AWAKENED_WOLF_BEAUTY, source: p.id, target: charmId, type: CAUSES.AWB_SUB });
                            triggerDeath(charmId, CAUSES.AWB_SUB, id);
                            return; 
                        }
                    }

                    pendingDeadIds.add(id);
                    finalEvents.push({ id, cause, sourceId });

                    if (p.role === ROLES.WOLF_BEAUTY && nightState.records.charmTarget !== 0 && !Helpers.checkFeared([ROLES.WOLF_BEAUTY]) && ![CAUSES.DUEL_WOLF, CAUSES.AH_SHOT].includes(cause)) {
                        if (context === 'day') charmLog.push({ sourceRole: ROLES.WOLF_BEAUTY, source: p.id, target: nightState.records.charmTarget, type: CAUSES.CHARM });
                        triggerDeath(nightState.records.charmTarget, CAUSES.CHARM, p.id);
                    }
                    if (p.role === ROLES.BEAR && p.isDitto && nightState.records.bearCharmTarget !== 0 && !Helpers.checkFeared([ROLES.BEAR]) && cause !== CAUSES.DUEL_WOLF) {
                        if (context === 'day') charmLog.push({ sourceRole: `百變狼王(${ROLES.BEAR})`, source: p.id, target: nightState.records.bearCharmTarget, type: CAUSES.CHARM });
                        triggerDeath(nightState.records.bearCharmTarget, CAUSES.CHARM, p.id);
                    }
                    if (p.role === ROLES.DREAMER && nightState.records.dreamTarget !== 0 && context.includes('night')) {
                        triggerDeath(nightState.records.dreamTarget, CAUSES.DREAM_LINK, p.id);
                    }
                    
                    if (!nightState.scentPhantomUsed && nightState.records.scentPhantomTargets.length === 2) {
                        const [t1, t2] = nightState.records.scentPhantomTargets;
                        if (id === t1 && t2 !== 0 && !pendingDeadIds.has(t2) && Helpers.getPlayer(t2)?.alive) {
                            if (!context.startsWith('dryRun')) nightState.scentPhantomUsed = true;
                            if (context === 'day') charmLog.push({ sourceRole: ROLES.SCENT_PHANTOM, source: id, target: t2, type: CAUSES.SCENT_LINK });
                            triggerDeath(t2, CAUSES.SCENT_LINK, id);
                        } else if (id === t2 && t1 !== 0 && !pendingDeadIds.has(t1) && Helpers.getPlayer(t1)?.alive) {
                            if (!context.startsWith('dryRun')) nightState.scentPhantomUsed = true;
                            if (context === 'day') charmLog.push({ sourceRole: ROLES.SCENT_PHANTOM, source: id, target: t1, type: CAUSES.SCENT_LINK });
                            triggerDeath(t1, CAUSES.SCENT_LINK, id);
                        }
                    }

                    let sealed = false;
                    let isHunterType = p.role === ROLES.HUNTER || (nightState.giftedState.hasGift && !nightState.giftedState.isUsed && nightState.giftedState.id === p.id && nightState.giftedState.item === ITEMS.GUN);
                    
                    const isFearedByNightmare = context.includes('night') && nightState.records.nightmareTarget !== 0 && Helpers.getActualTarget(nightState.records.nightmareTarget) === p.id;
                    const isSealedByBloodMoon = context.includes('night') && gameState.bloodMoonSealed;

                    if (isHunterType) {
                        sealed = [CAUSES.POISON, CAUSES.CHARM, CAUSES.AWB_SUB, CAUSES.DREAM_DEATH, CAUSES.DREAM_LINK, CAUSES.SCENT_LINK, CAUSES.YIN_YANG_DEATH].includes(cause) || isFearedByNightmare || isSealedByBloodMoon;
                    } else if (p.role === ROLES.BLACK_WOLF || (p.role === ROLES.MECH_WOLF && nightState.mechWolfState.learnedRole === ROLES.HUNTER)) {
                        sealed = [CAUSES.POISON, CAUSES.CHARM, CAUSES.AWB_SUB, CAUSES.AH_SHOT, CAUSES.EXPLODE, CAUSES.DREAM_DEATH, CAUSES.DREAM_LINK, CAUSES.DUEL_WOLF, CAUSES.SCENT_LINK, CAUSES.YIN_YANG_DEATH].includes(cause) || isFearedByNightmare;
                    }
                    if (!sealed) {
                        if (p.role === ROLES.HUNTER) gunQueue.push({ id: p.id, role: ROLES.HUNTER, cause: cause });
                        else if (p.role === ROLES.BLACK_WOLF) gunQueue.push({ id: p.id, role: ROLES.BLACK_WOLF, cause: cause });
                        else if (p.role === ROLES.AWAKENED_HUNTER) gunQueue.push({ id: p.id, role: ROLES.AWAKENED_HUNTER, cause: cause });
                        else if (p.role === ROLES.MECH_WOLF && nightState.mechWolfState.learnedRole === ROLES.HUNTER) gunQueue.push({ id: p.id, role: ROLES.MECH_WOLF, cause: cause });
                        else if (nightState.giftedState.hasGift && !nightState.giftedState.isUsed && nightState.giftedState.item === ITEMS.GUN && nightState.giftedState.id === p.id) {
                            gunQueue.push({ id: p.id, role: `幸運兒(${p.role})`, cause: cause });
                            if(!context.startsWith('dryRun')) nightState.giftedState.isUsed = true;
                        }
                    }
                };

                initialDeathIntents.forEach(intent => triggerDeath(intent.id, intent.cause));
                return { finalEvents, gunQueue, charmLog, pendingDeadIds };
            },

            applyDeaths: (resolution) => {
                resolution.finalEvents.forEach(ev => {
                    const p = Helpers.getPlayer(ev.id);
                    if (p) p.alive = false;

                    if (ev.cause === CAUSES.AWB_SUB) {
                        Helpers.addHistory(`✨ ${Helpers.formatPlayerText(ev.sourceId)} 觸發替死，${Helpers.formatPlayerText(ev.id)} 代替死亡！`);
                    } else if (ev.cause === CAUSES.CHARM) {
                        Helpers.addHistory(`💔 ${Helpers.formatPlayerText(ev.sourceId)} 死亡，觸發魅惑連帶帶走 ${Helpers.formatPlayerText(ev.id)}`);
                    } else if (ev.cause === CAUSES.DREAM_LINK) {
                        Helpers.addHistory(`💔 ${Helpers.formatPlayerText(ev.sourceId)} 死亡，夢遊目標 ${Helpers.formatPlayerText(ev.id)} 同生共死`);
                    } else if (ev.cause === CAUSES.DEMON_HUNT_SUCCESS) {
                        Helpers.addHistory(`🏹 ${Helpers.formatPlayerText(setupState.initialRoleSetup.demonHunter)} 成功狩獵了 ${Helpers.formatPlayerText(ev.id)}`);
                    } else if (ev.cause === CAUSES.DEMON_HUNT_FAIL) {
                        Helpers.addHistory(`🏹 ${Helpers.formatPlayerText(setupState.initialRoleSetup.demonHunter)} 狩獵失誤遭到反噬！`);
                    } else if (ev.cause === CAUSES.BLACK_MERCHANT_BACKLASH) {
                        Helpers.addHistory(`💔 ${Helpers.formatPlayerText(setupState.initialRoleSetup.blackMerchant)} 交易給狼陣營，遭到反噬死亡`);
                    } else if (ev.cause === CAUSES.EK_REFLECTION) {
                        Helpers.addHistory(`💔 ${Helpers.formatPlayerText(setupState.initialRoleSetup.evilKnight)} 發動反傷技能，反噬了 ${Helpers.formatPlayerText(ev.id)}`);
                    } else if (ev.cause === CAUSES.SCENT_LINK) {
                        Helpers.addHistory(`💔 ${Helpers.formatPlayerText(ev.sourceId)} 死亡，尋香魅影連結觸發，${Helpers.formatPlayerText(ev.id)} 殉情死亡！`);
                    }
                });
            }
        };

        const RoleStrategies = {
            dittoWolfKing: { id: 'dittoWolfKing', name: ROLES.DITTO_WOLF_KING, emoji: '🎭', type: FACTIONS.WOLF, selectable: false, executeOrder: 2, componentName: 'phase-ditto-wolf-king' },
            magician: { id: 'magician', name: ROLES.MAGICIAN, emoji: '🎩', type: FACTIONS.GOD, selectable: true, executeOrder: 5, componentName: 'phase-magician' },
            blackMerchant: { id: 'blackMerchant', name: ROLES.BLACK_MERCHANT, emoji: '💰', type: FACTIONS.GOD, selectable: true, executeOrder: 6, componentName: 'phase-black-merchant' },
            nightmare: { id: 'nightmare', name: ROLES.NIGHTMARE, emoji: '👻', type: FACTIONS.WOLF, selectable: true, executeOrder: 10, componentName: 'phase-nightmare' },
            guard: { id: 'guard', name: ROLES.GUARD, emoji: '🛡️', type: FACTIONS.GOD, selectable: true, executeOrder: 20, componentName: 'phase-guard' },
            gargoyle: { id: 'gargoyle', name: ROLES.GARGOYLE, emoji: '🗿', type: FACTIONS.WOLF, selectable: true, executeOrder: 22, componentName: 'phase-gargoyle' },
            dreamer: { id: 'dreamer', name: ROLES.DREAMER, emoji: '💤', type: FACTIONS.GOD, selectable: true, executeOrder: 25, componentName: 'phase-dreamer' },
            wolfBrotherPhase: { id: 'wolfBrotherPhase', name: '狼兄狼弟', emoji: '🧑‍🤝‍🧑', type: FACTIONS.WOLF, selectable: false, executeOrder: 27, componentName: 'phase-wolf-brothers' },
            wolfYoungerBrotherPhase: { id: 'wolfYoungerBrotherPhase', name: '狼弟(復仇)', emoji: '🐺👦', type: FACTIONS.WOLF, selectable: false, executeOrder: 28, componentName: 'phase-wolf-younger' },
            mechWolf: { id: 'mechWolf', name: ROLES.MECH_WOLF, emoji: '🤖', type: FACTIONS.WOLF, selectable: true, executeOrder: 29, componentName: 'phase-mech-wolf' },
            scentPhantom: { id: 'scentPhantom', name: ROLES.SCENT_PHANTOM, emoji: '🥀', type: FACTIONS.WOLF, selectable: true, executeOrder: 29.5, componentName: 'phase-scent-phantom' },
            wolf: { id: 'wolf', name: ROLES.WOLF, emoji: '🐺', type: FACTIONS.WOLF, selectable: false, executeOrder: 30, componentName: 'phase-wolf' },
            demonEmperor: { id: 'demonEmperor', name: ROLES.DEMON_EMPEROR, emoji: '👿', type: FACTIONS.WOLF, selectable: true, executeOrder: 32, componentName: 'phase-demon-emperor' },
            sage: { id: 'sage', name: ROLES.SAGE, emoji: '☯️', type: FACTIONS.GOD, selectable: true, executeOrder: 33, componentName: 'phase-sage' },
            giftedPhase: { id: 'giftedPhase', name: '幸運兒', emoji: '🎁', type: FACTIONS.GOD, selectable: false, executeOrder: 35, componentName: 'phase-gifted' },
            witch: { id: 'witch', name: ROLES.WITCH, emoji: '🧙‍♀️', type: FACTIONS.GOD, selectable: true, executeOrder: 40, componentName: 'phase-witch' },
            demonHunter: { id: 'demonHunter', name: ROLES.DEMON_HUNTER, emoji: '🏹', type: FACTIONS.GOD, selectable: true, executeOrder: 45, componentName: 'phase-demon-hunter' },

            shadow: { id: 'shadow', name: ROLES.SHADOW, emoji: '🏮', type: FACTIONS.VILLAGER, selectable: true, executeOrder: 101, componentName: 'phase-shadow' },
            medium: { id: 'medium', name: ROLES.MEDIUM, emoji: '🔮', type: FACTIONS.GOD, selectable: true, executeOrder: 102, componentName: 'phase-medium' },

            evilKnight: { id: 'evilKnight', name: ROLES.EVIL_KNIGHT, emoji: '🏍️', type: FACTIONS.WOLF, selectable: true, executeOrder: -1 },
            bloodMoon: { id: 'bloodMoon', name: ROLES.BLOOD_MOON, emoji: '🌕', type: FACTIONS.WOLF, selectable: true, executeOrder: -1 },
            wolfBrothers: { id: 'wolfBrothers', name: '狼兄狼弟', emoji: '🧑‍🤝‍🧑', type: FACTIONS.WOLF, selectable: true, executeOrder: -1 },
            scentPhantomResult: { id: 'scentPhantomResult', executeOrder: 31, componentName: 'phase-scent-phantom-result', selectable: false },
            gargoyleResult: { id: 'gargoyleResult', executeOrder: 996, componentName: 'phase-gargoyle-result', selectable: false },
            blackMerchantReceive: { id: 'blackMerchantReceive', executeOrder: 998, componentName: 'phase-black-merchant-receive', selectable: false },
            mechWolfResult: { id: 'mechWolfResult', executeOrder: 999, componentName: 'phase-mech-wolf-result', selectable: false }
        };

        const getNormalWolfCount = () => {
            let spWolfCount = ['nightmare', 'blackWolf', 'wolfBeauty', 'awakenedWolfBeauty', 'evilKnight', 'gargoyle', 'mechWolf', 'bloodMoon', 'scentPhantom', 'demonEmperor'].filter(k => setupState.activeRoles[k]).length;
            if (setupState.activeRoles.wolfBrothers) spWolfCount += 2;
            if (setupState.isDittoWolfKingMode) spWolfCount += 1;
            const maxW = setupState.playerCount <= 10 ? 3 : 4;
            return Math.max(0, maxW - spWolfCount);
        };

        // =========================================
        // UI 元件宣告區 (Components)
        // =========================================
        const PhaseGrid = defineComponent({
            props: ['title', 'emoji', 'colorClass', 'recordKey', 'checkFearedRoles', 'roleId', 'disableCondition', 'actionText', 'actionZeroText', 'hideZeroBtn'],
            emits: ['prev', 'next'],

        // =========================================
        // 白天結算模組 (Morning Phase)
        // =========================================
        const MorningPhase = defineComponent({
            emits: ['start-night', 'game-over', 'prev-to-night', 'save-vote-backup'],
            setup(props, { emit }) {
                const alivePlayers = computed(() => gameState.players.filter(p => p.alive));
                const explodableWolves = computed(() => alivePlayers.value.filter(p => [ROLES.WOLF, ROLES.BLACK_WOLF, ROLES.BLOOD_MOON].includes(p.role)));

                const popShooter = () => {
                    const win = Helpers.checkWinCondition();
                    if (win) { gameState.pendingGameOver = win; emit('game-over'); return; }

                    if (morningState.daytimeCharmDeaths.length > 0) {
                        morningState.step = STEPS.CHARM_REVEAL;
                        let charmHtml = '';
                        morningState.daytimeCharmDeaths.forEach(d => {
                            if (d.type === CAUSES.CHARM) charmHtml += `<div><h2 style="margin:0; color:white;">${d.source}號玩家死亡<br>${d.target}號玩家殉情</h2></div>`;
                            else if (d.type === CAUSES.AWB_SUB) charmHtml += `<div><h2 style="margin:0; color:white;">${d.target}號玩家殉情</h2><p style="color:#aaa; margin:5px 0 0 0; font-size:14px;">(覺醒狼美人發動替死)</p></div>`;
                            else if (d.type === CAUSES.SCENT_LINK) charmHtml += `<div><h2 style="margin:0; color:white;">${d.target}號玩家殉情</h2><p style="color:#aaa; margin:5px 0 0 0; font-size:14px;">(尋香魅影發動連結)</p></div>`;
                        });
                        morningState.resultHtml = charmHtml;
                        morningState.daytimeCharmDeaths = [];
                        return;
                    }

                    if (morningState.shootQueue.length > 0) {
                        morningState.currentShooter = morningState.shootQueue.shift();
                        if (morningState.currentShooter.role === ROLES.AWAKENED_HUNTER) morningState.step = STEPS.AH_SHOOT;
                        else morningState.step = STEPS.SHOOT;
                    } else {
                        if (morningState.isVotingDone) emit('start-night');
                        else { morningState.step = STEPS.VOTE; emit('save-vote-backup'); }
                    }
                };

                const triggerDayDeath = (p, cause) => {
                    let resolution = SettlementEngine.resolveDeaths([{id: p.id, cause: cause}], 'day');
                    SettlementEngine.applyDeaths(resolution);
                    morningState.shootQueue.push(...resolution.gunQueue);
                    morningState.daytimeCharmDeaths.push(...resolution.charmLog);
                };

                const setKnightDuelTarget = (id) => { morningState.knightDuelTarget = id; morningState.voteTarget = 0; morningState.explodeTarget = 0; };
                const confirmDuel = () => {
                    const targetId = morningState.knightDuelTarget;
                    nightState.knightUsed = true;
                    const target = Helpers.getPlayer(targetId);
                    morningState.knightDuelInfo = { id: targetId, role: target.role, isWolf: Helpers.isWolf(targetId) };
                    morningState.step = STEPS.KNIGHT_REVEAL;
                };

                const confirmKnightReveal = () => {
                    const targetId = morningState.knightDuelInfo.id;
                    const knightId = setupState.initialRoleSetup.knight;
                    const knightFormat = Helpers.formatPlayerText(knightId);
                    const targetFormat = Helpers.formatPlayerText(targetId);
                    
                    if (morningState.knightDuelInfo.isWolf) {
                        let res = SettlementEngine.resolveDeaths([{id: targetId, cause: CAUSES.DUEL_WOLF}], 'day');
                        if (res.finalEvents.length === 0 && gameState.activeYangIds.includes(targetId)) {
                            Helpers.addHistory(`⚔️ ${knightFormat} 決鬥了 ${targetFormat}，但其受到 [純陽] 庇護，免除了決鬥死亡！`);
                            morningState.resultHtml += `<br><span style="color:var(--btn-success);">⚔️ 決鬥成功，但 ${targetFormat} 受到庇護免死！</span>`;
                        } else {
                            Helpers.addHistory(`⚔️ ${knightFormat} 決鬥了 ${targetFormat}，狼人死亡！`);
                            morningState.resultHtml += `<br><span style="color:var(--btn-success);">⚔️ 決鬥成功！${targetFormat} 死亡！</span>`;
                            SettlementEngine.applyDeaths(res);
                        }
                        morningState.isVotingDone = true; 
                    } else {
                        let res = SettlementEngine.resolveDeaths([{id: knightId, cause: CAUSES.DUEL_KNIGHT}], 'day');
                        if (res.finalEvents.length === 0 && gameState.activeYangIds.includes(knightId)) {
                            Helpers.addHistory(`⚔️ ${knightFormat} 決鬥了 ${targetFormat}，好人平安，且 ${knightFormat} 受到 [純陽] 庇護免死！`);
                            morningState.resultHtml += `<br><span style="color:var(--btn-danger);">⚔️ 決鬥失敗，好人平安，且 ${knightFormat} 受到庇護免死！</span>`;
                        } else {
                            Helpers.addHistory(`⚔️ ${knightFormat} 決鬥了 ${targetFormat}，好人平安，${knightFormat} 以死謝罪！`);
                            morningState.resultHtml += `<br><span style="color:var(--btn-danger);">⚔️ 決鬥失敗！${knightFormat} 以死謝罪！</span>`;
                            SettlementEngine.applyDeaths(res);
                            morningState.shootQueue.push(...res.gunQueue);
                            morningState.daytimeCharmDeaths.push(...res.charmLog);
                        }
                    }
                    morningState.knightDuelTarget = 0; morningState.knightDuelInfo = null; popShooter(); 
                };

                const confirmVote = () => {
                    if (morningState.voteTarget !== 0) {
                        const target = Helpers.getPlayer(morningState.voteTarget);

                        if (target.role === ROLES.IDIOT && !gameState.idiotRevealed) {
                            Helpers.addHistory(`🤪 投票放逐了 ${Helpers.formatPlayerText(morningState.voteTarget)}，但其為【白癡】！觸發被動技能翻牌，免除本次死亡！`);
                            gameState.lastExiledRole = null;
                            morningState.voteTarget = 0;
                            morningState.isVotingDone = true;
                            gameState.idiotRevealed = true;
                            popShooter();
                            return;
                        }

                        const isLastWolf = alivePlayers.value.filter(p => Helpers.isWolf(p.id)).length === 1;
                        
                        if (target.role === ROLES.BLOOD_MOON && isLastWolf) {
                            Helpers.addHistory(`🌕 投票放逐了 ${Helpers.formatPlayerText(morningState.voteTarget)}，但其為【血月使徒】且是最後一狼！觸發血脈存活，強行進入黑夜多殺一人！`);
                            gameState.lastExiledRole = null; 
                            morningState.voteTarget = 0;
                            morningState.isVotingDone = true;
                            gameState.bloodMoonLastStand = true;
                            popShooter();
                            return;
                        }

                        let res = SettlementEngine.resolveDeaths([{id: target.id, cause: CAUSES.VOTE}], 'day');
                        if (res.finalEvents.length === 0 && gameState.activeYangIds.includes(target.id)) {
                            gameState.lastExiledRole = null;
                            Helpers.addHistory(`🗳️ 白天投票放逐了 ${Helpers.formatPlayerText(morningState.voteTarget)}，但其受到 [純陽] 庇護，免除了放逐死亡！`);
                        } else {
                            gameState.lastExiledRole = target.isDitto ? ROLES.DITTO_WOLF_KING : target.role;
                            Helpers.addHistory(`🗳️ 白天投票放逐了 ${Helpers.formatPlayerText(morningState.voteTarget)}`);
                            SettlementEngine.applyDeaths(res);
                            morningState.shootQueue.push(...res.gunQueue);
                            morningState.daytimeCharmDeaths.push(...res.charmLog);
                        }
                    } else {
                        gameState.lastExiledRole = null;
                        Helpers.addHistory(`🗳️ 白天投票結果為 無人出局`);
                    }
                    morningState.isVotingDone = true; popShooter();
                };

                const confirmExplode = () => {
                    if (morningState.explodeTarget !== 0) {
                        const target = Helpers.getPlayer(morningState.explodeTarget);
                        if (target.role === ROLES.BLOOD_MOON) {
                            gameState.bloodMoonSealed = true;
                            Helpers.addHistory(`💣 ${Helpers.formatPlayerText(morningState.explodeTarget)} (血月使徒) 選擇自爆！今夜所有神職技能將被強行封印！`);
                        } else {
                            Helpers.addHistory(`💣 ${Helpers.formatPlayerText(morningState.explodeTarget)} 選擇自爆！`);
                        }
                        triggerDayDeath(target, CAUSES.EXPLODE);
                    }
                    morningState.explodeTarget = 0; morningState.voteTarget = 0; morningState.knightDuelTarget = 0; morningState.isVotingDone = true; popShooter();
                };
                
                const confirmShoot = () => {
                    const target = morningState.shootTarget;
                    const shooter = morningState.currentShooter;
                    
                    if (target !== 0) {
                        const targetInfo = Helpers.getPlayer(target);
                        let isNightDeath = ![CAUSES.VOTE, CAUSES.EXPLODE, CAUSES.DUEL_WOLF, CAUSES.DUEL_KNIGHT, CAUSES.AH_SHOT_DAY].includes(shooter.cause);
                        
                        let resolution = SettlementEngine.resolveDeaths([{id: targetInfo.id, cause: CAUSES.SHOT}], isNightDeath ? 'night' : 'day');
                        
                        if (resolution.finalEvents.length === 0 && (gameState.activeYangIds.includes(targetInfo.id) || gameState.activeYinIds.includes(targetInfo.id))) {
                            Helpers.addHistory(`🔫 ${Helpers.formatPlayerText(shooter.id)} 開槍擊中 ${Helpers.formatPlayerText(target)}，但其受到陰陽庇護，免疫了傷害！`);
                            morningState.resultHtml += `<br><span>💥 ${shooter.role} 開槍，但 ${Helpers.formatPlayerText(target)} 受到庇護免疫傷害</span>`;
                        } else if (targetInfo.role === ROLES.DEMON_HUNTER && isNightDeath && shooter.role !== ROLES.BLACK_WOLF) {
                            Helpers.addHistory(`🔫 ${Helpers.formatPlayerText(shooter.id)} 開槍帶走 ${Helpers.formatPlayerText(target)}，但 ${Helpers.formatPlayerText(target)} 免疫了夜槍傷害`);
                            morningState.resultHtml += `<br><span>💥 ${shooter.role} 開槍，但 ${Helpers.formatPlayerText(target)} 免疫了傷害</span>`;
                        } else {
                            Helpers.addHistory(`🔫 ${Helpers.formatPlayerText(shooter.id)} 開槍帶走了 ${Helpers.formatPlayerText(target)}`);
                            morningState.resultHtml += `<br><span>💥 ${shooter.role} 開槍帶走了 ${Helpers.formatPlayerText(target)}</span>`;
                            SettlementEngine.applyDeaths(resolution);
                            morningState.shootQueue.push(...resolution.gunQueue);
                            morningState.daytimeCharmDeaths.push(...resolution.charmLog);
                        }
                        morningState.lastShotTarget = target; morningState.lastShooterRole = shooter.role; morningState.step = STEPS.SHOOT_REVEAL;
                    } else {
                        Helpers.addHistory(`🔫 ${Helpers.formatPlayerText(shooter.id)} 選擇壓槍`);
                        morningState.resultHtml += `<br><span style="color:#aaa;">💥 ${shooter.role} 選擇壓槍</span>`;
                        popShooter();
                    }
                    morningState.shootTarget = 0;
                };

                const findClosestWolf = (startId, dir) => {
                    let n = setupState.playerCount; let curr = startId;
                    for (let i = 0; i < n; i++) {
                        curr += dir;
                        if (curr > n) curr = 1; if (curr < 1) curr = n;
                        let p = gameState.players.find(x => x.id === curr);
                        if (p && p.alive && Helpers.isWolf(p.id)) return p.id;
                    }
                    return null;
                };

                const confirmAhShoot = () => {
                    let dir = morningState.ahDirection; let shooter = morningState.currentShooter;
                    if (dir === 0) {
                        Helpers.addHistory(`🔫 ${Helpers.formatPlayerText(shooter.id)} 選擇壓槍`);
                        morningState.resultHtml += `<br><span style="color:#aaa;">💥 覺醒獵人 選擇壓槍</span>`;
                        morningState.ahDirection = null; popShooter();
                    } else {
                        let target = findClosestWolf(shooter.id, dir);
                        if (target) {
                            let isNightDeath = ![CAUSES.VOTE, CAUSES.EXPLODE, CAUSES.DUEL_WOLF, CAUSES.DUEL_KNIGHT, CAUSES.AH_SHOT_DAY].includes(shooter.cause);
                            let targetInfo = Helpers.getPlayer(target);
                            
                            let resolution = SettlementEngine.resolveDeaths([{id: targetInfo.id, cause: isNightDeath ? CAUSES.AH_SHOT : CAUSES.AH_SHOT_DAY}], isNightDeath ? 'night' : 'day');

                            if (resolution.finalEvents.length === 0 && (gameState.activeYangIds.includes(targetInfo.id) || gameState.activeYinIds.includes(targetInfo.id))) {
                                Helpers.addHistory(`🔫 ${Helpers.formatPlayerText(shooter.id)} 向${dir>0?'遞增':'遞減'}方向開槍擊中 ${Helpers.formatPlayerText(target)}，但其受到陰陽庇護，免疫了傷害！`);
                                morningState.resultHtml += `<br><span>💥 覺醒獵人 開槍，但 ${Helpers.formatPlayerText(target)} 受到庇護免疫傷害</span>`;
                            } else if (targetInfo.role === ROLES.DEMON_HUNTER && isNightDeath && shooter.role !== ROLES.BLACK_WOLF) {
                                Helpers.addHistory(`🔫 ${Helpers.formatPlayerText(shooter.id)} 向${dir>0?'遞增':'遞減'}方向開槍擊中 ${Helpers.formatPlayerText(target)}，但 ${Helpers.formatPlayerText(target)} 免疫了夜槍傷害`);
                                morningState.resultHtml += `<br><span>💥 覺醒獵人 開槍，但 ${Helpers.formatPlayerText(target)} 免疫了傷害</span>`;
                            } else {
                                Helpers.addHistory(`🔫 ${Helpers.formatPlayerText(shooter.id)} 向${dir>0?'遞增':'遞減'}方向開槍，擊中了 ${Helpers.formatPlayerText(target)}`);
                                morningState.resultHtml += `<br><span>💥 覺醒獵人 開槍擊殺了 ${Helpers.formatPlayerText(target)}</span>`;
                                SettlementEngine.applyDeaths(resolution);
                                morningState.shootQueue.push(...resolution.gunQueue);
                                morningState.daytimeCharmDeaths.push(...resolution.charmLog);
                            }
                            morningState.ahDirection = null; morningState.lastShotTarget = target; morningState.lastShooterRole = shooter.role; morningState.step = STEPS.SHOOT_REVEAL;
                        } else {
                            Helpers.addHistory(`🔫 ${Helpers.formatPlayerText(shooter.id)} 開槍，但場上已無狼人`);
                            morningState.resultHtml += `<br><span style="color:#aaa;">💥 覺醒獵人 開槍，但場上已無狼人</span>`;
                            morningState.ahDirection = null; popShooter();
                        }
                    }
                };

                return { setupState, gameState, nightState, morningState, alivePlayers, explodableWolves, confirmVote, confirmExplode, popShooter, confirmShoot, confirmAhShoot, Helpers, setKnightDuelTarget, confirmDuel, confirmKnightReveal, ROLES, CLASSES, STEPS };
            },
            template: `
                <div>
                    <div v-if="morningState.step === STEPS.MORNING_REVEAL" class="action-row">
                        <h3 style="color: #ff9800;">🌅 昨晚傷亡結果</h3>
                        <div class="result-box" style="margin-top: 15px; margin-bottom: 15px; font-size: 18px;" v-html="morningState.resultHtml"></div>
                        <div class="nav-buttons">
                            <button class="btn-prev" @click="$emit('prev-to-night')">⬅️ 回到黑夜</button>
                            <button @click="popShooter">確認進入下一步 ➡️</button>
                        </div>
                    </div>
                    
                    <div v-else-if="morningState.step === STEPS.SHOOT_REVEAL" class="action-row">
                        <h3 style="color: #ff9800;">🔫 開槍結果</h3>
                        <div class="witch-alert-active" style="background: rgba(255, 77, 77, 0.1); border-color: var(--btn-danger); text-align: center; margin-bottom: 10px; padding: 15px;">
                            <h2 style="margin:0; color:white;" v-html="Helpers.formatPlayerText(morningState.lastShotTarget) + ' 被開槍帶走'"></h2>
                            <p style="margin:5px 0 0 0; font-size: 14px; color:#ddd;">(開槍者：{{ morningState.lastShooterRole }})</p>
                        </div>
                        <div class="nav-buttons">
                            <button class="btn-prev" @click="$emit('prev-to-night')">⬅️ 回到黑夜</button>
                            <button @click="popShooter">確認進入下一步 ➡️</button>
                        </div>
                    </div>

                    <div v-else-if="morningState.step === STEPS.CHARM_REVEAL" class="action-row">
                        <h3 style="color: #ff4d4d;">💔 殉情結算</h3>
                        <div class="witch-alert-active" style="background: rgba(255, 77, 77, 0.1); border-color: var(--btn-danger); text-align: center; margin-bottom: 10px; padding: 15px;" v-html="morningState.resultHtml"></div>
                        <div class="nav-buttons">
                            <button class="btn-prev" @click="$emit('prev-to-night')">⬅️ 回到黑夜</button>
                            <button @click="popShooter">確認進入下一步 ➡️</button>
                        </div>
                    </div>

                    <div v-else-if="morningState.step === STEPS.KNIGHT_REVEAL && morningState.knightDuelInfo" class="action-row">
                        <h3 style="color: #c879ff;">⚔️ 騎士決鬥結果</h3>
                        <div class="witch-alert-active" :style="{ borderColor: morningState.knightDuelInfo.isWolf ? 'var(--btn-success)' : 'var(--btn-danger)', background: morningState.knightDuelInfo.isWolf ? 'rgba(76, 175, 80, 0.2)' : 'rgba(255, 77, 77, 0.2)' }" style="text-align: center; margin-bottom: 10px; padding: 15px;">
                            <h2 style="margin:0; color:white;"><span :class="Helpers.getRoleColorClass(morningState.knightDuelInfo.role)">{{ morningState.knightDuelInfo.id }} 號</span> 是 {{ morningState.knightDuelInfo.isWolf ? '狼陣營！' : '好人陣營！' }}</h2>
                            <p style="margin:5px 0 0 0; font-size: 14px; color:#ddd;">
                                {{ morningState.knightDuelInfo.isWolf ? '決鬥成功！狼人死亡。' : '決鬥失敗！騎士以死謝罪。' }}
                            </p>
                            <p style="margin:15px 0 0 0; font-size: 18px; font-weight: bold; color:white;">
                                {{ morningState.knightDuelInfo.isWolf ? '天黑請閉眼' : '請繼續投票放逐' }}
                            </p>
                        </div>
                        <div class="nav-buttons">
                            <button class="btn-prev" @click="$emit('prev-to-night')">⬅️ 回到黑夜</button>
                            <button @click="confirmKnightReveal">確認進入下一步 ➡️</button>
                        </div>
                    </div>
                    
                    <div v-else-if="morningState.step === STEPS.AH_SHOOT" class="action-row">
                        <h3 style="color: #ff9800;">🔫✨ {{ morningState.currentShooter.role }} ({{ morningState.currentShooter.id }}號) 出局，請選擇開槍方向：</h3>
                        <div class="player-grid-container" style="gap: 15px; margin-top: 20px;">
                            <div :class="['player-grid-btn zero-btn', { selected: morningState.ahDirection === 1 }]" @click="morningState.ahDirection = 1" style="padding: 15px; font-size: 18px;">⬆️ 號碼遞增方向</div>
                            <div :class="['player-grid-btn zero-btn', { selected: morningState.ahDirection === -1 }]" @click="morningState.ahDirection = -1" style="padding: 15px; font-size: 18px;">⬇️ 號碼遞減方向</div>
                            <div :class="['player-grid-btn zero-btn', { 'danger-selected': morningState.ahDirection === 0 }]" @click="morningState.ahDirection = 0" style="padding: 15px; font-size: 18px;">壓槍 (不發動)</div>
                        </div>
                        <div class="nav-buttons">
                            <button class="btn-prev" @click="$emit('prev-to-night')">⬅️ 回到黑夜</button>
                            <button @click="confirmAhShoot" :disabled="morningState.ahDirection === null">確認開槍 ➡️</button>
                        </div>
                    </div>
                    
                    <div v-else-if="morningState.step === STEPS.SHOOT" class="action-row">
                        <h3 style="color: #ff9800;">🔫 {{ morningState.currentShooter.role }} ({{ morningState.currentShooter.id }}號) 出局，請選擇帶走的玩家：</h3>
                        <div class="player-grid-container">
                            <div :class="['player-grid-btn zero-btn', { 'danger-selected': morningState.shootTarget === 0 }]" @click="morningState.shootTarget = 0">壓槍 (不帶走)</div>
                            <div v-for="p in alivePlayers" :key="p.id" :class="['player-grid-btn', p.class, { 'danger-selected': morningState.shootTarget === p.id }]" @click="morningState.shootTarget = p.id">
                                <span class="num">{{ p.id }} <span style="font-size: 14px; font-weight: normal; margin-left: 2px;">{{ p.role }}</span></span>
                            </div>
                        </div>
                        <div class="nav-buttons">
                            <button class="btn-prev" @click="$emit('prev-to-night')">⬅️ 回到黑夜</button>
                            <button @click="confirmShoot">確認開槍 ➡️</button>
                        </div>
                    </div>

                    <div v-else-if="morningState.step === STEPS.VOTE" class="action-row">
                        <div class="result-box" v-html="morningState.resultHtml"></div>
                        <h3 style="margin-top: 20px; color: #fff;">🗳️ 白天投票環節</h3>
                        <div class="player-grid-container">
                            <div :class="['player-grid-btn zero-btn', { selected: morningState.voteTarget === 0 }]" @click="morningState.voteTarget = 0; morningState.explodeTarget = 0; morningState.knightDuelTarget = 0;">無人出局 (棄票/平票)</div>
                            <div v-for="p in alivePlayers" :key="p.id" :class="['player-grid-btn', p.class, { selected: morningState.voteTarget === p.id }]" @click="morningState.voteTarget = p.id; morningState.explodeTarget = 0; morningState.knightDuelTarget = 0;"><span class="num">{{ p.id }} <span style="font-size: 14px; font-weight: normal;">{{ p.role }}</span></span></div>
                        </div>
                        <div class="nav-buttons">
                            <button class="btn-prev" @click="$emit('prev-to-night')">⬅️ 回到黑夜</button>
                            <button @click="confirmVote">確認放逐並天黑 ➡️</button>
                        </div>

                        <div v-if="explodableWolves.length > 0" style="margin-top: 20px; padding-top: 15px; border-top: 1px dashed #555;">
                            <h3 style="color: var(--color-wolf); margin-top: 0;">💣 狼人自爆 (跳過投票)</h3>
                            <p style="font-size: 13px; color: #aaa; margin-top:-5px;">(小狼、黑狼王、血月使徒可自爆)</p>
                            <div class="player-grid-container" style="margin-top: 10px;">
                                <div v-for="p in explodableWolves" :key="p.id" :class="['player-grid-btn', 'color-wolf', { 'danger-selected': morningState.explodeTarget === p.id }]" @click="morningState.explodeTarget = p.id; morningState.voteTarget = 0; morningState.knightDuelTarget = 0;">
                                    <span class="num">{{ p.id }} <span style="font-size: 14px; font-weight: normal; margin-left: 2px;">{{ p.role }}</span></span>
                                </div>
                            </div>
                            <div class="nav-buttons" v-if="morningState.explodeTarget !== 0">
                                <button @click="morningState.explodeTarget = 0" style="background-color: var(--btn-secondary);">取消自爆</button>
                                <button @click="confirmExplode" style="background-color: var(--btn-danger);">確認自爆並天黑 ➡️</button>
                            </div>
                        </div>

                        <div v-if="setupState.activeRoles.knight && !Helpers.isDead('knight') && !nightState.knightUsed" style="margin-top: 20px; padding-top: 15px; border-top: 1px dashed #555;">
                            <h3 style="color: var(--color-god); margin-top: 0;">⚔️ {{ ROLES.KNIGHT }}決鬥</h3>
                            <p style="font-size: 13px; color: #aaa; margin-top:-5px;">(若決鬥狼人，狼人死亡並天黑；若決鬥好人，騎士死亡繼續投票)</p>
                            <div class="player-grid-container" style="margin-top: 10px;">
                                <div v-for="p in alivePlayers" :key="p.id" v-show="p.id !== setupState.initialRoleSetup.knight" :class="['player-grid-btn', p.class, { 'danger-selected': morningState.knightDuelTarget === p.id }]" @click="setKnightDuelTarget(p.id)">
                                    <span class="num">{{ p.id }} <span style="font-size: 14px; font-weight: normal; margin-left: 2px;">{{ p.role }}</span></span>
                                </div>
                            </div>
                            <div class="nav-buttons" v-if="morningState.knightDuelTarget !== 0">

                            </div>
                        </div>
                    </div>
                </div>
            `
        });

        // =========================================
        // Setup & Game Screens
        // =========================================
        const SetupScreen = {
            template: `
                <div style="text-align:center; padding: 5px 0;">
                    <div style="margin-bottom: 10px;">
                        <label style="font-size: 18px; font-weight: bold;">玩家人數</label>
                        <div class="player-count-grid" style="margin-top: 5px;"><div v-for="count in [9, 10, 11, 12]" :key="count" :class="['player-count-btn', { selected: setupState.playerCount === count }]" @click="setupState.playerCount = count">{{ count }} 人局</div></div>
                    </div>
                    <div style="background: var(--panel-bg); padding: 15px; border-radius: 8px;">
                        <h3 style="color: var(--color-god); margin-top: 0; margin-bottom: 5px;">😇 配置神陣營</h3>
                        <div style="color: #aaa; font-size: 13px; font-weight: 300; margin-top:-5px; margin-bottom: 8px;">(選5張啟動百變狼王)</div>
                        <div class="role-grid" style="margin-bottom: 12px;"><div v-for="role in godRoles" :key="role.id" :class="['role-card', role.type, { selected: setupState.activeRoles[role.id] }]" @click="toggleRole(role.id)">{{ role.emoji }} {{ role.name }}</div></div>
                        
                        <h3 style="color: var(--color-wolf); margin-top: 5px; margin-bottom: 5px;">🐺 配置特殊狼人</h3>
                        <div class="role-grid" style="margin-bottom: 12px;"><div v-for="role in specialWolfRoles" :key="role.id" :class="['role-card', role.type, { selected: setupState.activeRoles[role.id] }]" @click="toggleRole(role.id)">{{ role.emoji }} {{ role.name }}</div></div>
                        
                        <h3 style="color: var(--color-villager); margin-top: 5px; margin-bottom: 5px;">🧑‍🌾 配置特殊平民</h3>
                        <div class="role-grid" style="margin-bottom: 5px;"><div v-for="role in specialVillagerRoles" :key="role.id" :class="['role-card', role.type, { selected: setupState.activeRoles[role.id] }]" @click="toggleRole(role.id)">{{ role.emoji }} {{ role.name }}</div></div>
                        
                        <button @click="startGame" style="background-color: var(--btn-primary); font-size: 18px; padding: 10px 30px; margin: 10px auto 0 auto;">遊戲開始</button>
                    </div>
                </div>
            `,
            setup() {
                const godRoles = computed(() => Object.values(RoleStrategies).filter(r => r.type === FACTIONS.GOD && r.selectable));
                const specialWolfRoles = computed(() => Object.values(RoleStrategies).filter(r => r.type === FACTIONS.WOLF && r.selectable && r.id !== 'wolfBrotherPhase' && r.id !== 'wolfYoungerBrotherPhase' && r.id !== 'dittoWolfKing'));
                const specialVillagerRoles = computed(() => Object.values(RoleStrategies).filter(r => r.type === FACTIONS.VILLAGER && r.selectable));

                const toggleRole = (roleId) => {
                    setupState.activeRoles[roleId] = !setupState.activeRoles[roleId];
                    if (roleId === 'shadow' && setupState.activeRoles.shadow) setupState.activeRoles.seer = true;
                    else if (roleId === 'seer' && !setupState.activeRoles.seer) setupState.activeRoles.shadow = false;
                };

                const startGame = () => {
                    try {
                        const activeGods = godRoles.value.filter(r => setupState.activeRoles[r.id]);
                        let spWolfCount = ['nightmare', 'blackWolf', 'wolfBeauty', 'awakenedWolfBeauty', 'evilKnight', 'gargoyle', 'mechWolf', 'bloodMoon', 'scentPhantom', 'demonEmperor'].filter(k => setupState.activeRoles[k]).length;
                        
                        if (setupState.activeRoles.wolfBrothers) spWolfCount += 2;
                        if (activeGods.length === 5) spWolfCount += 1; 
                        
                        const maxW = setupState.playerCount <= 10 ? 3 : 4;
                        
                        if (spWolfCount > maxW) {
                            const errorMsg = `【配置錯誤：特殊狼人過多】\n\n${setupState.playerCount} 人局的狼陣營總數不可超過 ${maxW} 名！\n您目前的特殊狼人（含百變狼王）已達 ${spWolfCount} 名，請減少狼人配置。`;
                            alert(errorMsg);
                            return; 
                        }

                        if (activeGods.length === 5) {
                            setupState.isDittoWolfKingMode = true;
                            const randomGod = activeGods[Math.floor(Math.random() * activeGods.length)];
                            setupState.dittoWolfKingRole = randomGod.id;
                            alert(`【百變狼王模式已啟動】\n系統偵測到 5 張神牌，隨機抽取「${randomGod.name}」成為百變狼王！\n（該角色底牌為狼人，與狼隊不互認，且擁有專屬變異技能）`);
                        } else {
                            setupState.isDittoWolfKingMode = false;
                            setupState.dittoWolfKingRole = null;
                        }

                        gameState.players = Array.from({ length: setupState.playerCount }, (_, i) => ({ id: i + 1, role: ROLES.VILLAGER, class: CLASSES.VILLAGER, alive: true, isDitto: false }));
                        const normalW = getNormalWolfCount();
                        setupState.initialRoleSetup.wolves = Array(normalW).fill(0);
                        gameState.scentPhantomRandomWolf = 0; // 重置隨機狼號碼
                        gameState.activeYangIds = [];
                        gameState.activeYinIds = [];

                        const activePhases = Object.values(RoleStrategies).filter(r => {
                            if (r.id === 'dittoWolfKing') return setupState.isDittoWolfKingMode && gameState.day > 1;
                            if (r.id === 'wolf') return true;
